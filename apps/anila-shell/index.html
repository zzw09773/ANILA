<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANILA</title>
<!-- Fonts intentionally NOT loaded from Google CDN — outer nginx ships a
     strict CSP (`style-src 'self' 'unsafe-inline'; font-src 'self' data:`)
     that forbids external stylesheet sources, and on-prem deploys may be
     air-gapped anyway. ``--font-sans`` and ``--font-mono`` below already
     fall through to system fonts (Noto Sans CJK TC on Linux, PingFang TC
     on macOS, Microsoft JhengHei on Windows; ui-monospace family for
     code) so the visual still reads as a Chinese-friendly UI without
     the CDN dependency. -->

<script>
  // ---- Tweak defaults (host may rewrite this block) ----
  window.ANILA_TWEAKS = /*EDITMODE-BEGIN*/{
    "accent": "#a05a2c",
    "dark": false,
    "density": 18,
    "sansFamily": "Noto Sans TC",
    "monoFamily": "ui-monospace",
    "agentSwitcherPosition": "bottom",
    "traceStyle": "collapsible"
  }/*EDITMODE-END*/;
</script>

<style>
  :root {
    --bg:            oklch(0.985 0.002 90);
    --bg-elev:       oklch(1 0 0);
    --bg-subtle:     oklch(0.965 0.003 90);
    --fg:            oklch(0.18 0.005 270);
    --fg-muted:      oklch(0.48 0.005 270);
    /* WCAG AA: darkened so subtle/status text clears 4.5:1 on --bg*. */
    --fg-subtle:     oklch(0.54 0.005 270);
    --border:        oklch(0.91 0.004 270);
    --border-strong: oklch(0.85 0.005 270);
    --accent:        #0b7285;
    --accent-fg:     #ffffff;
    --accent-soft:   oklch(0.95 0.02 200);
    --danger:        oklch(0.55 0.18 25);
    --warn:          oklch(0.55 0.14 75);
    --success:       oklch(0.54 0.10 150);

    --radius-sm: 4px;
    --radius:    6px;
    --radius-lg: 10px;

    /* System font stacks: Latin handles via -apple-system / Segoe UI / system-ui;
       Traditional Chinese falls through to whatever the OS ships (PingFang TC
       / Microsoft JhengHei / Noto Sans CJK TC). No webfont download needed. */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei",
      "PingFang TC", "Noto Sans CJK TC", system-ui, sans-serif;
    --font-mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --density: 16px;
  }

  [data-theme="dark"] {
    --bg:            oklch(0.16 0.004 270);
    --bg-elev:       oklch(0.20 0.004 270);
    --bg-subtle:     oklch(0.22 0.004 270);
    --fg:            oklch(0.96 0.003 90);
    --fg-muted:      oklch(0.72 0.005 270);
    /* WCAG AA: lighten subtle; dark accent/danger from light fail on dark bg,
       so override status colours here. Accent fill uses dark --accent-fg
       (white-on-light-teal cannot clear AA on this near-black bg). */
    --fg-subtle:     oklch(0.62 0.005 270);
    --border:        oklch(0.28 0.005 270);
    --border-strong: oklch(0.36 0.005 270);
    --accent:        oklch(0.62 0.09 200);
    --accent-fg:     #0a1214;
    --accent-soft:   oklch(0.30 0.04 200);
    --danger:        oklch(0.65 0.16 25);
    --warn:          oklch(0.78 0.12 75);
    --success:       oklch(0.72 0.10 150);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100%; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--fg); }

  /* Keyboard-only focus ring (a11y). Many inline-styled inputs set
     `outline: none` for the mouse aesthetic; :focus-visible only fires on
     keyboard navigation, so this restores a visible focus indicator for
     keyboard users without affecting mouse interaction. !important is the
     standard escape hatch to win over those inline outline:none values. */
  :focus-visible {
    outline: 2px solid var(--accent) !important;
    outline-offset: 1px;
    border-radius: var(--radius-sm);
  }
  /* Respect reduced-motion requests (vestibular safety / a11y). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Scrollbar — slim */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 999px;
    border: 3px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-subtle); }

  /* (list-density rules live below under .anila-msg-body so their
     specificity beats the .anila-msg-body p margin and they don't
     leak into other UI chrome like Settings panels.) */

  /* Claude.ai-style message chrome:
     - Assistant action toolbar is muted by default and fully revealed
       on hover / keyboard focus of the message, so the reading surface
       stays uncluttered.
     - On pointer-less devices (touch) we always reveal it. */
  .anila-msg-actions {
    opacity: 0;
    transition: opacity 140ms ease;
  }
  .anila-msg-assistant:hover .anila-msg-actions,
  .anila-msg-assistant:focus-within .anila-msg-actions {
    opacity: 1;
  }
  @media (hover: none) {
    .anila-msg-actions { opacity: 1; }
  }

  /* Prose rhythm inside assistant replies. Tightens paragraph stacking
     so a multi-paragraph answer reads as one flowing block, while
     keeping headings visually distinct. Matches OpenWebUI / ChatGPT
     compact density — margins inside lists collapse to near-zero so
     numbered items stay readable without airy gaps. */
  .anila-msg-body p { margin: 0 0 10px 0; }
  .anila-msg-body p:last-child { margin-bottom: 0; }

  /* Content headings are LLM-emitted section titles (e.g. "問題答案").
     Keep them readable but restrained so they don't compete with the
     actual H1 of the page. */
  .anila-msg-body h1 { font-size: 17px; font-weight: 600; margin: 16px 0 6px; }
  .anila-msg-body h2 { font-size: 15px; font-weight: 600; margin: 14px 0 5px; }
  .anila-msg-body h3 { font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  .anila-msg-body h1:first-child,
  .anila-msg-body h2:first-child,
  .anila-msg-body h3:first-child { margin-top: 0; }

  /* Lists: dense like OpenWebUI. Key fix: override .anila-msg-body p
     margin inside <li> — otherwise every loose-list item gains 10px
     trailing space and numbered answers visibly "air out". */
  .anila-msg-body ul,
  .anila-msg-body ol { margin: 6px 0; padding-left: 22px; }
  .anila-msg-body li { margin: 2px 0; }
  .anila-msg-body li > p { margin: 0 0 2px 0; }
  .anila-msg-body li > ul,
  .anila-msg-body li > ol { margin: 2px 0; }
  .anila-msg-body li > *:last-child { margin-bottom: 0; }

  .anila-msg-body pre {
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }
  .anila-msg-body code {
    font-family: var(--font-mono);
    font-size: 0.92em;
  }
  .anila-msg-body blockquote {
    margin: 10px 0;
    padding: 4px 12px;
    border-left: 3px solid var(--border-strong, var(--border));
    color: var(--fg-muted);
  }

  /* Reasoning summary — Claude.ai-style ghost row. Hover gives it a
     subtle hit target; the disclosure body uses only a left border
     (no background box) so it doesn't feel like another card. */
  .anila-reasoning-toggle:hover {
    background: var(--bg-subtle);
    color: var(--fg-muted);
  }
  .anila-reasoning-spinner {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    border-top-color: var(--fg-muted);
    animation: anila-reasoning-spin 0.7s linear infinite;
  }
  @keyframes anila-reasoning-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes anila-blink { 50% { opacity: 0; } }

  /* 品牌影片畫布有大片白邊，線稿只佔中間；wrap 裁切並放大，讓線寬夠看得見。
     scale 必須讓右側圓點尾巴進框（2.05 會切尾）。亮色 multiply 去白底；
     暗色反相成白線後 screen 溶黑底。不要墊淺色方塊。 */
  .anila-brand-video-wrap {
    margin: 0 auto;
    overflow: hidden;
    line-height: 0;
    mix-blend-mode: multiply;
    background: transparent;
  }
  .anila-brand-video {
    display: block;
    width: 100%;
    height: auto;
    transform: scale(1.78);
    transform-origin: 51% 49%;
    background: transparent;
  }
  [data-theme="dark"] .anila-brand-img {
    filter: brightness(0) invert(1);
  }
  [data-theme="dark"] .anila-brand-video-wrap {
    mix-blend-mode: screen;
  }
  [data-theme="dark"] .anila-brand-video {
    filter: invert(1) grayscale(1) contrast(1.6);
    background: transparent;
  }

  /* 思考步驟時間軸（2026-09-02）：一條安靜的直線、完成打勾、進行中的點會呼吸、
     進行中的字有一道微光掃過。減少動態偏好時全部靜止。 */
  .anila-steps {
    list-style: none; margin: 0; padding: 2px 0 0 4px;
    display: flex; flex-direction: column; gap: 0;
    font-size: 12.5px; color: var(--fg-muted);
  }
  .anila-step {
    position: relative; display: grid; grid-template-columns: 16px 1fr auto;
    align-items: baseline; column-gap: 10px; padding: 3px 0 7px;
  }
  .anila-step::before {
    content: ""; position: absolute; left: 7px; top: 16px; bottom: -2px; width: 1px;
    background: var(--border);
  }
  .anila-step:last-child::before { display: none; }
  .anila-step__marker {
    position: relative; z-index: 1; width: 15px; height: 15px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--success);
    border: 1px solid color-mix(in oklab, var(--success) 45%, var(--border));
    align-self: start; margin-top: 1px;
  }
  .anila-step--active .anila-step__marker { border-color: var(--accent); }
  .anila-step__pulse {
    width: 7px; height: 7px; border-radius: 999px; background: var(--accent);
    animation: anila-step-pulse 1.4s ease-in-out infinite;
  }
  @keyframes anila-step-pulse {
    0%, 100% { transform: scale(0.75); opacity: 0.55; box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 35%, transparent); }
    50%      { transform: scale(1);    opacity: 1;    box-shadow: 0 0 0 5px color-mix(in oklab, var(--accent) 0%, transparent); }
  }
  .anila-step__body { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
  .anila-step__label { color: var(--fg-muted); font-weight: 500; }
  .anila-step--active .anila-step__label { color: var(--fg); }
  .anila-step__label--shimmer {
    background: linear-gradient(90deg, var(--fg) 0%, var(--fg) 40%, var(--accent) 50%, var(--fg) 60%, var(--fg) 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: anila-step-shimmer 1.8s linear infinite;
  }
  @keyframes anila-step-shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .anila-step__detail { color: var(--fg-subtle); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52ch; }
  .anila-step__time { color: var(--fg-subtle); font-size: 11px; font-variant-numeric: tabular-nums; }
  .anila-reasoning__body { margin: 6px 0 2px 2px; padding: 4px 0 0 0; }
  @media (prefers-reduced-motion: reduce) {
    .anila-step__pulse, .anila-step__label--shimmer { animation: none; }
    .anila-step__label--shimmer { color: var(--fg); background: none; -webkit-text-fill-color: initial; }
  }

  .boot-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100dvh; color: var(--fg-muted);
    font-family: var(--font-mono); font-size: 13px;
  }

  /* 窄視窗：audit 列與 composer 提示不得把按鈕擠出畫面 */
  .anila-audit-watermark {
    max-width: 100%;
  }
  .anila-audit-watermark > span {
    min-width: 0;
  }
  .composer-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px 8px;
    flex-wrap: wrap;
  }
  .composer-enter-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--fg-subtle);
    flex-shrink: 0;
  }
  @media (max-width: 520px) {
    .composer-enter-hint { display: none; }
    .composer-toolbar { gap: 2px; }
  }
  .anila-md-table { max-width: 100%; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
