<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANILA</title>
<!-- Fonts intentionally NOT loaded from Google CDN — outer nginx ships a
     strict CSP (`style-src 'self' 'unsafe-inline'; font-src 'self' data:`)
     that forbids external stylesheet sources, and on-prem deploys may be
     air-gapped anyway. ``--font-sans`` and ``--font-mono`` below already
     fall through to system fonts (Noto Sans CJK TC on Linux, PingFang TC
     on macOS, Microsoft JhengHei on Windows; ui-monospace family for
     code) so the visual still reads as a Chinese-friendly UI without
     the CDN dependency. -->

<script>
  // ---- Tweak defaults (host may rewrite this block) ----
  // accent 預設 = 共用設計系統的官方藍（packages/ui tokens：--anila-color-accent）。
  window.ANILA_TWEAKS = /*EDITMODE-BEGIN*/{
    "accent": "#2b4c7e",
    "dark": false,
    "density": 18,
    "sansFamily": "Noto Sans TC",
    "monoFamily": "ui-monospace",
    "agentSwitcherPosition": "bottom",
    "traceStyle": "collapsible"
  }/*EDITMODE-END*/;
</script>

<style>
  :root {
    /* 橋接層：shell 舊變數 → 共用設計系統 @anila/ui tokens（--anila-*，由
       src/main.jsx import "@anila/ui/styles/tokens.css" 載入；淺色官方藍
       institutional，見 packages/ui/src/styles/tokens.css）。全站 inline
       style 沿用舊變數名即可自動跟隨共用主題，業務碼零改動。
       fallback 值 = 共用 tokens 的同值複本，僅用於 bundle CSS 尚未載入的
       首屏瞬間（boot screen），避免無樣式閃爍。 */
    --bg:            var(--anila-color-bg, oklch(0.977 0.002 250));
    --bg-elev:       var(--anila-color-bg-elev, oklch(1 0 0));
    --bg-subtle:     var(--anila-color-bg-subtle, oklch(0.958 0.004 250));
    --fg:            var(--anila-color-fg, oklch(0.24 0.02 260));
    --fg-muted:      var(--anila-color-fg-muted, oklch(0.47 0.018 260));
    --fg-subtle:     var(--anila-color-fg-subtle, oklch(0.62 0.014 260));
    --border:        var(--anila-color-border, oklch(0.90 0.006 250));
    --border-strong: var(--anila-color-border-strong, oklch(0.83 0.010 250));
    --accent:        var(--anila-color-accent, #2b4c7e);
    --accent-fg:     var(--anila-color-accent-fg, #ffffff);
    --accent-soft:   var(--anila-color-accent-soft, oklch(0.93 0.022 258));
    --danger:        var(--anila-color-danger, oklch(0.53 0.17 27));
    --warn:          var(--anila-color-warn, oklch(0.70 0.13 75));
    --success:       var(--anila-color-success, oklch(0.56 0.10 152));

    --radius-sm: var(--anila-radius-sm, 4px);
    --radius:    var(--anila-radius-md, 6px);
    --radius-lg: var(--anila-radius-lg, 8px);

    /* 字型堆疊同樣來自共用 tokens（系統字型、zh-TW aware、無 webfont）。 */
    --font-sans: var(--anila-font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Microsoft JhengHei", "PingFang TC", "Noto Sans CJK TC", system-ui, sans-serif);
    --font-mono: var(--anila-font-mono, ui-monospace, "JetBrains Mono", SFMono-Regular,
      Menlo, Consolas, monospace);

    --density: 16px;
  }

  /* 深色覆蓋：沿用改版前的值（第二主題屬後續 change brief，本次不交付）。
     共用 tokens 只出淺色；此段維持既有深色切換行為不退步。
     注意要同時覆蓋 legacy 變數（業務碼 inline style 用）與 --anila-*
     （@anila/ui 殼層元件直接吃 --anila-*）——tokens.css 文件化的主題
     擴充掛點就是這個 [data-theme] 覆蓋段。
     選擇器用 :root[data-theme="dark"]（特異性 0,2,0）：bundle 的
     tokens.css <link> 在本 <style> 之後載入，同特異性時 :root{淺色}
     會以文件序勝出，必須用更高特異性壓回。 */
  :root[data-theme="dark"] {
    --bg:            oklch(0.16 0.004 270);
    --bg-elev:       oklch(0.20 0.004 270);
    --bg-subtle:     oklch(0.22 0.004 270);
    --fg:            oklch(0.96 0.003 90);
    --fg-muted:      oklch(0.72 0.005 270);
    --fg-subtle:     oklch(0.55 0.005 270);
    --border:        oklch(0.28 0.005 270);
    --border-strong: oklch(0.36 0.005 270);
    --accent-soft:   oklch(0.30 0.04 200);

    --anila-color-bg:            oklch(0.16 0.004 270);
    --anila-color-bg-elev:       oklch(0.20 0.004 270);
    --anila-color-bg-subtle:     oklch(0.22 0.004 270);
    --anila-color-fg:            oklch(0.96 0.003 90);
    --anila-color-fg-muted:      oklch(0.72 0.005 270);
    --anila-color-fg-subtle:     oklch(0.55 0.005 270);
    --anila-color-border:        oklch(0.28 0.005 270);
    --anila-color-border-strong: oklch(0.36 0.005 270);
    --anila-color-accent-soft:   oklch(0.30 0.04 200);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100%; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--fg); }

  /* Keyboard-only focus ring (a11y). Many inline-styled inputs set
     `outline: none` for the mouse aesthetic; :focus-visible only fires on
     keyboard navigation, so this restores a visible focus indicator for
     keyboard users without affecting mouse interaction. !important is the
     standard escape hatch to win over those inline outline:none values. */
  :focus-visible {
    outline: 2px solid var(--accent) !important;
    outline-offset: 1px;
    border-radius: var(--radius-sm);
  }
  /* Respect reduced-motion requests (vestibular safety / a11y). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Scrollbar — slim */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 999px;
    border: 3px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-subtle); }

  /* (list-density rules live below under .anila-msg-body so their
     specificity beats the .anila-msg-body p margin and they don't
     leak into other UI chrome like Settings panels.) */

  /* Claude.ai-style message chrome:
     - Assistant action toolbar is muted by default and fully revealed
       on hover / keyboard focus of the message, so the reading surface
       stays uncluttered.
     - On pointer-less devices (touch) we always reveal it. */
  .anila-msg-actions {
    opacity: 0;
    transition: opacity 140ms ease;
  }
  .anila-msg-assistant:hover .anila-msg-actions,
  .anila-msg-assistant:focus-within .anila-msg-actions {
    opacity: 1;
  }
  @media (hover: none) {
    .anila-msg-actions { opacity: 1; }
  }

  /* Prose rhythm inside assistant replies. Tightens paragraph stacking
     so a multi-paragraph answer reads as one flowing block, while
     keeping headings visually distinct. Matches OpenWebUI / ChatGPT
     compact density — margins inside lists collapse to near-zero so
     numbered items stay readable without airy gaps. */
  .anila-msg-body p { margin: 0 0 10px 0; }
  .anila-msg-body p:last-child { margin-bottom: 0; }

  /* Content headings are LLM-emitted section titles (e.g. "問題答案").
     Keep them readable but restrained so they don't compete with the
     actual H1 of the page. */
  .anila-msg-body h1 { font-size: 17px; font-weight: 600; margin: 16px 0 6px; }
  .anila-msg-body h2 { font-size: 15px; font-weight: 600; margin: 14px 0 5px; }
  .anila-msg-body h3 { font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  .anila-msg-body h1:first-child,
  .anila-msg-body h2:first-child,
  .anila-msg-body h3:first-child { margin-top: 0; }

  /* Lists: dense like OpenWebUI. Key fix: override .anila-msg-body p
     margin inside <li> — otherwise every loose-list item gains 10px
     trailing space and numbered answers visibly "air out". */
  .anila-msg-body ul,
  .anila-msg-body ol { margin: 6px 0; padding-left: 22px; }
  .anila-msg-body li { margin: 2px 0; }
  .anila-msg-body li > p { margin: 0 0 2px 0; }
  .anila-msg-body li > ul,
  .anila-msg-body li > ol { margin: 2px 0; }
  .anila-msg-body li > *:last-child { margin-bottom: 0; }

  .anila-msg-body pre {
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }
  .anila-msg-body code {
    font-family: var(--font-mono);
    font-size: 0.92em;
  }
  .anila-msg-body blockquote {
    margin: 10px 0;
    padding: 4px 12px;
    border-left: 3px solid var(--border-strong, var(--border));
    color: var(--fg-muted);
  }

  /* Reasoning summary — Claude.ai-style ghost row. Hover gives it a
     subtle hit target; the disclosure body uses only a left border
     (no background box) so it doesn't feel like another card. */
  .anila-reasoning-toggle:hover {
    background: var(--bg-subtle);
    color: var(--fg-muted);
  }
  .anila-reasoning-spinner {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    border-top-color: var(--fg-muted);
    animation: anila-reasoning-spin 0.7s linear infinite;
  }
  @keyframes anila-reasoning-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes anila-blink { 50% { opacity: 0; } }

  /* ── 列印 / 轉 PDF(W1-1⑤)────────────────────────────────────────────────
     為什麼一定要有這一段:紙本與 PDF 是**外流面裡唯一不經任何程式碼的一條**。
     複製/匯出/分享都有 gate,而 Ctrl+P 之前完全沒有規則（全 repo
     `@media print` = 0 處），所以按下列印就是一份沒有密等、沒有浮水印、
     沒有紀錄的乾淨副本。

     三條規則,各自的理由:
       1. **密等頁首**在螢幕上隱藏、列印時出現。紙離開平台後,頁首上的密等是
          唯一還在的管制。
       2. **浮水印保留**。瀏覽器預設不印背景色/漸層,所以要顯式開
          `print-color-adjust: exact`,否則鑑識浮水印在紙上會消失。
       3. **`>= 機密` 遮蔽內文**（門檻刻意高於複製/匯出/分享的「> 無機密」,
          見 runtime/classified.js 的 CLASSIFICATION_PRINT_MASK_FLOOR）。遮蔽時
          仍然印出頁首與遮蔽說明 —— 印出一張空白紙的話,使用者會以為印壞了,
          然後改用手機拍螢幕(N-3 的同一個道理)。 */
  .anila-print-only { display: none; }

  @media print {
    /* UI chrome 不上紙:側欄、輸入區、工具列在紙上只是噪音。 */
    .anila-msg-actions,
    .anila-reasoning-toggle { display: none !important; }

    .anila-print-only { display: block !important; }
    .anila-print-header {
      position: static;
      margin: 0 0 12pt;
      padding: 8pt 10pt;
      border: 1.5pt solid #000;
      color: #000;
      font-family: var(--font-mono);
      font-size: 10pt;
      line-height: 1.5;
      break-inside: avoid;
    }
    .anila-print-mask-notice {
      margin-top: 6pt;
      padding-top: 6pt;
      border-top: 1pt dashed #000;
      font-weight: 700;
    }

    /* 浮水印:保留,並強迫印出背景(預設會被瀏覽器省略)。 */
    .anila-print-watermark,
    .anila-classification-watermark {
      display: block !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .anila-print-watermark { opacity: 0.12 !important; }

    /* `>= 機密`:內文一律不上紙。旗標由 app.jsx 依 isPrintMasked() 掛在 <html>。 */
    html[data-anila-print-mask="true"] .anila-msg,
    html[data-anila-print-mask="true"] .anila-msg-body { display: none !important; }
  }

  .boot-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100dvh; color: var(--fg-muted);
    font-family: var(--font-mono); font-size: 13px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
