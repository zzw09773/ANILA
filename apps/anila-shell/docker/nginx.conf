# Internal nginx for the anila-ui container. The outer ANILA reverse proxy
# fronts this on /anila/ — traffic arrives already prefixed (don't strip).
# 同 ANILALM 容器的策略:
#   - Vite build with base='/anila/' → index.html 引用 /anila/assets/...
#   - `alias` 把 URL prefix 映回標準的 /usr/share/nginx/html,磁碟不用鏡射
#     一層 html/anila/。
#   - SPA fallback 用帶 prefix 的 try_files 目標(/anila/index.html),
#     React Router basename 才對得上 URL。

server {
    listen 80;
    server_name _;

    # Health — compose healthcheck 直打 127.0.0.1,維持在 root(無 prefix)。
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 產物預覽殼：必須命中真實檔，不可落入 SPA try_files → index.html。
    location = /anila/artifact-frame.html {
        alias /usr/share/nginx/html/artifact-frame.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    # Three.js 等離線 vendor：明確對到磁碟，避免被 SPA fallback 吃成 index.html。
    location /anila/vendor/ {
        alias /usr/share/nginx/html/vendor/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA mount under the subpath。
    location /anila/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /anila/index.html;

        # Hashed 檔名的 build 產物 — long-cache。
        location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # Bare /anila(無尾斜線)補斜線,相對參照才正確。
    location = /anila {
        return 301 /anila/;
    }

    # 其他路徑(例如舊書籤的 /app)一律導回 SPA 首頁 prefix。
    location / {
        return 302 /anila/;
    }
}
