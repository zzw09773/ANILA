<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANILA · 院內 AI 工作平台</title>
    <!-- No Google Fonts preconnect: the air-gapped intranet's nginx CSP
         (font-src/style-src 'self') blocks fonts.googleapis/gstatic, so these
         preconnects were dead DNS lookups. --font-mono falls back to the OS
         monospace (see tokens.css). -->
    <!--
      Resolve the user's chosen theme synchronously before Vue mounts so the
      first paint is already correct (no dark → light flash on the light default).
      Light-first: honour a stored pref, else only a dark OS preference flips to
      dark; otherwise light. Mirrors readInitial() in composables/useTheme.js.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('anila.theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          // localStorage may be blocked — fall back to default attribute on <html>.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
