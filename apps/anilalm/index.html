<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANILA · 院內 AI 工作平台</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        /* System fonts only — the platform's outer nginx ships a strict
           CSP (`style-src 'self' 'unsafe-inline'; font-src 'self' data:`),
           which intentionally forbids external CDNs. Latin text uses the
           system UI stack; Traditional Chinese falls through to whatever
           CJK font the OS ships (PingFang TC on macOS, Microsoft JhengHei
           on Windows, Noto Sans CJK TC on Linux). */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei',
          'PingFang TC', 'Noto Sans CJK TC', system-ui, sans-serif;
        background: #f2f5f9;
        color: #1b3a6b;
        transition: background 220ms ease, color 220ms ease;
      }
      body.light {
        background: #f2f5f9;
        color: #1b3a6b;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      input,
      textarea {
        font-family: inherit;
      }
      /* Keyboard-only focus ring (a11y). Accent matches official-blue tokens. */
      :focus-visible {
        outline: 2px solid #1a5bb8 !important;
        outline-offset: 1px;
        border-radius: 4px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Respect users who ask for less motion (vestibular safety / a11y):
         near-eliminate the pulse/fadeIn/slideUp/spin animations + transitions. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.25);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
