<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>ANILA LM</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        /* System fonts only — the platform's outer nginx ships a strict
           CSP (`style-src 'self' 'unsafe-inline'; font-src 'self' data:`),
           which intentionally forbids external CDNs. Latin text uses the
           system UI stack; Traditional Chinese falls through to whatever
           CJK font the OS ships (PingFang TC on macOS, Microsoft JhengHei
           on Windows, Noto Sans CJK TC on Linux). */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei',
          'PingFang TC', 'Noto Sans CJK TC', system-ui, sans-serif;
        background: #0b0d10;
        color: #e8eaed;
        transition: background 220ms ease, color 220ms ease;
      }
      body.light {
        background: #fafaf7;
        color: #1a1a1a;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      input,
      textarea {
        font-family: inherit;
      }
      /* Keyboard-only focus ring (a11y). ANILALM consumes JS tokens inline
         rather than CSS vars, so the accent color is a literal here; #6361E0
         reads on both the dark (#0b0d10) and light (#fafaf7) surfaces.
         :focus-visible fires on keyboard nav only — mouse aesthetics intact. */
      :focus-visible {
        outline: 2px solid #6361e0 !important;
        outline-offset: 2px;
        border-radius: 4px;
      }
      .skip-link {
        position: absolute;
        inset-inline-start: -999px;
        top: 8px;
        z-index: 80;
        padding: 8px 12px;
        background: #fff;
        color: #1a1a1a;
        border: 1px solid #d4d2cb;
        border-radius: 8px;
        font-size: 14px;
        text-decoration: none;
      }
      .skip-link:focus,
      .skip-link:focus-visible {
        inset-inline-start: 16px;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      #anilalm-main,
      #anilalm-workspace {
        scroll-margin-top: 80px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Respect users who ask for less motion (vestibular safety / a11y):
         near-eliminate the pulse/fadeIn/slideUp/spin animations + transitions. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.25);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
