# Attach a mock model to the isolated dev network. Not part of the platform images.
services:
  loadtest-model:
    image: python:3.12-alpine
    container_name: loadtest-model
    command:
      - python
      - /opt/mock_model.py
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --tok-s
      - "30"
      - --tokens
      - "400"
      - --ttft
      - "0.3"
      - --chunk
      - "10"
    volumes:
      - ./mock_model.py:/opt/mock_model.py:ro
    networks:
      anila-loadtest-net:
        aliases:
          - loadtest-model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  anila-loadtest-net:
    external: true
    name: anila-loadtest-net
