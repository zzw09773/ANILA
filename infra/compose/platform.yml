# ANILA Platform — integration stack.
#   docker-compose up -d
# 模型推論 service 在 infra/models/docker-compose.yml (project: anila-models),
# 透過共用 external network ``anila-models-net`` 跨 project DNS。
#
# Prod initial mode 切換 (branch SSO):
#   - 所有 secret env var 預設改成 ``${VAR:?must be set}``,缺 .env 直接 fail。
#   - ANILA_ALLOW_DEV_SECRET 預設 0,任何 dev 預設值會被 startup_security 擋下。
#   - codeserver:內網維護,掛 repo root(機密已遮蔽)。nginx /codeserver 不解凍 SSO。
#   - n8n:COMPOSE_PROFILES=ops。預設出貨不啟,避免 /n8n 無 SSO 首登接管。
#     GitLab 已於 2026-09-26 從本檔拿掉,不再宣告服務或 volume。
# Dev 切換回去:把 .env 還原成 .env.dev.local 內容即可,所有 dev opt-in flag
# 都被 .env 那邊重新賦值,compose 不再提供「dev 預設值」這個安全網。

name: anila

# ── 容器日誌上限（P3.5）────────────────────────────────────────────────
# 單一宣告點：各 service 用 logging: *anila-logging，不要在個別服務改數字。
# 50m × 7 檔 = 每服務 ≤350MB；約 14 服務全棧天花板 ≈4.9GB。
# 給一人維運留約一週診斷窗；json-file 讓 docker logs 事故後仍可撈。
# 既有容器要 recreate 後才生效（docker compose up -d）；單純 restart 不夠。
x-logging: &anila-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "7"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  csp-db:
    # Self-built pgvector 0.8.1 on postgres:16-alpine. Isolated tag
    # anila-pgvector:local must not overwrite live pgvector/pgvector:pg16.
    build:
      context: ../..
      dockerfile: infra/docker/pgvector.Dockerfile
    image: anila-pgvector:local
    environment:
      POSTGRES_USER: csp
      # 只在 volume 首次初始化時生效;既有 csp-pgdata volume 改這個值不會
      # 改掉資料庫內的密碼 (要 ALTER ROLE)。prod 模式下 startup_security
      # 黑名單擋 'csp' / 'csp_password' 等 dev 值。
      POSTGRES_PASSWORD: ${CSP_DB_PASSWORD:?CSP_DB_PASSWORD must be set (postgres superuser password)}
      POSTGRES_DB: csp
    # 只開 loopback,host 上的 integration test 拿得到,LAN 摸不到。
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - csp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csp -d csp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *anila-logging

  # 憑證子目錄的擁有者必須是 10005，不能由 uid 10001 的 CSP 自己 mkdir。
  # 既有 volume 不會從映像繼承新目錄，所以每次啟動都用 root 補一次。
  csp-credential-dirs:
    build:
      context: ../..
      dockerfile: infra/docker/csp.Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/csp-credential-dirs.sh"]
    volumes:
      - anila-service-credentials:/run/anila/service-clients
    restart: "no"

  # ── CSP (Control + Data Plane :8000) ────────────────────────────────────
  csp:
    build:
      context: ../..
      dockerfile: infra/docker/csp.Dockerfile
    # 不對 host 開 port — 外部入口只有 nginx :443 (HTTPS + API key)。
    # 容器內 service-to-service 用 ``http://csp:8000`` 走 docker DNS。
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
      # 兩條 DB URL 拆開:csp_app 是 RLS-enforced 的 runtime role,
      # csp 是只給 migration 用的 superuser。混用會讓 document_chunks
      # 的 RLS 失效 (superuser 自動 bypass)。
      DATABASE_URL: postgresql://csp_app:${CSP_APP_DB_PASSWORD:?CSP_APP_DB_PASSWORD must be set (csp_app runtime role password)}@csp-db:5432/csp
      MIGRATION_DATABASE_URL: postgresql://csp:${CSP_DB_PASSWORD:?CSP_DB_PASSWORD must be set (same as csp-db POSTGRES_PASSWORD)}@csp-db:5432/csp
      # CSP and ingestion-worker resolve the shared upload root from one
      # deployment variable; the volume targets below use it too.
      UPLOAD_DIR: "${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      # migration 0014 在 fresh DB 建 csp_app role 時讀這個值當 role 密碼;
      # 既有 DB 的 role 已存在,改值要自己 ALTER ROLE csp_app PASSWORD。
      # 密碼用 hex 生成 (openssl rand -hex),避免 URL 特殊字元要 escape。
      CSP_APP_DB_PASSWORD: ${CSP_APP_DB_PASSWORD}
      # ⚠ 舊部署包用的是 CSP_SECRET_KEY;設定併一(Q46)之後正式名稱是 SECRET_KEY。
      # 兩個都收 —— 沒有這一行,既有 .env 會在 compose 解析階段就停住,
      # 而且 credential_crypto 的 cipher key 由它派生:換一把＝既有加密憑證全數失效。
      SECRET_KEY: ${SECRET_KEY:-${CSP_SECRET_KEY:?SECRET_KEY (or legacy CSP_SECRET_KEY) must be set (32+ bytes hex)}}
      # auto_seed 初始 admin 帳號密碼。prod 模式 (ANILA_ALLOW_DEV_SECRET=0)
      # 下 startup_security 黑名單擋 changeme/password/admin 與 placeholder,
      # 不傳進容器則 config.py 預設 'changeme' 直接 RuntimeError 拒啟。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set (initial admin password)}
      # startup_security 對 dev 預設值的拒絕開關。Prod 必須是 0 / unset。
      # 預設改成 0 (不再 fallback 1) — 缺 .env 時直接 enforce prod 模式。
      ANILA_ALLOW_DEV_SECRET: "${ANILA_ALLOW_DEV_SECRET:-0}"
      # 啟動時拒絕自動 alembic upgrade（空庫也走 alembic；失敗不 create_all）。
      # 預設 0＝仍遷移。每一次 up -d / recreate 都會跑 upgrade。
      # 要起服務但不遷移時設 1。沒有這一行,.env 寫了到不了容器。
      ANILA_SKIP_STARTUP_MIGRATIONS: "${ANILA_SKIP_STARTUP_MIGRATIONS:-0}"
      # url_guard 兩個 SSRF opt-in。loopback / link-local / cloud
      # metadata / docker service name 永遠擋,不受 flag 影響。Prod 不要 set。
      ANILA_ALLOW_HTTP_ENDPOINT: "${ANILA_ALLOW_HTTP_ENDPOINT:-0}"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "${ANILA_ALLOW_PRIVATE_ENDPOINT:-0}"
      # 模型 http 由 ANILA_ALLOW_HTTP_ENDPOINT 放行；ANILA_ENV 目前非判準
      # (_is_production 尚未接線)。agent endpoint 的 http 放行走
      # ANILA_ALLOW_HTTP_AGENT_ENDPOINT（內網 MLSteam agent 用；legacy
      # ANILA_ALLOW_HTTP_ENDPOINT 對 agent 仍可放行但記 deprecation warning）。
      ANILA_ENV: "${ANILA_ENV:-}"

      # ── 削減之後才需要的 passthrough(Q46)────────────────────────────────
      # 這十行在的理由,跟本檔 PDF_OCR_FALLBACK 那段註解是同一件事:
      # **沒有 env_file**,所以 `.env` 裡寫了而這裡沒有對應的一行,值根本到不了
      # 容器,而畫面與日誌看起來像是設好了。
      # 削減前它們的通道是設定頁的開機覆蓋(`app.site_url` 曾是頁面可編輯);
      # Q46 把整套開機覆蓋退役之後,compose 是它們唯一的入口。
      # ⚠ 預設值刻意與 services/csp/app/config.py 的欄位預設一致 —— 那是兩份
      #    會漂開的真相,改一邊要改另一邊。不寫預設(`:-`)會把「沒設」變成
      #    **空字串**,反而蓋掉程式預設(ALLOWED_ORIGINS 會變成沒有任何來源)。
      SITE_URL: "${SITE_URL:-http://localhost}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3001,http://localhost:80,http://localhost,https://localhost,https://localhost:4443}"
      ANILA_ALERT_SMTP_ENABLED: "${ANILA_ALERT_SMTP_ENABLED:-false}"
      ANILA_ALERT_SMTP_HOST: "${ANILA_ALERT_SMTP_HOST:-}"
      ANILA_ALERT_SMTP_PORT: "${ANILA_ALERT_SMTP_PORT:-587}"
      ANILA_ALERT_SMTP_USER: "${ANILA_ALERT_SMTP_USER:-}"
      ANILA_ALERT_SMTP_PASSWORD: "${ANILA_ALERT_SMTP_PASSWORD:-}"
      ANILA_ALERT_SMTP_FROM: "${ANILA_ALERT_SMTP_FROM:-}"
      ANILA_ALERT_SMTP_TO: "${ANILA_ALERT_SMTP_TO:-}"
      ANILA_ALERT_SMTP_USE_TLS: "${ANILA_ALERT_SMTP_USE_TLS:-true}"
      ANILA_ALLOW_HTTP_AGENT_ENDPOINT: "${ANILA_ALLOW_HTTP_AGENT_ENDPOINT:-0}"
      # protocol=triton_grpc 的 cleartext grpc:// 放行旗標(model kind 專用,
      # 與 http 旗標是姊妹分支不共用 allow-list)。grpcs:// 永遠不需要它。
      # 沒有這一行,.env 裡設 ANILA_ALLOW_GRPC_ENDPOINT=1 不會進到容器 →
      # 註冊 grpc:// 端點一律 400 reason=scheme,而且沒有任何提示。
      ANILA_ALLOW_GRPC_ENDPOINT: "${ANILA_ALLOW_GRPC_ENDPOINT:-0}"
      # §6-3：assistant 落庫前 zh-TW 靜默正規化。預設 1；設 0 關閉。
      ANILA_ZH_NORMALIZE: "${ANILA_ZH_NORMALIZE:-1}"
      # 檢索查詢擴展（民國↔西元＋域內同義）。預設 1；設 0 關閉。
      ANILA_QUERY_EXPANSION: "${ANILA_QUERY_EXPANSION:-1}"
      # SSRF allow-list — single-label docker service names 預設被擋,
      # 列進這條才能註冊。新增模型 service 要同步加進這個值並重啟 csp。
      # ⚠ 尾巴的 `,docling,router` 在 `:-` 預設值**外側**:operator 設
      # ANILA_TRUSTED_HOSTS 會整份替換括號裡的預設清單,但這兩個 compose
      # 內部服務名恆在（平台內服務,不是 operator 會想換掉的模型）。
      ANILA_TRUSTED_HOSTS: "${ANILA_TRUSTED_HOSTS:-gpt-oss-20b,gemma4,nv-embed-proxy,flux2-dev-agent},docling,router"
      # **入向** Host header allow-list (TrustedHostMiddleware) —— 跟上面那條
      # 出向 SSRF allow-list 是兩回事,別搞混。csp 的 library 預設是 "*"(等於
      # 關著),所以**這一行就是打開它的地方**:沒有它,.env 設 ALLOWED_HOSTS
      # 不會進到容器,中間層永遠不註冊,而且沒有任何提示
      # (同 ANILA_ALLOW_GRPC_ENDPOINT 上面那則的坑)。
      # compose 端預設 ≈ nginx `map $is_anila_host` 的實測放行集(見
      # infra/nginx/anila.conf 檔頂),差兩項,兩項都是刻意的:
      #   − 10.53.100.12:模型主機,沒有任何呼叫方拿它當 Host 打 csp
      #   + csp:容器間走 docker DNS,nginx 那層看不到這個 Host
      # 所以空 .env 的 `up -d` 是通的。換 prod IP / 加新入口:改 .env 的
      # ALLOWED_HOSTS,**同步改 nginx 那條 map**(兩份是手工同步的)。
      # ⚠ 值不帶 port(starlette 比對 host.split(":")[0]);localhost /
      # 127.0.0.1 / csp 由程式強制併入,拿掉也砍不掉 healthcheck。
      # ⚠ 萬用字元只支援 `*.suffix` 一種形狀;寫成 `10.53.*.15` 這類子網樣式
      # csp 會**拒絕啟動**並印出那個 pattern(不會變成開著但每個請求 500)。
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,csp,10.53.100.15,172.16.120.35,*.ncsist.org.tw}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-30}"
      # LLM proxy upstream timeout — Studio deck 生成的 prompt 可達 10K+
      # tokens,gemma4 處理 wall-clock 達 240s 級。default 120 太緊 → csp
      # 自己 mid-stream timeout 把連線關掉 → anila-studio 觀察到 ReadTimeout。
      LLM_TIMEOUT: "${LLM_TIMEOUT:-300}"
      # Embedding proxy 的上游逾時,也是 Triton gRPC 路徑「整通呼叫」預算的
      # 主項(budget = _wait_ready 5s + EMBEDDING_TIMEOUT)。runbook §3.1c 的
      # 排錯表叫操作者「調高 EMBEDDING_TIMEOUT」,client.py 兩則錯誤訊息也是
      # 這樣寫 —— 少了這一行,那句指示對容器**沒有任何作用**:.env 改了、
      # `up -d csp` 了,`printenv EMBEDDING_TIMEOUT` 仍是空的,行為一模一樣。
      # 預設值與 app/config.py 的 Settings.EMBEDDING_TIMEOUT 同為 30。
      EMBEDDING_TIMEOUT: "${EMBEDDING_TIMEOUT:-30}"
      # 內部服務憑證。CSP 寫，各服務只讀自己的檔。人不必複製 token。
      # FILE_GID 10002 是共用目錄的群組（router）。studio 是 10003，
      # worker 是 10004，寫在內建名單裡，不從這裡覆寫。
      ANILA_SERVICE_CLIENT_DIR: /run/anila/service-clients
      ANILA_SERVICE_CLIENT_FILE_GID: "10002"
      # ── branch SSO:中科院憑證卡登入 (prod-intranet-card fork 區) ─────────
      # ⚠ fork 區:main→prod sync 時不可拿 main 版 compose 整檔覆蓋 —
      # 6fcbdce (PR #16) 曾把這段蓋掉,內網就沒有刷卡登入了 (P0 迴歸)。
      # 預設值 = 內網 prod (card-only)。dev 降級在 .env 設兩個 false。
      # strict/CA/OCSP 已在 f01288e 移除 — PIN + 卡片簽章由使用者 PC 的
      # HiPKI 元件 (localhost:16888) 處理,backend 只解 PKCS#7 抽 employee_id。
      ANILA_AUTH_MODE: "${ANILA_AUTH_MODE:-card-only}"
      # CSV 員工編號;列入者首刷直接建 owner + is_approved (bootstrap),其餘
      # 走 pending → admin 核准。缺值 fail-fast;.env.example 的 placeholder
      # 字面由 startup_security 在啟動時擋 (避免 bricked:沒人能 approve)。
      CARD_INITIAL_OWNERS: ${CARD_INITIAL_OWNERS:?CARD_INITIAL_OWNERS must be set (CSV employee ids, include yourself)}
      # 卡片驗章的信任錨。**不設 = 用釘死的 cspki_ca_bundle.pem**,內網 prod
      # 就是這樣跑。只有本機開發需要指到 cht/ mock 生的測試 bundle
      # (secrets/dev-card-ca/ — secrets/ 下面那條 :ro 掛載已經把它帶進容器):
      #   CARD_CA_BUNDLE_PATH=/app/secrets/dev-card-ca/dev_ca_bundle.pem
      #   CARD_DEV_TRUST_TEST_CA=1
      # dev 測試 CA 只允許在 ANILA_AUTH_MODE 不是 card-only 時使用。誤帶到 production
      # 不會靜默降級:card_auth 認得測試 CA 的標記,少任一條件就拒絕載入整包
      # bundle(fail-closed),不是只濾掉那幾張。
      CARD_CA_BUNDLE_PATH: "${CARD_CA_BUNDLE_PATH:-}"
      CARD_DEV_TRUST_TEST_CA: "${CARD_DEV_TRUST_TEST_CA:-0}"
      # endpoint_url 是 base URL,proxy_service 自己加 ``/v1/chat/completions``
      # 或 ``/v1/embeddings``。**不要**在 URL 結尾加 ``/v1``,否則拼成
      # ``/v1/v1/...`` → 404 → router 端 RemoteProtocolError。
      # 平台自己用的模型（主路由、嵌入、簡報、視覺、摘要、知識庫對話）
      # 在治理中心「模型角色」指定，不讀這裡的模型名稱。
      # AUTO_REGISTER_MODELS 只在第一次建立還沒有的列。已存在的列
      # （含治理中心改過的端點）開機不會被這段蓋回去。
      AUTO_REGISTER_MODELS: >-
        [{"name":"${LOCAL_LLM_MODEL:-gpt-oss-20b}","display_name":"${LOCAL_LLM_MODEL:-gpt-oss-20b}","model_type":"llm","endpoint_url":"${LOCAL_LLM_BASE_URL:-http://gpt-oss-20b:8000}","api_version":"v1","description":"On-prem local LLM (anila-models-net)"},{"name":"gemma4","display_name":"gemma4","model_type":"llm","endpoint_url":"${GEMMA4_BASE_URL-http://gemma4:8000}","api_version":"v1","description":"On-prem gemma4 vLLM — Router primary"},{"name":"${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}","display_name":"${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}","model_type":"embedding","endpoint_url":"${LOCAL_EMBEDDING_BASE_URL:-http://nv-embed-proxy:8000}","api_version":"v1","description":"On-prem NV-embed-V2 via FastAPI shim (anila-models-net)"},{"name":"image-generator","display_name":"圖像繪製","model_type":"agent","endpoint_url":"${FLUX_AGENT_BASE_URL-http://flux2-dev-agent:8000}","api_version":"v1","description":"FLUX.2-dev image generation agent","description_for_router":"當使用者要求繪製、產生、設計、畫一張、給我一張圖、視覺化、想看看 XX 的樣子、想要看一張圖等等的時候使用。輸入是使用者的中文自然語言描述,不需要先翻譯,agent 內部會處理。"}]
      # Phase G：agents 表的 declarative 來源(不同於 model_registry,後者是 catalog;
      # agents 表才是 Router /v1/agents 與 DISPATCH 路徑會 join 的權限源)。
      # FLUX_AGENT_BASE_URL 用 `${VAR-default}` (無冒號):「沒設」→ 同主機
      # docker DNS 預設;「設成空字串」→ auto_seed 跳過該 entry (內網無 FLUX
      # 時用這招停用繪圖 agent,避免註冊一個打不通的 dead agent 給 Router)。
      AUTO_REGISTER_AGENTS: >-
        [{"name":"image-generator","endpoint_url":"${FLUX_AGENT_BASE_URL-http://flux2-dev-agent:8000}","api_version":"v1","description_for_router":"當使用者要求繪製、產生、設計、畫一張、給我一張圖、視覺化、想看看 XX 的樣子、想要看一張圖等等的時候使用。輸入是使用者的中文自然語言描述,不需要先翻譯,agent 內部會處理。","health_status":"healthy","approval_status":"approved"}]
      # ingestion-worker 的系統帳號與 sk- 由 CSP 核發，明文只寫進
      # /run/anila/service-clients/ingestion-worker/token。不要再從 .env 種這把 key。
      # 出向 https 的 CA 信任 (內網模型主機 10.53.100.12 走 https,憑證通常
      # 是內部 CA / 自簽 — 不在 certifi 預設信任鏈內,httpx 會
      # CERTIFICATE_VERIFY_FAILED)。把 IT 給的 PEM 放 ./share/pki/ 並在
      # .env 設 ANILA_MODEL_CA_FILE=/etc/anila/pki/<file>.pem。
      # 沒設 (空值) = 維持 httpx 預設 certifi 行為 (CPython 對空/不存在的
      # SSL_CERT_FILE 會 fallback 系統預設,無副作用)。
      SSL_CERT_FILE: ${ANILA_MODEL_CA_FILE-}
      # 內網模型 gateway (10.53.100.12 My-OpenAI-Frontend) 的 /v1 要
      # Authorization: Bearer。proxy_service 只對 model 呼叫注入,agent
      # dispatch 不帶。空值 = 不注入 (同主機裸 vLLM 不需要)。
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY-}
      # 歸檔 2026-08-09:FLUX_BACKEND_URL / FLUX_MAX_CONCURRENT / FLUX_TIMEOUT_SECONDS
      # (＋ FLUX_CACHE_DIR 的說明) 曾列在這裡,但 services/csp 全樹零讀取點 ——
      # get_flux_provider() 住在 anila-studio,而 csp.Dockerfile 沒把 anila-studio
      # COPY 進 csp 映像。真正生效的那一份在下面的 anila-studio 區塊;哪天
      # anila-studio 進了 csp 映像,照那邊的寫法把三行加回來。
      # ⚠ csp 是 anila_core parser 的第二個消費者:/api/ingestion/chunking-preview
      # (app/api/ingestion/preview.py:240) 呼叫同一支 extract_text。這裡**寫死
      # false、不吃 ${PDF_OCR_FALLBACK}**,是刻意讓預覽與 ingest 不一致:
      # OCR 是 1800 秒等級的同步工作,ingest 有佇列可以扛,HTTP request 沒有。
      # 寫成常數而不是「不設」,是為了讓這個差異是**決定**而不是漏接 —— 哪天有人
      # 幫 csp 補上視覺端點,也不會順手把 OCR 開進 request 路徑。
      # 差異寫在 .env.example 與 services/ingestion-worker/README.md。
      PDF_OCR_FALLBACK: "false"
      # 文件解析位址在治理中心「外部服務」。下面三行只給第一次啟動匯入舊 .env，
      # 匯入後請從 .env 刪掉。執行期不再用它們決定要打哪一台。
      DOC_PARSER: "${DOC_PARSER:-}"
      DOCLING_URL: "${DOCLING_URL:-}"
      DOCLING_SERVICE_TOKEN: "${DOCLING_SERVICE_TOKEN:-}"
      DOCLING_OCR_LANGS: "${DOCLING_OCR_LANGS:-ch_tra,en}"
      DOCLING_TIMEOUT_SECONDS: "${DOCLING_TIMEOUT_SECONDS:-120}"
      DOCLING_CONNECT_TIMEOUT_SECONDS: "${DOCLING_CONNECT_TIMEOUT_SECONDS:-5}"
      # 語音解碼位址同樣只在第一次啟動匯入。本機 asr-decoder 不會被匯入。
      ASR_DECODE_URL: "${ASR_DECODE_URL:-}"
      ASR_DECODER_TOKEN: "${ASR_DECODER_TOKEN:-}"
      ASR_DECODE_PROTOCOL: "${ASR_DECODE_PROTOCOL:-}"
      ASR_DECODE_API_KEY: "${ASR_DECODE_API_KEY:-}"
      ASR_OPENAI_MODEL: "${ASR_OPENAI_MODEL:-}"
      # 快速起步站台 profile（非祕密：csp_base_url、選填 csp_ca_file）。
      # 讀的是掛載目錄裡的 profile.json，不是把單一檔案 bind 到
      # /app/anila-quickstart-profile.json：檔案不存在時 Docker 會在 host
      # 建一個同名目錄，之後補上真檔也掛不進去。目錄掛載則檔案可晚點放，
      # CSP 照常啟動，下載在 profile 缺失時回 503。
      ANILA_QUICKSTART_PROFILE: /app/anila-quickstart-profile/profile.json
    volumes:
      # 進階範例與獨立快速骨架，由 CSP 的兩個下載端點分別讀取。
      # wheelhouse 不掛進 CSP：相依在建置 MLSteam lab 映像時安裝（設計 §12）。
      - ../../packages/anila-agent:/app/anila-template:ro
      - ../../packages/anila-agent-quickstart:/app/anila-quickstart:ro
      # 預設在 gitignore 的 share/quickstart/。改 host 目錄：ANILA_QUICKSTART_PROFILE_DIR。
      - "${ANILA_QUICKSTART_PROFILE_DIR:-../../share/quickstart}:/app/anila-quickstart-profile:ro"
      # 跟 ingestion-worker 共用 inode,不走拷貝。
      - "../../share/uploads/ingestion:${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      # 對話附件。刻意放在 share/uploads/ 之外,
      # 那個目錄整個被 nginx 無認證服務;附件只能走 /api/attachments 授權下載。
      - ../../share/attachments:/app/data/attachments
      # 內網模型 https 的內部 CA PEM 放這裡 (見上 SSL_CERT_FILE)。
      - ../../share/pki:/etc/anila/pki:ro
      # JWT 簽章金鑰 (csp 簽 access token + 對 studio 發 JWKS)。prod 模式
      # runtime 不自動生 → 缺這把 csp /.well-known/jwks.json
      # 回 500、登入發不了 token、anila-studio 起不來。由 infra/deployment/intranet/
      # intranet-deploy.sh 的 [4b] 步驟用 csp image 跑 scripts/generate-jwt-keypair.py
      # 產到 repo 根 ./secrets。
      - ../../secrets:/app/secrets:ro
      # 空 volume 第一次掛上時，繼承映像裡 /run/anila/service-clients 的
      # 10001:10002 與 mode 2750。改過 uid 之後要重建 csp 與 router 映像。
      - anila-service-credentials:/run/anila/service-clients
      # 外部服務憑證的金鑰。只掛在 CSP。worker 沒有這一卷，也沒有 SECRET_KEY 以外的解法。
      - anila-csp-local-secrets:/var/anila/csp-local-secrets
    extra_hosts:
      # csp 從這條 reach on-host service (e.g. host port 上的 embedding 後備)。
      - "host.docker.internal:host-gateway"
    networks:
      - default
      # 跨 project 的 external network — 解 ``gemma4`` / ``gpt-oss-20b`` /
      # ``nv-embed-proxy`` (在 infra/models/docker-compose.yml)。bootstrap 一次:
      #   docker network create anila-models-net
      - anila-models-net
    depends_on:
      csp-credential-dirs:
        condition: service_completed_successfully
      csp-db:
        condition: service_healthy
      # 遠端 docling:與 ingestion-worker 同一條 required:false 規則——開
      # docling-local profile 才等,沒開也不擋 csp 啟動。
      docling:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *anila-logging

  # ── Redis (Arq queue for ingestion-worker) ──────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *anila-logging

  # ── ingestion-worker (parse → chunk → embed → pgvector) ─────────────────
  ingestion-worker:
    build:
      context: ../..
      dockerfile: services/ingestion-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://csp_app:${CSP_APP_DB_PASSWORD:?CSP_APP_DB_PASSWORD must be set (same value as csp)}@csp-db:5432/csp
      REDIS_URL: redis://redis:6379
      # 經由 CSP /v1/embeddings 走 token_usage 計量,不直連模型。
      EMBEDDING_BASE_URL: http://csp:8000/v1
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}
      # 嵌入、視覺、關係抽取共用這一個檔。CSP 核發，worker 只讀。
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/ingestion-worker/token
      EMBEDDING_DIM: "4000"
      # 一份文件切成幾段送。csp 的 Triton gRPC 路徑是「每段文字各一次
      # ModelInfer,整通呼叫共用 5s + EMBEDDING_TIMEOUT 的預算,且與
      # len(input) 無關」—— 不切批的話,文件一大就整份失敗,而 runbook
      # §3.1c 叫操作者「縮小批次」卻沒有任何旋鈕可縮。要守的不變式是
      # EMBEDDING_BATCH_SIZE × 每段延遲 < min(下面那個, csp 的 EMBEDDING_TIMEOUT)。
      # 預設值與 WorkerSettings.embedding_batch_size 同為 32。
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-32}"
      # 不變式的另一項。⚠ 這是 **worker 自己的 httpx 逾時**,跟 csp 區塊那個
      # EMBEDDING_TIMEOUT 是兩個不同的鐘,而**小的那個說了算**:預設 worker 30s
      # < csp 的 5s channel-ready + 30s = 35s,所以 worker 先掛斷。只調 csp 那一個,
      # worker 照樣 30 秒放棄 —— 而 csp 的 to_thread 取消不掉,它會把那批做完並
      # 記帳,向量卻沒人收。2026-08-07 補進來以前,這個變數根本到不了容器,
      # 而 runbook 已經在印一條它是其中一項的不變式。
      # 預設值與 WorkerSettings.embedding_timeout_seconds 同為 30。
      EMBEDDING_TIMEOUT_SECONDS: "${EMBEDDING_TIMEOUT_SECONDS:-30}"
      # Must match csp's value and the target of both upload mounts.
      UPLOAD_DIR: "${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      # Keep the secure VLM/OCR default (verify=True). This is the CA-bundle
      # channel for an internal HTTPS endpoint, not a TLS-bypass switch.
      SSL_CERT_FILE: ${ANILA_MODEL_CA_FILE-}
      # judge 路徑要解 AES-encrypted credentials,cipher key 從 SECRET_KEY 派生,
      # **必須**跟 csp 同值,不然每次 judge decrypt 失敗會 silently skip。
      SECRET_KEY: ${SECRET_KEY:-${CSP_SECRET_KEY:?SECRET_KEY (or legacy CSP_SECRET_KEY) must be set (same value as csp)}}
      ANILA_ALLOW_DEV_SECRET: "${ANILA_ALLOW_DEV_SECRET:-0}"
      ANILA_ALLOW_HTTP_ENDPOINT: "${ANILA_ALLOW_HTTP_ENDPOINT:-0}"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "${ANILA_ALLOW_PRIVATE_ENDPOINT:-0}"
      ANILA_ENV: "${ANILA_ENV:-}"
      ANILA_ALLOW_HTTP_AGENT_ENDPOINT: "${ANILA_ALLOW_HTTP_AGENT_ENDPOINT:-0}"
      # VLM image captioning: ingest 時把 [[IMAGE:id]] placeholder 換成 caption
      # 才不會 chart/diagram 變成 [image] token 消失。走 csp /v1 proxy 為了計量。
      # 用哪一顆模型由治理中心的「視覺模型」角色決定，不在這裡寫名稱。
      # 角色沒設時略過圖說，入庫繼續。
      ENABLE_IMAGE_CAPTIONS: "${ENABLE_IMAGE_CAPTIONS:-true}"
      VISION_URL: "${VISION_URL:-http://csp:8000/v1}"
      VISION_CONCURRENCY: "${VISION_CONCURRENCY:-4}"
      VISION_TIMEOUT_SECONDS: "${VISION_TIMEOUT_SECONDS:-60}"
      # 掃描件 PDF 的 OCR fallback。預設 false —— 這幾行在的理由是「不設定就
      # 傳不進來」:沒有 env_file,所以 .env 寫了 PDF_OCR_FALLBACK=true 而這裡
      # 沒有對應的一行,旗標根本到不了 worker,而看起來像是開了。
      # ⚠ 開之前讀 services/ingestion-worker/README.md 的〈心跳〉那節:單份
      #    文件解析會跳到 1800 秒等級,而本 worker 宣告的預算是 300 秒
      #    (main.py:71 job_timeout) —— 超出 6 倍,期間其他 ingest 全排隊。
      # ⚠ 內建頁數上限不要在程式裡任意調大;超過上限的頁連原生抽到的文字都會被取代掉。
      PDF_OCR_FALLBACK: "${PDF_OCR_FALLBACK:-false}"
      PDF_OCR_CONCURRENCY: "${PDF_OCR_CONCURRENCY:-4}"
      # 文件解析位址向 CSP 問。用上面那份憑證檔，不讀設定表。
      CSP_BASE_URL: http://csp:8000
      # OCR 語言與逾時仍是部署參數。
      DOCLING_OCR_LANGS: "${DOCLING_OCR_LANGS:-ch_tra,en}"
      DOCLING_TIMEOUT_SECONDS: "${DOCLING_TIMEOUT_SECONDS:-120}"
      DOCLING_CONNECT_TIMEOUT_SECONDS: "${DOCLING_CONNECT_TIMEOUT_SECONDS:-5}"
      # 出向 SSRF allow-list:single-label docker 服務名預設被擋,列進這條才
      # 放行。docling 是 compose 內部服務,尾巴 `,docling` 在 `:-` 外側,
      # operator 覆寫 ANILA_TRUSTED_HOSTS 時它仍在(與 asr-gateway 的
      # `,asr-decoder` 同一形狀)。
      # ⚠ 兩件事留給後人(2026-08-17 稽核紅線判定「未弱化」,但「未弱化」≠「無變化」):
      #   ① `,docling` 在 `${...:-}` 預設值**外側**——無論 DOC_PARSER 是不是 docling、
      #      服務有沒有起,這個名字**恆在**允許清單,operator 無法用 .env 移除。
      #   ② ingestion-worker 原本沒有 ANILA_TRUSTED_HOSTS 這行,現在會**繼承**
      #      operator 的整份清單,不是只有 docling。兩者與 asr-decoder 先例字面
      #      一致、guard 本體未動、空元素解析安全,故不弱化——但要知道這是「加寬
      #      了 ingestion-worker 的 allow-list 來源」,不是零變化。
      ANILA_TRUSTED_HOSTS: "${ANILA_TRUSTED_HOSTS:-},docling"
      PYTHONUNBUFFERED: "1"
    volumes:
      - "../../share/uploads/ingestion:${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      - ../../share/pki:/etc/anila/pki:ro
      - anila-service-credentials:/run/anila/service-clients:ro
    depends_on:
      csp-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      csp:
        condition: service_healthy
      # 遠端 docling:有開 docling-local profile 才等;沒開(平台 host 無 docling)
      # 也不擋整批 up —— 與 asr-decoder 的 `required: false` 同一條規則與
      # 同一個 Compose v2.36.2 最小重現(見 asr-gateway 區塊那段長註解)。
      docling:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *anila-logging

  # ── Router (anila-core-router :9000) ────────────────────────────────────
  router:
    build:
      context: ../..
      dockerfile: services/anila-core-router/Dockerfile
    # 不對 host 開 port — 外部走 nginx /router/* → router:9000。
    expose:
      - "9000"
    environment:
      CSP_BASE_URL: http://csp:8000
      # 多輪派工的中途狀態（/v1/sessions/{id}/state、/answer）存在這個 SQLite；
      # 2026-09-02 之前沒有 volume，recreate 一次就全部消失（harness M2）。
      ANILA_SESSION_DB_PATH: /app/.anila/sessions.db
      # 只在 ANILA_SERVICE_TOKEN_FILE 沒設時才當後援。路徑有設而檔案不在時，
      # router 失敗即關閉（token_source=file_missing），不讀這個目錄。
      ANILA_ROUTER_STATE_DIR: /app/.anila/state
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/router-primary/token
    volumes:
      - router-sessions:/app/.anila
      - anila-service-credentials:/run/anila/service-clients:ro
      # 歸檔 2026-08-09:`MODEL: ${LLM_MODEL:-gemma4}` 曾列在這裡,但 main.py 不讀它
      # (README.md:107)——主路由模型完全由 CSP /api/models/router-primary runtime
      # 決定。留著只會讓人以為改 LLM_MODEL 就能換主路由模型。
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *anila-logging

  # ── nginx (HTTPS reverse proxy, 唯一外部入口) ────────────────────────────
  # TLS termination (self-signed dev cert),HTTP→HTTPS 301,proxy /, /api/,
  # /v1/, /v2/, /router/* 到對應內部 service。
  nginx:
    # 版本＋digest 都釘死(2026-08-08,氣隙凍結前)。這是平台唯一的對外大門,
    # 原本寫 `nginx:alpine`——完全沒有版本號,重建一次就可能換一個 nginx。
    # digest 取的是 **manifest-list**(多架構)的那一個:
    #   docker buildx imagetools inspect nginx:1.30.4-alpine
    # 1.30.4-alpine 建置日 2026-07-15;1.27 線已於 2025-06-24 EOL。
    # ⚠ 換版本時 tag 與 digest 要一起換 —— 兩者不一致時實際拉的是 digest,
    #   tag 只剩註解作用。
    # 2026-09-09: 1.30.4 alpine digest from nginx:stable-alpine (newer build).
    # Rebuilds with libuuid 2.42.3. Do not use the stock tag on a host that
    # still runs anila-nginx from nginx:1.30.4-alpine without recreating it.
    build:
      context: ../..
      dockerfile: infra/docker/nginx.Dockerfile
    container_name: anila-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${ANILA_UI_HTTPS_PORT:-4443}:4443"
    volumes:
      - ../../infra/nginx/anila.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../infra/nginx/certs:/etc/nginx/certs:ro
      - ../../share/static:/usr/share/nginx/share-files/static:ro
      - ../../share/uploads:/usr/share/nginx/share-files/uploads:rw
    depends_on:
      # `restart: true` (compose 2.17+): upstream rebuild 後 nginx 跟著 restart,
      # 不然 nginx.conf 的 static upstream block 把舊 IP 釘死 → 502。
      csp:
        condition: service_healthy
        restart: true
      anilalm:
        condition: service_healthy
        restart: true
      router:
        condition: service_healthy
        restart: true
      anila-ui:
        condition: service_healthy
        restart: true
    # Probe CSP via loopback :8080 /health (see anila.conf). `nginx -t`
    # only checks syntax and stayed healthy during tonight's 502/503 floods.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *anila-logging

  # ── pptx-renderer (Node + LibreOffice for slide / vision-QA screenshots) ─
  pptx-renderer:
    build:
      context: ../../services/pptx-renderer
      dockerfile: Dockerfile
    expose:
      - "7100"
    healthcheck:
      # bookworm-slim 沒 curl/wget,用 node 自帶 http。
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging

  # ── anila-studio (Studio extraction Phase 2 skeleton) ───────────────────
  # Deck generation service extracted out of csp/backend. Reads JWKS +
  # token revocation events from csp via HTTP/Redis so cross-service auth
  # works without sharing the private signing key.
  anila-studio:
    build:
      context: ../../services/anila-studio
      dockerfile: Dockerfile
    expose:
      - "8100"
    environment:
      CSP_BASE_URL: http://csp:8000
      # CSP 寫的 anila-studio 服務憑證。檔案不在時 /health 是 503。
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/anila-studio/token
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      # 跟 csp 同一個 toggle:空字串 → studio 圖像生成停用 (內網無 FLUX)。
      FLUX_BACKEND_URL: ${FLUX_BACKEND_URL-http://flux2-dev:8000}
      # 對齊 volume mount 路徑。studio.py 內讀 os.environ["FLUX_CACHE_DIR"],
      # 預設 fallback 是 csp 的 /var/anila/ingestion-uploads/flux-cache,在
      # anila-studio container 內不存在/沒權限,所以這條 env 必須顯式設。
      FLUX_CACHE_DIR: /var/anila/anila-studio-flux-cache
      # report / mindmap / infographic / datatable 4 種 artifact 的持久化目錄。
      # 每個 job 落地 {job_id}.{html,pdf,docx,svg,csv,xlsx}, 24h 後 prune。
      ARTIFACTS_DIR: /var/anila/anila-studio-artifacts
      RENDERER_BASE_URL: http://pptx-renderer:7100
      # 簡報與視覺模型由治理中心的模型角色決定（slides／vision）。
      JWT_KID: anila-v1
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
      redis:
        condition: service_healthy
      pptx-renderer:
        condition: service_healthy
    volumes:
      - anila-studio-flux-cache:/var/anila/anila-studio-flux-cache
      - anila-studio-artifacts:/var/anila/anila-studio-artifacts
      - anila-service-credentials:/run/anila/service-clients:ro
    networks:
      - default
      - anila-models-net  # flux2-dev sits here
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging

  # ── ANILA LM (Vite/React SPA at /anilalm/) ──────────────────────────────
  anilalm:
    build:
      context: ../../apps/anilalm
      args:
        BASE_PATH: ${ANILALM_BASE_PATH:-/anilalm/}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *anila-logging

  # ── ANILA UI (admin SPA, same-origin via nginx) ─────────────────────────
  anila-ui:
    build:
      context: ../../apps/anila-shell
      args:
        # 空字串 → SPA 用相對 URL,所有請求 same-origin (clipboard secure context)。
        VITE_CSP_BASE_URL: ${ANILA_PUBLIC_CSP_BASE_URL-}
        VITE_ROUTER_BASE_URL: ${ANILA_PUBLIC_ROUTER_BASE_URL:-/router}
        # 同源 subpath(2026-06-11 B 案):443 的 /anila/,SSO cookie 自然共用。
        # 本機 dev 直跑 vite 時不受影響(無此 env = '/')。
        BASE_PATH: ${ANILA_UI_BASE_PATH:-/anila/}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *anila-logging

  # ── code-server (必要服務,2026-07-29 擁有者確認) ────────────────────────
  # Browser-based VS Code,reachable via /codeserver subpath through nginx。
  # 用途:擁有者在內網主機上做快速維運 — 掛整個 repo + VS Code Docker 擴充。
  # 用 codercom 上游而非 lscr.io/linuxserver fork — 後者多一層 s6-overlay
  # 會破 subpath 部署 (workspace fs provider 註冊失敗)。
  # image 改成自 build (infra/codeserver/Dockerfile):docker CLI 與 Docker
  # 擴充都要在 build 期烤進去,內網 air-gap runtime 抓不到東西。
  # TODO(未做):PASSWORD 之外再接 SSO — nginx auth_request 驗 CSP JWT。
  #
  # codeserver-init:one-shot,只做一件事 — 把 codeserver_config volume
  # chown 成 runtime UID/GID,然後退出 (0)。
  # 為什麼需要它:Docker 建 named volume 的 mountpoint 時是 root:root,而
  # 上游 entrypoint 的 fixuid 只 remap「原本屬於 coder(1000)」的檔案,
  # root 擁有的一律不碰 → codeserver 以非 root 跑就 EACCES 無限重啟
  # (2026-07-29 P0.3 實測)。這一步讓**任何全新安裝**(開發機、內網主機)
  # 都不需要人工上 host 下 chown。
  # 用 0:0 跑是必要的(要 chown 別人的檔案),但它只活幾毫秒且不開 port。
  codeserver-init:
    build: &codeserver-build
      context: ../codeserver
      dockerfile: Dockerfile
    # 跟 codeserver 共用同一個 image tag → 只 build 一次,內網也只需搬一份。
    image: &codeserver-image anila-codeserver:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # $$ 是逃逸給 shell 的,不是 compose 插值。
    command:
      - |
        set -eu
        chown -R "$${CODESERVER_UID}:$${CODESERVER_GID}" /home/coder/.config
        chmod 0755 /home/coder/.config
        echo "codeserver-init: chowned /home/coder/.config -> $${CODESERVER_UID}:$${CODESERVER_GID}"
        ls -ldn /home/coder/.config
    environment:
      # 必須跟 codeserver 的 user: 同值,否則 chown 到錯的 UID 等於沒修。
      CODESERVER_UID: "${UID:-1001}"
      CODESERVER_GID: "${GID:-1001}"
    volumes:
      - codeserver_config:/home/coder/.config
    restart: "no"
    logging: *anila-logging

  codeserver:
    build: *codeserver-build
    image: *codeserver-image
    # UID/GID 要對齊 **host** 上跑 repo 的那個帳號,bind mount 進來的 repo
    # 才寫得動 (本開發機 = 1026:516;內網主機自己在 .env 設)。
    # 1001 只是沒設 .env 時的保底值,不代表任何一台實機。
    user: "${UID:-1001}:${GID:-1001}"
    # /var/run/docker.sock 是 root:docker 0660 → 非 root 要靠補充群組才讀得到。
    # 這個 GID 是 **host** 的 docker 群組 GID,每台機器不同,所以走 .env。
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      # volume 權限修好之前不要起來,否則又是 EACCES 重啟迴圈。
      codeserver-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Taipei
      HOME: /home/coder
      USER: coder
      # startup_security 拒絕 dev 預設 `changeme-codeserver`,prod 必設真值。
      PASSWORD: ${CODESERVER_PASSWORD:?CODESERVER_PASSWORD must be set}
    volumes:
      - codeserver_config:/home/coder/.config
      # ⚠ docker.sock = host root 等級權限(能起特權容器、掛 host /)。
      # 拿到 codeserver 密碼的人 == host root。這是擁有者為了讓 VS Code
      # Docker 擴充可用而明示接受的取捨(2026-07-29 mandate),不是預設。
      # 下面兩條 /dev/null 遮蔽因此**更加**不能拿掉。
      - /var/run/docker.sock:/var/run/docker.sock
      # codeserver = 內網維護 ANILA 平台用 → 掛整個 repo 源碼
      # (CODESERVER_WORKSPACE 預設 '../..' = repo root,見 .env.example)。
      # repo 根有機密(.env 的 JWT/DB 密碼、server.key 的 TLS 私鑰),用 /dev/null
      # 把這兩個遮蔽掉,避免拿到 codeserver 密碼的人讀到(中科院內網 air-gap 防護)。
      # 其餘(server.crt、CA bundle、share/pki)是公開資料,可見無妨。
      # ⚠ 改了 CODESERVER_WORKSPACE 就要相應調整 / 移除下面兩條遮蔽。
      - ${CODESERVER_WORKSPACE:-../..}:/home/coder/workspace
      - /dev/null:/home/coder/workspace/.env:ro
      - /dev/null:/home/coder/workspace/infra/nginx/certs/server.key:ro
    working_dir: /home/coder/workspace
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging

  # ── n8n workflow automation (cold-stored) ───────────────────────────────
  # Subpath /n8n。重要 hardening (不要回退):
  #   - NODE_TLS_REJECT_UNAUTHORIZED 預設 1。要連自簽 endpoint 逐節點設
  #     self-signed CA,**不要**全域關 TLS 驗證 (歷史教訓)。
  #   - Code Node 模組白名單寫死,避免變成任意 require() 的 RCE 平台。
  n8n:
    # 預設出貨不起: /n8n 沒有 CSP／卡片 SSO。要開時設 COMPOSE_PROFILES=ops。
    # nginx location 留著;容器沒起時這裡會 502。
    profiles: ["ops"]
    # CVE pass 2026-09-09: rebase n8n 2.38.1 onto Alpine 3.24 and overlay
    # patched nested npm packages. Breaking 1.x→2.x. Isolated tag is
    # anila-n8n:local so the live anila stack is not retagged.
    build:
      context: ../..
      dockerfile: infra/docker/n8n.Dockerfile
    image: anila-n8n:local
    # 用 image 內建 'node' user (UID 1000),不要 override user — n8n 首次
    # 開機 HOME 對不上會 mkdir /.n8n EACCES。
    environment:
      TZ: Asia/Taipei
      N8N_PATH: /n8n/
      N8N_HOST: ${ANILA_HOST:-172.16.120.35}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://172.16.120.35/n8n/}
      NODE_TLS_REJECT_UNAUTHORIZED: "${N8N_TLS_REJECT_UNAUTHORIZED:-1}"
      # 後面 nginx 已是 HTTPS,n8n 自己看到 HTTP 所以 cookie 標非 secure 才能登入。
      N8N_SECURE_COOKIE: "false"
      NODE_FUNCTION_ALLOW_EXTERNAL: "${N8N_NODE_FUNCTION_ALLOW_EXTERNAL:-axios,lodash,dayjs}"
      NODE_FUNCTION_ALLOW_BUILTIN: "${N8N_NODE_FUNCTION_ALLOW_BUILTIN:-crypto,url}"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    healthcheck:
      # /healthz 在引擎 root,不受 N8N_PATH 影響。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped
    logging: *anila-logging

  # ── ASR gateway (串流語音輸入的 WS 端點) ─────────────────────────────────
  # 瀏覽器麥克風 → WSS /asr/stream → 這裡切句 → 治理中心設定的遠端解碼器 → 文字。
  # 純 CPU、無 DB、無 GPU。語音與辨識結果都不落地 —— 只當鍵盤。
  # 解碼位址不在這份 compose，在治理中心「外部服務」。
  #
  # ⚠ profiles: 預設不啟動。要開:COMPOSE_PROFILES=asr
  #   (nginx 端已用變數式 proxy_pass,沒開也不會讓 nginx 起不來)。
  asr-gateway:
    # asr 與 asr-remote 都只起這支 gateway。本機解碼器已移除。
    profiles: ["asr", "asr-remote"]
    build:
      # ⚠ context 是 repo 根目錄(不是 services/asr-gateway):Dockerfile 要複製
      # packages/anila-core 的 SSRF guard 進來。同 router / ingestion-worker。
      context: ../..
      dockerfile: services/asr-gateway/Dockerfile
    expose:
      - "8200"
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:-}
      # 解碼位址與憑證在治理中心。這支服務用自己的憑證檔去讀那一列。
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/asr-gateway/token
      ANILA_ALLOW_HTTP_ENDPOINT: "${ANILA_ALLOW_HTTP_ENDPOINT:-0}"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "${ANILA_ALLOW_PRIVATE_ENDPOINT:-0}"
      ANILA_TRUSTED_HOSTS: "${ANILA_TRUSTED_HOSTS:-}"
      # ── 健康探針 timeout ─────────────────────────────────────────────
      # 舊值(2.0s/1.0s,寫死在程式裡)是「decoder 在同一台」調出來的。解碼端
      # 在 WAN 另一頭時會誤報 decoder_unreachable,把一支能用的麥克風藏起來。
      ASR_PROBE_TIMEOUT_SECONDS: ${ASR_PROBE_TIMEOUT_SECONDS:-8}
      ASR_PROBE_CONNECT_TIMEOUT_SECONDS: ${ASR_PROBE_CONNECT_TIMEOUT_SECONDS:-3}
      ASR_INITIAL_PROMPT: ${ASR_INITIAL_PROMPT:-以下是繁體中文。}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-5}
      ASR_PARTIALS_ENABLED: ${ASR_PARTIALS_ENABLED:-1}
      ASR_OPENCC_MODE: ${ASR_OPENCC_MODE:-off}
      ASR_MAX_SESSION_SECONDS: ${ASR_MAX_SESSION_SECONDS:-300}
      CSP_BASE_URL: http://csp:8000
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      JWT_KID: anila-v1
      JWT_LEEWAY_SECONDS: "${JWT_LEEWAY_SECONDS:-60}"
      REVOCATION_RECONCILE_INTERVAL_SECONDS: "${REVOCATION_RECONCILE_INTERVAL_SECONDS:-5}"
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - anila-service-credentials:/run/anila/service-clients:ro
    networks:
      - default
      - anila-models-net
    healthcheck:
      # timeout 要蓋得住探針:解碼端在 WAN 另一頭時 /asr/health 自己就可能花掉
      # ASR_PROBE_TIMEOUT_SECONDS(預設 8s)。舊的 5s 會把「遠端慢」誤判成
      # 「gateway 掛了」。interval 拉到 30s 是為了不要對外部端點狂打探針
      # (探針會真的送一段 100ms 靜音去辨識)—— 2 次/分鐘。
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/asr/health || exit 1"]
      interval: 30s
      timeout: 12s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging


  docling:
    # 遠端 docling 文件解析。只有 `--profile docling-local` 才起。
    # 平台預設不跑它；位址在治理中心「外部服務」。
    profiles: ["docling-local"]
    build:
      context: ../../services/docling-service
      dockerfile: Dockerfile
    image: ${ANILA_IMAGE_DOCLING:-anila/docling-service:0.1.0}
    expose:
      - "9100"
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:-}
      TZ: ${TZ:-Asia/Taipei}
      # 不要用 :?。compose 變數插值在解析階段就跑,即使本服務在
      # profiles 之後根本不會啟動。缺 token 由服務自己 fail-loud
      # (app/main.py:_require_token)。
      DOCLING_SERVICE_TOKEN: ${DOCLING_SERVICE_TOKEN:-}
      DOCLING_ARTIFACTS_DIR: /var/anila/docling-artifacts
      DOCLING_LOCAL_FILES_ONLY: ${DOCLING_LOCAL_FILES_ONLY:-1}
      HF_HUB_OFFLINE: ${DOCLING_LOCAL_FILES_ONLY:-1}
      TRANSFORMERS_OFFLINE: ${DOCLING_LOCAL_FILES_ONLY:-1}
      # 與平台側(in-process 時代)同名同義。
      DOCLING_OCR_LANGS: ${DOCLING_OCR_LANGS:-ch_tra,en}
      DOCLING_TABLE_STRUCTURE: ${DOCLING_TABLE_STRUCTURE:-true}
      DOCLING_PICTURE_DESCRIPTION: ${DOCLING_PICTURE_DESCRIPTION:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # :ro —— decoder 只讀權重,沒有任何理由寫進去。預設值落在 models/model/
      # 底下,權重不入 git。
      - ${DOCLING_MODEL_HOST_DIR:-../../models/model/docling}:/var/anila/docling-artifacts:ro
    networks:
      - default
    # ⚠ GPU 保留(與 asr-decoder 同)搬到 infra/compose/docling-gpu.yml。這裡
    # 刻意不留空的 deploy: —— 平台主機沒有 nvidia runtime,寫死會讓 `up` 整批
    # 失敗;要 GPU 的主機自己疊 docling-gpu.yml。
    healthcheck:
      # 模型在第一次 parse 時載入(layout + tableformer + EasyOCR,動輒 GB),
      # ready 之前 /health 回 503。retries × interval 要蓋得住分鐘級冷啟動。
      test: ["CMD-SHELL", "curl -sf http://localhost:9100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging

networks:
  default:
    name: anila-net
  # 跟 infra/models/docker-compose.yml 共用。external → 兩個 project 任一個 down
  # 都不會刪掉它。bootstrap:  docker network create anila-models-net
  anila-models-net:
    external: true
    name: anila-models-net

volumes:
  csp-pgdata:
  redis-data:
  router-sessions:
  anila-service-credentials:
  anila-csp-local-secrets:
  anila-studio-flux-cache:
  anila-studio-artifacts:
  # cold-stored — 對應上面 commented service。volume 名稱保留可以避免
  # 解凍時 named volume 重生造成既有資料遺失 (compose 看到舊名就 reuse)。
  codeserver_config:
  n8n_data:
