# ANILA Platform — integration stack.
#   docker-compose up -d
# 模型推論 service 在 infra/models/docker-compose.yml (project: anila-models),
# 透過共用 external network ``anila-models-net`` 跨 project DNS。
#
# Prod initial mode 切換 (branch SSO):
#   - 所有 secret env var 預設改成 ``${VAR:?must be set}``,缺 .env 直接 fail。
#   - ANILA_ALLOW_DEV_SECRET 預設 0,任何 dev 預設值會被 startup_security 擋下。
#   - n8n / gitlab:內網自動化/合規(ISO 42001)需要,預設啟用。
#   - codeserver:只在明確指定 ``--profile developer-tools`` 時啟用,且只掛
#     ``share/codeserver-sandbox``；正式 stack 不掛 repo root。
# Dev 切換回去:把 .env 還原成 .env.dev.local 內容即可,所有 dev opt-in flag
# 都被 .env 那邊重新賦值,compose 不再提供「dev 預設值」這個安全網。

name: anila-platform

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  csp-db:
    # pgvector 是 postgres:16 的 superset,migration 0014 (ingestion) 需要
    # vector extension。換回 upstream postgres 會破 ingestion stack。
    image: ${ANILA_IMAGE_CSP_DB:?ANILA_IMAGE_CSP_DB must be a locked image content ID}
    environment:
      POSTGRES_USER: csp
      # 只在 volume 首次初始化時生效;既有 csp-pgdata volume 改這個值不會
      # 改掉資料庫內的密碼 (要 ALTER ROLE)。prod 模式下 startup_security
      # 黑名單擋 'csp' / 'csp_password' 等 dev 值。
      POSTGRES_PASSWORD: ${CSP_DB_PASSWORD:?CSP_DB_PASSWORD must be set (postgres superuser password)}
      POSTGRES_DB: csp
      # ⛔ 鐵則(補救計畫 W2-10 / 子計畫 C1 §c):**csp-db 的 TZ 必須維持 UTC**,
      # 在 C1 全部批次(naive timestamp 欄 → timestamptz)做完之前不得改成
      # Asia/Taipei。理由:治理帳的 created_at 帶 `server_default
      # CURRENT_TIMESTAMP`,而 CURRENT_TIMESTAMP 是 timestamptz —— 寫進
      # `timestamp without time zone` 欄時**按 session TZ 轉換**。session TZ 一改
      # 成台北,這條路徑就開始存本地時間,而同一欄的舊值是 UTC → 同一個欄位混
      # 兩種語意,且資料裡沒有任何標記能區分某一列屬於哪一種。
      # 要台北時間的是**顯示層**,走前端共用 formatter(W1-4④),不是改 DB 的 TZ。
      # ⚠ 刻意寫死、不吃 `.env` interpolation:讓「編 .env」不可能無聲破壞這條。
      # 現況:批次 1(r1_0040)已轉治理帳 + api_keys 共 12 欄;批次 2(大表
      # messages / document_chunks / ingestion_*)還沒轉 → 鐵則整體仍然有效。
      TZ: Etc/UTC
    # 只開 loopback,host 上的 integration test 拿得到,LAN 摸不到。
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - csp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csp -d csp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── CSP (Control + Data Plane :8000) ────────────────────────────────────
  csp:
    build:
      context: ../..
      dockerfile: infra/docker/csp.Dockerfile
    image: ${ANILA_IMAGE_CSP:?ANILA_IMAGE_CSP must be a locked image content ID}
    # 不對 host 開 port — 外部入口只有 nginx :443 (HTTPS + API key)。
    # 容器內 service-to-service 用 ``http://csp:8000`` 走 docker DNS。
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
      # 兩條 DB URL 拆開:csp_app 是 RLS-enforced 的 runtime role,
      # csp 是只給 migration 用的 superuser。混用會讓 document_chunks
      # 的 RLS 失效 (superuser 自動 bypass)。
      DATABASE_URL: postgresql://csp_app:${CSP_APP_DB_PASSWORD:?CSP_APP_DB_PASSWORD must be set (csp_app runtime role password)}@csp-db:5432/csp
      MIGRATION_DATABASE_URL: postgresql://csp:${CSP_DB_PASSWORD:?CSP_DB_PASSWORD must be set (same as csp-db POSTGRES_PASSWORD)}@csp-db:5432/csp
      # r1_0021 migration/backfill requires a real deployed-weight identity.
      # Never derive this value from LOCAL_EMBEDDING_MODEL.
      EMBEDDING_MODEL_FINGERPRINT: ${EMBEDDING_MODEL_FINGERPRINT:?EMBEDDING_MODEL_FINGERPRINT must be sha256:<64 lowercase hex> for deployed embedding weights}
      # migration 0014 在 fresh DB 建 csp_app role 時讀這個值當 role 密碼;
      # 既有 DB 的 role 已存在,改值要自己 ALTER ROLE csp_app PASSWORD。
      # 密碼用 hex 生成 (openssl rand -hex),避免 URL 特殊字元要 escape。
      CSP_APP_DB_PASSWORD: ${CSP_APP_DB_PASSWORD}
      SECRET_KEY: ${CSP_SECRET_KEY:?CSP_SECRET_KEY must be set (32+ bytes hex)}
      # auto_seed 初始 admin 帳號密碼。prod 模式 (ANILA_ALLOW_DEV_SECRET=0)
      # 下 startup_security 黑名單擋 changeme/password/admin 與 placeholder,
      # 不傳進容器則 config.py 預設 'changeme' 直接 RuntimeError 拒啟。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set (initial admin password)}
      # startup_security 對 dev 預設值的拒絕開關。Prod 必須是 0 / unset。
      # 預設改成 0 (不再 fallback 1) — 缺 .env 時直接 enforce prod 模式。
      ANILA_ALLOW_DEV_SECRET: "${ANILA_ALLOW_DEV_SECRET:-0}"
      # Every named formal profile must declare a non-placeholder HTTPS host;
      # deploy preflight validates HTTPS coherence before migrations/seeding.
      ANILA_HOST: "${ANILA_HOST:?ANILA_HOST must be set to the formal HTTPS host}"
      # Gate 1 F6: deployment identity is declared, then CSP startup verifies
      # every security-sensitive flag against this exact profile contract.
      ANILA_DEPLOYMENT_PROFILE: "${ANILA_DEPLOYMENT_PROFILE:?ANILA_DEPLOYMENT_PROFILE must be declared}"
      # Populated only by the named break-glass lifecycle command.  Keeping
      # them explicit in Compose is required: values left only in host .env do
      # not reach the CSP process.
      ANILA_BREAK_GLASS_OWNER: "${ANILA_BREAK_GLASS_OWNER:-}"
      ANILA_BREAK_GLASS_TICKET: "${ANILA_BREAK_GLASS_TICKET:-}"
      ANILA_BREAK_GLASS_EXPIRES_AT: "${ANILA_BREAK_GLASS_EXPIRES_AT:-}"
      # Cookie-tossing defense: formal sessions use Secure, Path=/, no Domain
      # and the browser-enforced __Host- prefix. Never make this configurable
      # on the production compose path.
      COOKIE_SECURE: "true"
      # url_guard 兩個 SSRF opt-in。loopback / link-local / cloud
      # metadata / docker service name 永遠擋,不受 flag 影響。Prod 不要 set。
      ANILA_ALLOW_HTTP_ENDPOINT: "${ANILA_ALLOW_HTTP_ENDPOINT:-0}"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "${ANILA_ALLOW_PRIVATE_ENDPOINT:-0}"
      # Slice 6 旗標分域:ANILA_ENV=production 時「模型」http 一律 fail-closed
      # (不受任何旗標放行);agent endpoint 的 http 放行改走 AGENT 專用旗標
      # (內網 MLSteam agent 用;legacy ANILA_ALLOW_HTTP_ENDPOINT 對 agent 仍可
      # 放行但記 deprecation warning)。
      ANILA_ENV: "${ANILA_ENV:-production}"
      ANILA_ALLOW_HTTP_AGENT_ENDPOINT: "${ANILA_ALLOW_HTTP_AGENT_ENDPOINT:-0}"
      # SSRF allow-list — single-label docker service names 預設被擋,
      # 列進這條才能註冊。新增模型 service 要同步加進這個值並重啟 csp。
      ANILA_TRUSTED_HOSTS: "${ANILA_TRUSTED_HOSTS:-gpt-oss-20b,gemma4,nv-embed-proxy,flux2-dev-agent,anila-agent,router,host.docker.internal}"
      # Router sentinel chat model (auto-seeded, non-secret). Empty default =
      # seed no-op:正式環境 URL guard 對 model endpoint 硬拒 http(不受旗標
      # 放行),預設 http://router:9000 會產出一個出廠即被拒的 sentinel。
      # formal 部署要啟用時自行設定可通過 guard 的 Router upstream。
      # ``router`` is single-label so it is trusted above.
      ANILA_ROUTER_SENTINEL_URL: "${ANILA_ROUTER_SENTINEL_URL:-}"
      # 稽核 IP 溯源:只信任 nginx 這一跳的 X-Forwarded-For。值由
      # intranet-deploy.sh 於 up 後自動解析 anila-nginx 容器位址寫入 .env
      # (/32);空值=只記直接對端(即 proxy IP)。禁填寬網段(見 .env.example)。
      ANILA_TRUSTED_PROXY_CIDRS: "${ANILA_TRUSTED_PROXY_CIDRS:-}"
      # 1=稽核寫入失敗即拒絕請求(write-ahead,推論前擋下)。正式營運的
      # 取捨:稽核 DB 故障會擋下所有推論;預設 0(fail-open,記 error log)。
      # W1-5:formal posture 契約現在要求 strict=1(稽核寫不進去就拒絕請求),
      # 所以**正式 compose 的預設必須是 1** —— 否則 startup_security 會擋下啟動,
      # 而 operator 只會看到一個沒頭沒尾的 posture 錯誤。
      # dev.yml 維持 0(開發時稽核 DB 抖一下不該讓請求全掛)。
      ANILA_AUDIT_STRICT: "${ANILA_AUDIT_STRICT:-1}"
      # Gate 5 R5/R7 formal model-governance boundary.  These values are
      # intentionally explicit container paths; the host-side material
      # directory is injected only through read-only mounts below.  A formal
      # profile cannot fall back to the disabled repository template.
      GATE5_MODEL_GOVERNANCE_ENABLED: "${GATE5_MODEL_GOVERNANCE_ENABLED:-true}"
      GATE5_MODEL_GOVERNANCE_STARTUP_REQUIRED: "${GATE5_MODEL_GOVERNANCE_STARTUP_REQUIRED:-true}"
      GATE5_MODEL_GOVERNANCE_INVENTORY_PATH: /etc/anila/governance/inventory.json
      GATE5_MODEL_GOVERNANCE_PROFILE_PATH: /etc/anila/governance/profile.json
      GATE5_MODEL_GOVERNANCE_TRUST_STORE_PATH: /etc/anila/governance/trust-store.json
      GATE5_MODEL_GOVERNANCE_OBSERVED_FACTS_PATH: /etc/anila/governance/observed-facts.json
      GATE5_MODEL_GATEWAY_ENDPOINT: "${GATE5_MODEL_GATEWAY_ENDPOINT:-http://csp:8000/v1}"
      # FLUX.2-dev is non-commercial and has no production legal approval in
      # this release.  Keep the capability absent until a named, signed
      # legal-approved overlay supplies this marker and its callsite binding.
      GATE5_FLUX_LEGAL_APPROVED: "${GATE5_FLUX_LEGAL_APPROVED:-false}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-30}"
      # Formal posture: keep refresh reuse strict (startup rejects non-zero).
      ANILA_REFRESH_REUSE_GRACE_SECONDS: "${ANILA_REFRESH_REUSE_GRACE_SECONDS:-0}"
      # LLM proxy upstream timeout — Studio deck 生成的 prompt 可達 10K+
      # tokens,gemma4 處理 wall-clock 達 240s 級。default 120 太緊 → csp
      # 自己 mid-stream timeout 把連線關掉 → anila-studio 觀察到 ReadTimeout。
      LLM_TIMEOUT: "${LLM_TIMEOUT:-300}"
      # ── 連線池與 PG session guard(2026-07-28 接線)────────────────────
      # 這五個先前只存在於 `app/config.py`,**沒有任何 compose 引用它們**——
      # 而根 compose 只做 `${...}` 代換,不會把沒被引用的變數注入容器,所以
      # 運維在 `.env` 寫了也不會生效,池永遠是寫死的 10+20=30。
      #
      # ⚠ 兩個要一起看的數字:Starlette 對 sync endpoint 用 anyio 預設 **40**
      # 條執行緒,每條持 1 連線,池卻只有 30 —— 這兩個數字從一開始就對不上。
      # PG 端 `max_connections` 未覆寫 = PostgreSQL 預設 **100**,是真上限,
      # 而 alembic / 維運 / ingestion-worker 也要從那 100 裡分。往上調時
      # `POOL_SIZE + MAX_OVERFLOW` 請留足餘裕,並搭配負載量測而不是憑感覺。
      ANILA_DB_POOL_SIZE: "${ANILA_DB_POOL_SIZE:-10}"
      ANILA_DB_MAX_OVERFLOW: "${ANILA_DB_MAX_OVERFLOW:-20}"
      ANILA_DB_POOL_TIMEOUT_S: "${ANILA_DB_POOL_TIMEOUT_S:-10}"
      ANILA_DB_POOL_RECYCLE_S: "${ANILA_DB_POOL_RECYCLE_S:-1800}"
      ANILA_DB_LOCK_TIMEOUT_MS: "${ANILA_DB_LOCK_TIMEOUT_MS:-5000}"
      # ⚠ 必須大於 LLM_TIMEOUT×1000。同步 proxy 會握著治理交易等上游模型,
      # 對 PG 而言那整段是 idle-in-transaction;設得比推論逾時短,慢一點的
      # 推論就會被 PG 砍掉 session,使用者看到 5xx 而不是「慢」。CSP 啟動時
      # 會檢查這個不變式並在違反時記 error log。
      ANILA_DB_IDLE_TX_TIMEOUT_MS: "${ANILA_DB_IDLE_TX_TIMEOUT_MS:-330000}"
      # 匯出稽核:預設 false 時 `POST /api/conversations/{id}/export-record`
      # 不寫 `export_records`,Wave 1 要求的匯出稽核等於沒開。接進來讓部署
      # 範本能宣告正式姿態。
      ANILA_EXPORT_RECORD_REQUIRED: "${ANILA_EXPORT_RECORD_REQUIRED:-false}"
      # CSP 對下游 agent 注入這個 header,downstream 用它認 CSP source。
      # 跟 router service 必須同值,缺值直接 fail (避免 prod 部署誤用 dev token)。
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:?CSP_SERVICE_TOKEN must be set}
      # Dedicated non-legacy Service Client secret. CSP bootstraps/verifies the
      # exact artifact_tool + artifact-egress registry binding from this value.
      STUDIO_ARTIFACT_SERVICE_TOKEN: ${STUDIO_ARTIFACT_SERVICE_TOKEN:?STUDIO_ARTIFACT_SERVICE_TOKEN must be set}
      STUDIO_RUNTIME_SERVICE_TOKEN: ${STUDIO_RUNTIME_SERVICE_TOKEN:?STUDIO_RUNTIME_SERVICE_TOKEN must be set separately}
      INGESTION_QUEUE_HMAC_KEY: ${INGESTION_QUEUE_HMAC_KEY:?INGESTION_QUEUE_HMAC_KEY must be set}
      # ── formal authentication profile (card or password) ───────────────
      # ⚠ fork 區:main→prod sync 時不可拿 main 版 compose 整檔覆蓋 —
      # 6fcbdce (PR #16) 曾把這段蓋掉,內網就沒有刷卡登入了 (P0 迴歸)。
      # Password profiles pass explicit false values. Card/break-glass
      # preflight supplies true values; CSP startup remains fail-closed when
      # card posture/material is missing or inconsistent.
      # 私鑰/PIN 運算由使用者 PC 的 HiPKI 元件 (localhost:16888) 處理；backend
      # 仍會驗 CMS SignerInfo、challenge nonce 與釘選 CSPKI 憑證鏈後才抽 claims。
      ENABLE_CARD_LOGIN: "${ENABLE_CARD_LOGIN:-false}"
      REQUIRE_CARD_LOGIN_ONLY: "${REQUIRE_CARD_LOGIN_ONLY:-false}"
      JWT_ISSUER: "${JWT_ISSUER:-https://anila.internal/csp}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-anila-platform}"
      JWT_LEEWAY_SECONDS: "${JWT_LEEWAY_SECONDS:-60}"
      # Formal posture: anonymous shares and long-term memory are disabled.
      # Dev uses its separate compose file and opts in explicitly.
      ENABLE_PUBLIC_SHARE: "${ENABLE_PUBLIC_SHARE:-false}"
      ENABLE_MEMORY: "${ENABLE_MEMORY:-false}"
      DEBUG: "${DEBUG:-false}"
      ENABLE_API_DOCS: "${ENABLE_API_DOCS:-false}"
      SKIP_STARTUP_MIGRATIONS: "${SKIP_STARTUP_MIGRATIONS:-false}"
      ALLOW_AUTO_KEYGEN: "${ALLOW_AUTO_KEYGEN:-false}"
      CARD_DEV_SKIP_NONCE_BINDING: "${CARD_DEV_SKIP_NONCE_BINDING:-false}"
      ALLOW_LEGACY_AGENT_DISPATCH: "${ALLOW_LEGACY_AGENT_DISPATCH:-false}"
      ANILA_PILOT_MODE: "${ANILA_PILOT_MODE:-false}"
      ENABLE_PILOT_PROMPT_GENERATOR: "${ENABLE_PILOT_PROMPT_GENERATOR:-false}"
      ENABLE_PILOT_INGESTION_JUDGE: "${ENABLE_PILOT_INGESTION_JUDGE:-false}"
      ENABLE_PILOT_STUDIO_ARTIFACTS: "${ENABLE_PILOT_STUDIO_ARTIFACTS:-false}"
      PILOT_FIRST_PARTY_AGENT_ALLOWLIST: "${PILOT_FIRST_PARTY_AGENT_ALLOWLIST:-}"
      # Runtime read-back of the exact content ID used by this service. Gate 2
      # signed-pilot v3 profiles must bind this value or CSP refuses startup.
      GATE2_CSP_IMAGE_ID: "${ANILA_IMAGE_CSP:?ANILA_IMAGE_CSP must be a locked image content ID}"
      PUBLIC_SHARE_MAX_TTL_HOURS: "${PUBLIC_SHARE_MAX_TTL_HOURS:-168}"
      # Used to normalize auto-seeded relative launch paths.  A formal host
      # must never seed localhost URLs into the governance registry.
      SITE_URL: ${SITE_URL:?SITE_URL must be set to the formal external origin}
      # Card-only bootstrap material is optional at Compose interpolation time
      # so password profiles render without it. Card preflight and CSP startup
      # still require every value when card-only is declared.
      CARD_INITIAL_OWNERS: "${CARD_INITIAL_OWNERS:-}"
      # endpoint_url 是 base URL,proxy_service 自己加 ``/v1/chat/completions``
      # 或 ``/v1/embeddings``。**不要**在 URL 結尾加 ``/v1``,否則拼成
      # ``/v1/v1/...`` → 404 → router 端 RemoteProtocolError。
      # 事實抽取 (memory_service) 用的 LLM。預設對齊 LOCAL_LLM_MODEL
      # (= 下方 AUTO_REGISTER 的 LLM 註冊名),內網把主 LLM 改成 gpt-oss 後
      # 抽取自動跟著走,不會卡在預設 gemma4(內網未部署)。程式另有保險:
      # 設定的 model 在 registry 查不到時 fallback 到任一 active LLM。
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-${LOCAL_LLM_MODEL:-gemma4}}
      # auto_seed 會用這條覆寫 DB 既有 row,改完 /models UI 也要同步改。
      AUTO_REGISTER_MODELS: >-
        [{"name":"${LOCAL_LLM_MODEL:-gpt-oss-20b}","display_name":"${LOCAL_LLM_MODEL:-gpt-oss-20b}","model_type":"llm","endpoint_url":"${LOCAL_LLM_BASE_URL:-http://gpt-oss-20b:8000}","api_version":"v1","description":"On-prem local LLM (anila-models-net)"},{"name":"gemma4","display_name":"gemma4","model_type":"llm","endpoint_url":"${GEMMA4_BASE_URL-http://gemma4:8000}","api_version":"v1","description":"On-prem gemma4 vLLM — Router primary"},{"name":"${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}","display_name":"${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}","model_type":"embedding","endpoint_url":"${LOCAL_EMBEDDING_BASE_URL:-http://nv-embed-proxy:8000}","api_version":"v1","description":"On-prem NV-embed-V2 via FastAPI shim (anila-models-net)"}]
      # Phase G：agents 表的 declarative 來源(不同於 model_registry,後者是 catalog;
      # agents 表才是 Router /v1/agents 與 DISPATCH 路徑會 join 的權限源)。
      # FLUX_AGENT_BASE_URL 用 `${VAR-default}` (無冒號):「沒設」→ 同主機
      # docker DNS 預設;「設成空字串」→ auto_seed 跳過該 entry (內網無 FLUX
      # 時用這招停用繪圖 agent,避免註冊一個打不通的 dead agent 給 Router)。
      # No third-party/official Agent is admitted in the formal default set.
      # A legal-approved signed overlay may replace this with the image shim
      # manifest; an empty list is intentional and fail-closed.
      AUTO_REGISTER_AGENTS: "[]"
      # AUTO_SEED_API_KEYS: prod initial 模式只 seed ingestion-worker (系統內部
      # 必需,讓 worker 能呼叫 csp /v1/embeddings)。smoke-user 是 e2e 測試用的
      # 帳號,prod 不需要,已移除。要恢復就把舊 entry 加回來 (參考 .env.dev.local
      # 同步區段或 git history)。
      AUTO_SEED_API_KEYS: >-
        [{"username":"ingestion-worker","email":"ingestion-worker@anila.local","role":"system","key":"${INTERNAL_PLATFORM_API_KEY:?INTERNAL_PLATFORM_API_KEY must be set}","key_name":"ingestion-worker-system-key","models":["${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}"]}]
      # is_public / required_roles 互動:
      #   is_public=false → 走 allowlist (admin 手動授權)
      #   is_public=true  → required_roles 過得了的人都看得到
      #   admin 永遠 bypass
      AUTO_REGISTER_LINKS: >-
        [
          {"name":"ANILA","url":"/anila","icon":"message-square","description":"AI 對話入口 — Router 自動分派最合適的 agent 處理查詢","sort_order":1,"is_public":false,"required_roles":[]},
          {"name":"ANILA LM","url":"/anilalm","icon":"book-open","description":"AI 學習內容生成（podcast / slides / mind map / quiz / report）","sort_order":2,"is_public":false,"required_roles":[]},
          {"name":"Code Server (按需)","env_seed_key":"Code Server","url":"https://${CODESERVER_HOST:-code.ai.ncsist.org.tw}/","icon":"code","description":"獨立來源的隔離開發 sandbox；需先由維運啟用 developer-tools profile並使用原生密碼登入","sort_order":3,"is_public":false,"required_roles":["admin"]},
          {"name":"n8n 工作流程","url":"https://${N8N_HOST:-n8n.ai.ncsist.org.tw}/","icon":"workflow","description":"獨立來源的自動化工作流程平台；使用 n8n 原生帳號登入","sort_order":4,"is_public":true,"required_roles":["developer"]},
          {"name":"GitLab","url":"https://${GITLAB_HOST:-gitlab.ai.ncsist.org.tw}/","icon":"git-branch","description":"獨立來源的 Git server 與 issue tracking；使用 GitLab 原生認證（ISO 42001 合規必備）","sort_order":5,"is_public":true,"required_roles":["developer"]},
          {"name":"MLSteam","url":"https://aiops.ai.ncsist.org.tw:4443/","icon":"cpu","description":"MLOps 平台 — agent 訓練與部署","sort_order":6,"is_public":true,"required_roles":["developer"]}
        ]
      ANILA_TEMPLATE_DIR: /app/anila-template
      INGESTION_UPLOAD_DIR: /var/anila/ingestion-uploads
      INGESTION_OUTBOX_STALE_SECONDS: "${INGESTION_OUTBOX_STALE_SECONDS:-120}"
      # Conversation attachments are durable application data.  The named
      # volume inherits UID 10001 ownership from the image directory.
      ATTACHMENT_STORAGE_PATH: /var/anila/attachments
      # Gate 2 sealed retrieval evidence contains the exact bounded source
      # slabs supplied to the model.  Keep it under the external formal state
      # root, never in the repository/share bind mounts.
      SOURCE_SNAPSHOT_STORAGE_PATH: /var/lib/anila/source-snapshots
      ARTIFACT_BLOB_STORAGE_PATH: /var/lib/anila/artifact-blobs
      RETENTION_ENABLED: "true"
      RETENTION_ARTIFACT_ACTIVE_DAYS: "${RETENTION_ARTIFACT_ACTIVE_DAYS:-30}"
      RETENTION_ARTIFACT_ARCHIVE_DAYS: "${RETENTION_ARTIFACT_ARCHIVE_DAYS:-365}"
      RETENTION_INGESTION_ACTIVE_DAYS: "${RETENTION_INGESTION_ACTIVE_DAYS:-365}"
      RETENTION_INGESTION_ARCHIVE_DAYS: "${RETENTION_INGESTION_ARCHIVE_DAYS:-365}"
      RETENTION_REAPER_INTERVAL_SECONDS: "${RETENTION_REAPER_INTERVAL_SECONDS:-300}"
      RETENTION_REAPER_LEASE_SECONDS: "${RETENTION_REAPER_LEASE_SECONDS:-900}"
      RETENTION_REAPER_BATCH_SIZE: "${RETENTION_REAPER_BATCH_SIZE:-50}"
      RETENTION_ALLOW_ARCHIVED_DOWNLOADS: "${RETENTION_ALLOW_ARCHIVED_DOWNLOADS:-false}"
      # 出向 https 的 CA 信任 (內網模型主機 10.53.100.12 走 https,憑證通常
      # 是內部 CA / 自簽 — 不在 certifi 預設信任鏈內,httpx 會
      # CERTIFICATE_VERIFY_FAILED)。把 IT 給的 PEM 放 ./share/pki/ 並在
      # .env 設 ANILA_MODEL_CA_FILE=/etc/anila/pki/<file>.pem。
      # 沒設 (空值) = 維持 httpx 預設 certifi 行為 (CPython 對空/不存在的
      # SSL_CERT_FILE 會 fallback 系統預設,無副作用)。
      SSL_CERT_FILE: ${ANILA_MODEL_CA_FILE-}
      # Card signature verification has its own trust bundle.  Keep the
      # packaged CSPKI roots by default, but allow an operator-provisioned
      # intranet CA from the read-only /etc/anila/pki mount.
      CARD_CA_BUNDLE_PATH: ${CARD_CA_BUNDLE_PATH:-/app/app/services/cspki_ca_bundle.pem}
      CARD_CRL_REQUIRED: "${CARD_CRL_REQUIRED:-false}"
      CARD_CRL_BUNDLE_PATH: "${CARD_CRL_BUNDLE_PATH:-}"
      CARD_CRL_MAX_AGE_HOURS: "${CARD_CRL_MAX_AGE_HOURS:-24}"
      CARD_CRL_SOURCE: "${CARD_CRL_SOURCE:-}"
      CARD_REQUIRED_EKU_OID: "${CARD_REQUIRED_EKU_OID:-1.3.6.1.5.5.7.3.2}"
      CARD_REQUIRED_CERT_POLICY_OIDS: "${CARD_REQUIRED_CERT_POLICY_OIDS:-}"
      # 內網模型 gateway (10.53.100.12 My-OpenAI-Frontend) 的 /v1 要
      # Authorization: Bearer。proxy_service 只對 model 呼叫注入,agent
      # dispatch 不帶。空值 = 不注入 (同主機裸 vLLM 不需要)。
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY-}
      # FLUX image-gen for ANILALM studio pptx pipeline — wires
      # studio.image_provider.FluxImageProvider; empty BACKEND_URL
      # would make get_flux_provider() return None (toggle OFF).
      # `${VAR-default}` 無冒號:設成空字串 → get_flux_provider() 回 None
      # (toggle OFF,內網無 FLUX 時整個圖像 pipeline 乾淨停用)。
      # Formal CSP has no FLUX fallback endpoint.  A legal-approved overlay
      # must bind image-primary through the signed CSP governance profile.
      FLUX_BACKEND_URL: "${FLUX_BACKEND_URL-}"
      FLUX_MAX_CONCURRENT: "${FLUX_MAX_CONCURRENT:-4}"
      FLUX_TIMEOUT_SECONDS: "${FLUX_TIMEOUT_SECONDS:-180}"
      # FLUX_CACHE_DIR defaults to $INGESTION_UPLOAD_DIR/flux-cache
    volumes:
      # packages/anila-agent subtree (github.com/zzw09773/anila-agent) — 模板下載端用。
      # 更新走 git subtree pull/push,見 README §"Updating anila-agent"。
      - ../../packages/anila-agent:/app/anila-template:ro
      # 跟 ingestion-worker 共用 inode,不走拷貝。
      - ../../share/uploads/ingestion:/var/anila/ingestion-uploads
      - csp-attachments:/var/anila/attachments
      - "${ANILA_STATE_DIR:?ANILA_STATE_DIR must be an absolute path outside the repo}/source-snapshots:/var/lib/anila/source-snapshots"
      - "${ANILA_STATE_DIR:?ANILA_STATE_DIR must be an absolute path outside the repo}/artifact-blobs:/var/lib/anila/artifact-blobs"
      # 內網模型 https 的內部 CA PEM 放這裡 (見上 SSL_CERT_FILE)。
      - ../../share/pki:/etc/anila/pki:ro
      # JWT 簽章金鑰 (csp 簽 access token + 對 studio 發 JWKS)。正式私鑰
      # 必須位於 repo 外的受控 state 目錄；部署腳本會拒絕 repo 內路徑。
      # 缺值時 Compose 直接 fail-closed，不可回退到 ./secrets。
      - "${ANILA_SECRETS_DIR:?ANILA_SECRETS_DIR must be an absolute path outside the repo}:/app/secrets:ro"
      # Signed profile, public trust store and observed deployment facts are
      # supplied by the deployment bundle, never generated in this container.
      # Every file is mounted read-only; missing files are a preflight/startup
      # failure rather than a reason to use a repository template.
      - "${GATE5_MATERIAL_DIR:-/var/lib/anila/governance}/inventory.json:/etc/anila/governance/inventory.json:ro"
      - "${GATE5_MATERIAL_DIR:-/var/lib/anila/governance}/profile.json:/etc/anila/governance/profile.json:ro"
      - "${GATE5_MATERIAL_DIR:-/var/lib/anila/governance}/trust-store.json:/etc/anila/governance/trust-store.json:ro"
      - "${GATE5_MATERIAL_DIR:-/var/lib/anila/governance}/observed-facts.json:/etc/anila/governance/observed-facts.json:ro"
    extra_hosts:
      # csp 從這條 reach on-host service (e.g. host port 上的 embedding 後備)。
      - "host.docker.internal:host-gateway"
    networks:
      - default
      # 跨 project 的 external network — 解 ``gemma4`` / ``gpt-oss-20b`` /
      # ``nv-embed-proxy`` (在 infra/models/docker-compose.yml)。bootstrap 一次:
      #   bash infra/deployment/scripts/ensure-models-network.sh ensure
      - anila-models-net
    depends_on:
      csp-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ── Redis (Arq queue for ingestion-worker) ──────────────────────────────
  redis:
    image: ${ANILA_IMAGE_REDIS:?ANILA_IMAGE_REDIS must be a locked image content ID}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-use-rdb-preamble
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli ping | grep -qx PONG &&
          redis-cli INFO persistence | tr -d '\r' | grep -q '^aof_enabled:1$' &&
          redis-cli INFO persistence | tr -d '\r' | grep -q '^aof_last_write_status:ok$'
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── ingestion-worker (parse → chunk → embed → pgvector) ─────────────────
  ingestion-worker:
    build:
      context: ../..
      dockerfile: services/ingestion-worker/Dockerfile
    image: ${ANILA_IMAGE_INGESTION_WORKER:?ANILA_IMAGE_INGESTION_WORKER must be a locked image content ID}
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:?ANILA_DEPLOYMENT_PROFILE must be declared}
      DATABASE_URL: postgresql://csp_app:${CSP_APP_DB_PASSWORD:?CSP_APP_DB_PASSWORD must be set (same value as csp)}@csp-db:5432/csp
      REDIS_URL: redis://redis:6379
      INGESTION_QUEUE_HMAC_KEY: ${INGESTION_QUEUE_HMAC_KEY:?INGESTION_QUEUE_HMAC_KEY must be set}
      # 經由 CSP /v1/embeddings 走 token_usage 計量,不直連模型。
      EMBEDDING_BASE_URL: http://csp:8000/v1
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}
      EMBEDDING_MODEL_FINGERPRINT: ${EMBEDDING_MODEL_FINGERPRINT:?EMBEDDING_MODEL_FINGERPRINT must be sha256:<64 lowercase hex> for deployed embedding weights}
      EMBEDDING_API_KEY: ${INTERNAL_PLATFORM_API_KEY:?INTERNAL_PLATFORM_API_KEY must be set}
      EMBEDDING_DIM: "4000"
      PARSE_TIMEOUT_SECONDS: "${INGESTION_PARSE_TIMEOUT_SECONDS:-120}"
      INDEX_TIMEOUT_SECONDS: "${INGESTION_INDEX_TIMEOUT_SECONDS:-120}"
      JOB_TIMEOUT_SECONDS: "${INGESTION_JOB_TIMEOUT_SECONDS:-900}"
      JOB_LEASE_SECONDS: "${INGESTION_JOB_LEASE_SECONDS:-90}"
      JOB_HEARTBEAT_SECONDS: "${INGESTION_JOB_HEARTBEAT_SECONDS:-20}"
      JOB_LEASE_GRACE_SECONDS: "${INGESTION_JOB_LEASE_GRACE_SECONDS:-15}"
      UPLOAD_DIR: /var/anila/ingestion-uploads
      # judge 路徑要解 AES-encrypted credentials,cipher key 從 SECRET_KEY 派生,
      # **必須**跟 csp 同值,不然每次 judge decrypt 失敗會 silently skip。
      SECRET_KEY: ${CSP_SECRET_KEY:?CSP_SECRET_KEY must be set (same value as csp)}
      ANILA_ALLOW_DEV_SECRET: "${ANILA_ALLOW_DEV_SECRET:-0}"
      ANILA_ALLOW_HTTP_ENDPOINT: "${ANILA_ALLOW_HTTP_ENDPOINT:-0}"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "${ANILA_ALLOW_PRIVATE_ENDPOINT:-0}"
      ANILA_ENV: "${ANILA_ENV:-}"
      ANILA_ALLOW_HTTP_AGENT_ENDPOINT: "${ANILA_ALLOW_HTTP_AGENT_ENDPOINT:-0}"
      # VLM image captioning: ingest 時把 [[IMAGE:id]] placeholder 換成 caption
      # 才不會 chart/diagram 變成 [image] token 消失。走 csp /v1 proxy 為了計量。
      ENABLE_IMAGE_CAPTIONS: "${ENABLE_IMAGE_CAPTIONS:-true}"
      VISION_URL: "${VISION_URL:-http://csp:8000/v1}"
      VISION_MODEL: "${VISION_MODEL:-gemma4}"
      # 對齊 EMBEDDING_API_KEY 的 fail-loud convention — 不留 changeme fallback。
      VISION_API_KEY: ${INTERNAL_PLATFORM_API_KEY:?INTERNAL_PLATFORM_API_KEY must be set}
      VISION_VERIFY_SSL: "${VISION_VERIFY_SSL:-false}"
      VISION_CONCURRENCY: "${VISION_CONCURRENCY:-4}"
      VISION_TIMEOUT_SECONDS: "${VISION_TIMEOUT_SECONDS:-60}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../share/uploads/ingestion:/var/anila/ingestion-uploads
    expose:
      - "8081"
    depends_on:
      csp-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      csp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Router (anila-core-router :9000) ────────────────────────────────────
  router:
    build:
      context: ../..
      dockerfile: services/anila-core-router/Dockerfile
    image: ${ANILA_IMAGE_ROUTER:?ANILA_IMAGE_ROUTER must be a locked image content ID}
    # 不對 host 開 port — 外部走 nginx /router/* → router:9000。
    expose:
      - "9000"
    environment:
      CSP_BASE_URL: http://csp:8000
      CSP_JWKS_URL: http://csp:8000/.well-known/jwks.json
      ROUTER_CONTEXT_ISSUER: "${JWT_ISSUER:-https://anila.internal/csp}"
      # 必須跟 csp 的 CSP_SERVICE_TOKEN 一致 — router 用它走 service-auth endpoint。
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:?CSP_SERVICE_TOKEN must be set (same value as csp)}
      # 具名 service-client 權杖(router-chain-bootstrap.sh 產生,寫入 .env)。
      # 留空 = registry snapshot / 直答治理 fail-closed 拒絕。
      ANILA_CSP_REGISTRY_SERVICE_TOKEN: "${ANILA_CSP_REGISTRY_SERVICE_TOKEN:-}"
      ANILA_CSP_AGENT_SERVICE_TOKEN: "${ANILA_CSP_AGENT_SERVICE_TOKEN:-}"
      ANILA_CSP_INFERENCE_SERVICE_TOKEN: "${ANILA_CSP_INFERENCE_SERVICE_TOKEN:-}"
      ANILA_ROUTER_STATE_DIR: /var/lib/anila-router
      MODEL: ${LLM_MODEL:-gemma4}
      # Formal Router must export Full Trace spans back to CSP. /ready fails
      # closed in production when this callback is absent.
      ANILA_ENV: "${ANILA_ENV:-production}"
      COOKIE_SECURE: "true"
      ANILA_TRACE_ENDPOINT: "${ANILA_TRACE_ENDPOINT:-http://csp:8000}"
    volumes:
      - router-state:/var/lib/anila-router
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ── Official anila-agent Silver runtime (Gate 5 R5) ────────────────────
  # This is an explicit profile because production must provision a signed
  # Agent registry overlay and its CSP-issued csk- before admitting the
  # endpoint.  It is nevertheless part of the formal platform Compose graph
  # and is image-locked/inventory-tracked like every other built service.
  anila-agent:
    profiles: ["gate5-silver"]
    build:
      context: ../..
      dockerfile: packages/anila-agent/Dockerfile
      target: silver-runtime
    image: ${ANILA_IMAGE_ANILA_AGENT:?ANILA_IMAGE_ANILA_AGENT must be a locked image content ID}
    expose:
      - "8200"
    environment:
      ANILA_BASE_URL: http://csp:8000/v1
      CSP_BASE_URL: http://csp:8000
      ANILA_DEPLOYMENT_PROFILE: "${ANILA_DEPLOYMENT_PROFILE:-production}"
      # Profile services are still interpolated by Compose when the profile is
      # inactive.  Keep the value optional at render time, while the wrapper's
      # hard-coded ANILA_ALLOW_NO_SERVICE_TOKEN=0 rejects an unset/invalid csk-
      # when the profile is actually started.
      CSP_SERVICE_TOKEN: "${ANILA_AGENT_SERVICE_TOKEN:-}"
      CSP_SEARCH_TOKEN: "${ANILA_AGENT_SERVICE_TOKEN:-}"
      ANILA_AGENT_ID: anila-agent-silver
      ANILA_AGENT_NAME: anila-agent-silver
      ANILA_AGENT_MODEL_ID: "${ANILA_AGENT_MODEL_ID:-1}"
      ANILA_MODEL: "${ANILA_AGENT_MODEL_ID:-1}"
      ANILA_HOME: /var/lib/anila-agent
      ANILA_TRACE_ENDPOINT: http://csp:8000
      ANILA_TRACE_ENABLED: "true"
      ANILA_CLASSIFICATION_DEFAULT: "無機密"
      ANILA_CLASSIFICATION_CEILING: "無機密"
      ANILA_ALLOW_NO_SERVICE_TOKEN: "0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - anila-agent-state:/var/lib/anila-agent
    networks:
      - default
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ── nginx (HTTPS reverse proxy, 唯一外部入口) ────────────────────────────
  # TLS termination (self-signed dev cert),HTTP→HTTPS 301,proxy /, /api/,
  # /v1/, /v2/, /router/* 到對應內部 service。
  nginx:
    image: ${ANILA_IMAGE_NGINX:?ANILA_IMAGE_NGINX must be a locked image content ID}
    container_name: anila-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${ANILA_UI_HTTPS_PORT:-4443}:4443"
    volumes:
      - ../../infra/nginx/anila.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../infra/nginx/snippets/router-enabled.conf:/etc/nginx/snippets/router-posture.conf:ro
      - ../../infra/nginx/snippets/extra-anila-hosts.empty.conf:/etc/nginx/snippets/extra-anila-hosts.conf:ro
      # TLS private key 與 JWT key 同樣不得落在 repo；正式路徑由 operator
      # 明確提供，避免 gitignore 被誤當成 secret boundary。
      - "${ANILA_TLS_CERTS_DIR:?ANILA_TLS_CERTS_DIR must be an absolute path outside the repo}:/etc/nginx/certs:ro"
      - ../../share/static:/usr/share/nginx/share-files/static:ro
      - ../../share/uploads:/usr/share/nginx/share-files/uploads:rw
    depends_on:
      # `restart: true` (compose 2.17+): upstream rebuild 後 nginx 跟著 restart,
      # 不然 nginx.conf 的 static upstream block 把舊 IP 釘死 → 502。
      csp:
        condition: service_healthy
        restart: true
      anilalm:
        condition: service_healthy
        restart: true
      router:
        condition: service_healthy
        restart: true
      anila-ui:
        condition: service_healthy
        restart: true
    networks:
      - default
      - n8n-tools
      - gitlab-tools
      - codeserver-tools
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── pptx-renderer (Node + LibreOffice for slide / vision-QA screenshots) ─
  pptx-renderer:
    build:
      context: ../../services/pptx-renderer
      dockerfile: Dockerfile
    image: ${ANILA_IMAGE_PPTX_RENDERER:?ANILA_IMAGE_PPTX_RENDERER must be a locked image content ID}
    expose:
      - "7100"
    healthcheck:
      # bookworm-slim 沒 curl/wget,用 node 自帶 http。
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── anila-studio (Studio extraction Phase 2 skeleton) ───────────────────
  # Deck generation service extracted out of csp/backend. Reads JWKS +
  # token revocation events from csp via HTTP/Redis so cross-service auth
  # works without sharing the private signing key.
  anila-studio:
    build:
      context: ../../services/anila-studio
      dockerfile: Dockerfile
    image: ${ANILA_IMAGE_ANILA_STUDIO:?ANILA_IMAGE_ANILA_STUDIO must be a locked image content ID}
    expose:
      - "8100"
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:?ANILA_DEPLOYMENT_PROFILE must be declared}
      # Formal image inference must revalidate CSP provider authority before
      # every downstream call; the explicit flag is also consumed by the
      # model-side FLUX shim in infra/models/docker-compose.yml.
      GATE5_MODEL_GOVERNANCE_ENABLED: "${GATE5_MODEL_GOVERNANCE_ENABLED:-true}"
      CSP_BASE_URL: http://csp:8000
      # 跟 csp 共用同一把 service-to-service token,讓 cold-start sync
      # /api/auth/revocations 能透過 X-CSP-Service-Token header 通過
      # csp 的 verify_service_token。對齊 csp / router / ingestion-worker
      # 的 prod fail-loud convention(缺值直接停,不走 dev fallback)。
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:?CSP_SERVICE_TOKEN must be set (same value as csp)}
      # Artifact writes never use the shared legacy CSP_SERVICE_TOKEN above.
      STUDIO_ARTIFACT_SERVICE_TOKEN: ${STUDIO_ARTIFACT_SERVICE_TOKEN:?STUDIO_ARTIFACT_SERVICE_TOKEN must be set (dedicated named service client)}
      STUDIO_RUNTIME_SERVICE_TOKEN: ${STUDIO_RUNTIME_SERVICE_TOKEN:?STUDIO_RUNTIME_SERVICE_TOKEN must be set (separate task-scoped runtime client)}
      STUDIO_JOB_ENVELOPE_HMAC_KEY: ${STUDIO_JOB_ENVELOPE_HMAC_KEY:?STUDIO_JOB_ENVELOPE_HMAC_KEY must be set}
      STUDIO_DURABLE_SUPERVISOR: "true"
      STUDIO_ARTIFACT_REPORTING: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      # Gate 5 formal default keeps FLUX disabled until legal approval.
      # Empty backend is deliberate: studio must not fall back to a raw model
      # host when the signed image-primary binding is absent.
      # 2026-07 起走 OpenAI 相容 Images API(POST {base}/v1/images/generations);
      # base URL 指伺服器根或含 /v1 皆可(client 自動補版本段)。
      FLUX_BACKEND_URL: "${FLUX_BACKEND_URL-}"
      # OpenAI Images API 的 model 欄位(依 FLUX 服務公布的模型名填)。
      FLUX_MODEL: ${FLUX_MODEL:-flux.2-dev}
      # 有值才帶 Authorization: Bearer;留空 = 不帶(本機 flux2-dev 免驗)。
      FLUX_API_KEY: ${FLUX_API_KEY-}
      # 對齊 volume mount 路徑。studio.py 內讀 os.environ["FLUX_CACHE_DIR"],
      # 預設 fallback 是 csp 的 /var/anila/ingestion-uploads/flux-cache,在
      # anila-studio container 內不存在/沒權限,所以這條 env 必須顯式設。
      FLUX_CACHE_DIR: /var/anila/anila-studio-flux-cache
      # report / mindmap / infographic / datatable 4 種 artifact 的持久化目錄。
      # 每個 job 落地 {job_id}.{html,pdf,docx,svg,csv,xlsx}, 24h 後 prune。
      ARTIFACTS_DIR: /var/anila/anila-studio-artifacts
      RENDERER_BASE_URL: http://pptx-renderer:7100
      JWT_KID: anila-v1
      JWT_ISSUER: "${JWT_ISSUER:-https://anila.internal/csp}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-anila-platform}"
      JWT_LEEWAY_SECONDS: "${JWT_LEEWAY_SECONDS:-60}"
      REVOCATION_RECONCILE_INTERVAL_SECONDS: "${REVOCATION_RECONCILE_INTERVAL_SECONDS:-5}"
      # Keep Studio's browser assurance flag aligned with CSP's selected
      # formal profile; card posture is supplied by preflight, never hard-coded.
      REQUIRE_CARD_LOGIN_ONLY: "${REQUIRE_CARD_LOGIN_ONLY:-false}"
      COOKIE_SECURE: "true"
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
      redis:
        condition: service_healthy
      pptx-renderer:
        condition: service_healthy
    volumes:
      - anila-studio-flux-cache:/var/anila/anila-studio-flux-cache
      - anila-studio-artifacts:/var/anila/anila-studio-artifacts
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── ASR gateway (串流語音輸入的 WS 端點) ─────────────────────────────────
  # 瀏覽器麥克風 → WSS /asr/stream → 這裡切句 → asr-decoder (GPU) → 文字。
  # 純 CPU、無 DB、無 GPU;規格見 docs/planning/asr-voice-input-plan.md §2.2。
  #
  # ⚠ profiles: 預設不啟動。七條分支共用本檔,ASR 未必每個部署都開。
  #   要開:COMPOSE_PROFILES=asr(nginx 端已用變數式 proxy_pass,沒開也不會
  #   讓 nginx 起不來 —— 見 infra/nginx/anila.conf 的 /asr/ location)。
  # ⚠ 麥克風還需要 nginx 放寬 Permissions-Policy,否則 getUserMedia 一律
  #   NotAllowedError,而且症狀跟「使用者拒絕權限」一模一樣。
  asr-gateway:
    profiles: ["asr"]
    build:
      context: ../../services/asr-gateway
      dockerfile: Dockerfile
    image: ${ANILA_IMAGE_ASR_GATEWAY:?ANILA_IMAGE_ASR_GATEWAY must be a locked image content ID}
    expose:
      - "8200"
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:?ANILA_DEPLOYMENT_PROFILE must be declared}
      # ── decoder ──
      # 內部版(語音不出主機,內網優先):http://asr-decoder:9000 走
      # anila-models-net。外部版(decoder 在別台 GPU 主機):
      # http://<gpu-host>:9000 + ASR_ALLOW_HTTP_DECODER=1,那等於接受語音
      # 明文過內網,是書面風險接受項(規劃書 §6)。
      ASR_DECODE_URL: ${ASR_DECODE_URL:-http://asr-decoder:9000}
      # Compose 對非啟用 profile 的服務也會做插值(同 flux2-dev-agent 的
      # FLUX_AGENT_SERVICE_TOKEN 慣例)→ compose 層給空預設,讓預設 stack
      # 不設此變數也能 resolve;真正的防線是 gateway 啟動時 fail-loud
      # (_validate_settings 缺 token 直接拒絕啟動)。
      ASR_DECODER_TOKEN: ${ASR_DECODER_TOKEN-}
      ASR_ALLOW_HTTP_DECODER: ${ASR_ALLOW_HTTP_DECODER:-0}
      # ── 辨識 ──
      # 通用型 ASR:不加 glossary / hotwords / 數字正規化(2026-07-17 定案)。
      # 這個 prompt 是通用的,不是領域詞典 —— 實測 CER 2.74%→1.71%。
      ASR_INITIAL_PROMPT: ${ASR_INITIAL_PROMPT:-以下是繁體中文。}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-5}
      # 負載過高時的第一個旋鈕:關掉 partial(邊講邊出字),只留定稿。
      # 「十人級」指同時在線 session,不是同時講話的人 —— 2~3 人同時講話
      # 就會讓單張卡的 partial 解碼飽和。
      ASR_PARTIALS_ENABLED: ${ASR_PARTIALS_ENABLED:-1}
      # ⚠ 預設 off 且不要用 s2twp。實測:whisper 在真實繁中語料的簡體率 0%,
      # 而 OpenCC 對正確繁體誤傷 6~10%(s2twp 會把「類型」轉成「型別」)。
      # 見規劃書 §10。
      ASR_OPENCC_MODE: ${ASR_OPENCC_MODE:-off}
      ASR_MAX_SESSION_SECONDS: ${ASR_MAX_SESSION_SECONDS:-300}
      # ── 認證(與 anila-studio 同名同義;app/services/ 下是 studio 的
      #    vendored 副本,欄位名不可漂移。見規劃書 §12)──
      CSP_BASE_URL: http://csp:8000
      # revocation cache 冷啟動要拿它打 csp 的 /api/auth/revocations 做全量
      # 同步。漏了它 cache 永遠不 ready,fail-closed 之下所有 WS 一律被拒,
      # 症狀長得像 auth 壞掉。
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:?CSP_SERVICE_TOKEN must be set (same value as csp)}
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      JWT_KID: anila-v1
      JWT_ISSUER: "${JWT_ISSUER:-https://anila.internal/csp}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-anila-platform}"
      JWT_LEEWAY_SECONDS: "${JWT_LEEWAY_SECONDS:-60}"
      REVOCATION_RECONCILE_INTERVAL_SECONDS: "${REVOCATION_RECONCILE_INTERVAL_SECONDS:-5}"
      # 跟 csp / anila-studio 同一個旗標、同樣預設。main 的 formal downstream
      # profile(2026-07)把預設翻成 false(帳密優先):password profile 不設此
      # 值就走帳密,card profile 由 preflight 顯式帶 true。gateway 必須跟著預設
      # false,否則帳密 profile 部署時 csp 走帳密、gateway 卻擋帳密 session
      # (amr=["pwd"] → 4401)。一個 env 同時控制三者(csp/studio/gateway)。
      REQUIRE_CARD_LOGIN_ONLY: "${REQUIRE_CARD_LOGIN_ONLY:-false}"
      # 決定 access cookie 名走哪一軌。瀏覽器的 WS API 不能帶 Authorization
      # header → cookie 是唯一路徑,名字錯就是全部 4401。
      COOKIE_SECURE: "true"
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      # 內部版 decoder 在 anila-models-net(infra/models/docker-compose.yml)。
      # 只掛 default 的話 DNS 解不到 asr-decoder。外部版不需要這條,但留著
      # 無害(network 存在即可)。
      - anila-models-net
    healthcheck:
      # ⚠ 路徑自帶 /asr 前綴(nginx 的 location /asr/ 不 strip)。打 /health
      # 會 404 —— 那是路徑錯,不是服務掛了。
      # 撤銷是 fail-closed → cache 沒 ready 時 /asr/health 回 503,這是刻意的:
      # 那時 ASR 本來就不能用,綠燈只會讓 operator 查錯方向。
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/asr/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── ANILA LM (Vite/React SPA at /anilalm/) ──────────────────────────────
  anilalm:
    build:
      context: ../../apps/anilalm
      args:
        BASE_PATH: ${ANILALM_BASE_PATH:-/anilalm/}
        VITE_DEFAULT_CHAT_MODEL: ${ANILALM_DEFAULT_CHAT_MODEL:-gemma4}
        VITE_ANILA_PILOT_MODE: "false"
    image: ${ANILA_IMAGE_ANILALM:?ANILA_IMAGE_ANILALM must be a locked image content ID}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # ── ANILA UI (admin SPA, same-origin via nginx) ─────────────────────────
  anila-ui:
    build:
      # repo-root context（同 csp 慣例）：shell 以 Vite alias 引用共用設計
      # 系統 packages/ui 原始碼，build context 必須涵蓋兩個目錄。
      context: ../..
      dockerfile: apps/anila-shell/Dockerfile
      args:
        # 空字串 → SPA 用相對 URL,所有請求 same-origin (clipboard secure context)。
        VITE_CSP_BASE_URL: ${ANILA_PUBLIC_CSP_BASE_URL-}
        VITE_ROUTER_BASE_URL: ${ANILA_PUBLIC_ROUTER_BASE_URL:-/router}
        # 同源 subpath(2026-06-11 B 案):443 的 /anila/,SSO cookie 自然共用。
        # 本機 dev 直跑 vite 時不受影響(無此 env = '/')。
        BASE_PATH: ${ANILA_UI_BASE_PATH:-/anila/}
    image: ${ANILA_IMAGE_ANILA_UI:?ANILA_IMAGE_ANILA_UI must be a locked image content ID}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # ── code-server (opt-in developer tool) ─────────────────────────────────
  # Browser-based VS Code,reachable only at https://code.ai.ncsist.org.tw/.
  # 不屬於正式預設 stack；必須明確使用 ``--profile developer-tools`` 啟動。
  # workspace 固定在隔離的 git-ignored sandbox,不接受 env 改回 repo root。
  # 要開發 ANILA 時,先把獨立 clone 放進 share/codeserver-sandbox/。
  # 用 codercom 上游而非 lscr.io/linuxserver fork — 後者多一層 s6-overlay
  # 會破 subpath 部署 (workspace fs provider 註冊失敗)。
  # 獨立來源避免 CSP host-only session cookie 進入 IDE；原生強密碼是登入邊界。
  codeserver:
    profiles: ["developer-tools"]
    image: ${ANILA_IMAGE_CODESERVER:?ANILA_IMAGE_CODESERVER must be a locked image content ID}
    # 1001:1001 對齊 host 'aia' UID,避免容器內存檔 EACCES。
    user: "${UID:-1001}:${GID:-1001}"
    environment:
      TZ: Asia/Taipei
      # startup_security 拒絕 dev 預設 `changeme-codeserver`,prod 必設真值。
      PASSWORD: ${CODESERVER_PASSWORD:?CODESERVER_PASSWORD must be set}
    volumes:
      - codeserver_config:/home/coder/.config
      # 只掛隔離 workspace。repo root 內有 .env、TLS/JWT 私鑰與 PKI 材料,
      # 不能靠逐檔 /dev/null 遮蔽(新機密檔一出現就會漏)。
      - ../../share/codeserver-sandbox:/home/coder/workspace
    working_dir: /home/coder/workspace
    networks:
      - codeserver-tools
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── n8n workflow automation (retained intranet service) ────────────────
  # 獨立來源 https://n8n.ai.ncsist.org.tw/。重要 hardening (不要回退):
  #   - NODE_TLS_REJECT_UNAUTHORIZED 預設 1。要連自簽 endpoint 逐節點設
  #     self-signed CA,**不要**全域關 TLS 驗證 (歷史教訓)。
  #   - Code Node 模組白名單寫死,避免變成任意 require() 的 RCE 平台。
  #   - n8n 原生 user-management 是登入邊界；不得與 CSP 共用瀏覽器 origin。
  #     webhook / form ingress 在 nginx 一律 fail-closed；若要接 machine
  #     callback，必須另建 mTLS / signed machine ingress。
  n8n:
    # W1-8:與 codeserver 同姿態,**預設不啟動**。
    # 先前 n8n 與 gitlab 都沒有 profiles: → 七條分支(含交付規格要求移除開發者
    # 工具的軍用分支)照 runbook 部署就會把它們一起拉起來。n8n 有自己的
    # user-management 邊界、gitlab 有自己的 root 初始密碼,兩者都不吃 CSP 的
    # auth_request —— 預設隨 stack 啟動等於在平台旁邊多開兩個獨立認證面。
    # 要用就顯式 `--profile developer-tools`。
    profiles: ["developer-tools"]
    image: ${ANILA_IMAGE_N8N:?ANILA_IMAGE_N8N must be a locked image content ID}
    # 用 image 內建 'node' user (UID 1000),不要 override user — n8n 首次
    # 開機 HOME 對不上會 mkdir /.n8n EACCES。
    environment:
      TZ: Asia/Taipei
      N8N_PATH: /
      N8N_HOST: ${N8N_HOST:-n8n.ai.ncsist.org.tw}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://n8n.ai.ncsist.org.tw/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.ai.ncsist.org.tw/}
      # 官方 reverse-proxy contract：信任最後一跳 nginx 提供的
      # X-Forwarded-For / Host / Proto；不可放大成 >1。
      N8N_PROXY_HOPS: "1"
      NODE_TLS_REJECT_UNAUTHORIZED: "${N8N_TLS_REJECT_UNAUTHORIZED:-1}"
      # nginx 提供 X-Forwarded-Proto=https 且 N8N_PROXY_HOPS=1；session cookie
      # 必須維持 Secure，避免使用者先碰 http:80 時在 redirect 前洩出。
      N8N_SECURE_COOKIE: "true"
      # n8n 2.x 官方 instance-settings loader：首次啟動與每次重啟都用
      # env-managed owner 收斂帳號，避免 fresh volume 的 first-visitor takeover。
      # PASSWORD_HASH 必須是完整 bcrypt 字串；.env 請以單引號包住 $ 字元。
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?N8N_OWNER_EMAIL must be set}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-ANILA}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-Owner}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH:?N8N_OWNER_PASSWORD_HASH must be a bcrypt hash}
      # n8n 2.x instance MCP is a separate machine-ingress surface from
      # workflow MCP triggers. Lock both config state and reverse-proxy path.
      N8N_MCP_MANAGED_BY_ENV: "true"
      N8N_MCP_ACCESS_ENABLED: "false"
      # 不把 credential encryption key 留給容器首次啟動隨機產生；重建時必須
      # 使用同一把正式 key，否則既有 n8n credentials 無法解密。
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      NODE_FUNCTION_ALLOW_EXTERNAL: "${N8N_NODE_FUNCTION_ALLOW_EXTERNAL:-axios,lodash,dayjs}"
      NODE_FUNCTION_ALLOW_BUILTIN: "${N8N_NODE_FUNCTION_ALLOW_BUILTIN:-crypto,url}"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-tools
    expose:
      - "5678"
    healthcheck:
      # /healthz 在引擎 root,不受 N8N_PATH 影響。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  # ── GitLab CE (retained intranet service) ───────────────────────────────
  # 獨立來源 https://gitlab.ai.ncsist.org.tw/；內建 nginx disable，外層 ANILA
  # nginx 接 Workhorse 8181。Web/API/smart HTTP 均由 GitLab 原生帳號、PAT、
  # runner token 驗證，不得把 CSP session cookie 或 auth_request 帶進此 origin。
  # 首次開機 reconfigure ~5-10 分鐘,start_period 600s 是必要的。
  # Initial root password 在容器內 /etc/gitlab/initial_root_password,首次登入要輪換。
  gitlab:
    # W1-8:同 n8n,預設不啟動(理由見 n8n 處註解)。
    profiles: ["developer-tools"]
    image: ${ANILA_IMAGE_GITLAB:?ANILA_IMAGE_GITLAB must be a locked image content ID}
    hostname: ${GITLAB_HOST:-gitlab.ai.ncsist.org.tw}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOST:-gitlab.ai.ncsist.org.tw}'
        nginx['enable'] = false
        gitlab_workhorse['listen_network'] = "tcp"
        gitlab_workhorse['listen_addr'] = "0.0.0.0:8181"
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
        gitlab_rails['time_zone'] = 'Asia/Taipei'
        # 內網部署 — admin 發帳號,不開 self sign-up。
        gitlab_rails['gitlab_signup_enabled'] = false
        # 省記憶體 — Prometheus + Alertmanager 不啟用。
        prometheus['enable'] = false
        alertmanager['enable'] = false
        # 初始 root 密碼從 GITLAB_ROOT_PASSWORD env 帶入(密碼不寫死在 compose;
        # 由 .env / bundle 的 intranet-defaults.env 提供)。只在首次 reconfigure 生效。
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD'] if (ENV['GITLAB_ROOT_PASSWORD'] || '') != ''
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?GITLAB_ROOT_PASSWORD must be set}
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - gitlab-tools
    # GitLab's isolated origin owns browser, HTTPS/LFS/API, PAT and SSH auth;
    # ANILA card-session cookies are deliberately not shared with this host.
    # Git CLI SSH uses GitLab Shell on an explicitly selected intranet interface;
    # host firewall must restrict this port to approved developer subnets.
    ports:
      - "${GITLAB_SSH_BIND_IP:?GITLAB_SSH_BIND_IP must name the intranet interface}:${GITLAB_SSH_PORT:-2222}:22"
    expose:
      - "8181"   # Workhorse for ANILA nginx
      - "22"     # SSH for git push/pull; host port above is LAN-IP-bound
    shm_size: 256m
    healthcheck:
      # /-/health 預設只開 127/8 的 monitoring_whitelist,從外部 monitor 看不到。
      # /users/sign_in 不需 auth,Puma 起來就 200,正好當 readiness probe。
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8181/users/sign_in || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

networks:
  default:
    name: anila-net
  # 跟 infra/models/docker-compose.yml 共用。external → 兩個 project 任一個 down
  # 都不會刪掉它。bootstrap 只能透過 shared helper:
  #   bash infra/deployment/scripts/ensure-models-network.sh ensure
  anila-models-net:
    external: true
    name: anila-models-net
  # Each active developer tool gets its own bridge. nginx is the only dual-home
  # service, so compromised tools cannot call another tool's Docker DNS name.
  n8n-tools:
    name: anila-n8n-tools-net
  gitlab-tools:
    name: anila-gitlab-tools-net
  codeserver-tools:
    name: anila-codeserver-tools-net

volumes:
  csp-pgdata:
  redis-data:
  csp-attachments:
  anila-studio-flux-cache:
  anila-studio-artifacts:
  # Official Agent durable FileTaskStore/SQLite session state.  Never bind
  # mount a repository path: restart recovery depends on this named volume.
  anila-agent-state:
  router-state:
  # 工具資料 volume：n8n/GitLab 為保留的預設內網服務；code-server profile
  # 按需啟用。名稱固定以確保重建容器時沿用既有資料。
  codeserver_config:
  n8n_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
