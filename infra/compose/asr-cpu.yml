# ── ASR 的 CPU 覆蓋檔(給「沒有 GPU 直通」的主機)─────────────────────────
#
# ⚠ 2026-08-05 更新:GPU 保留**已經不在 platform.yml 裡了**,搬到
# `infra/compose/asr-gpu.yml` —— 平台要搬到沒有 GPU 的 CPU 主機(2× EPYC 9334),
# 寫死的 nvidia 保留會讓**整批** up 失敗,連不碰語音的服務都起不來。
# 所以本檔的 `deploy: !reset null` 現在只在「同時疊了 asr-gpu.yml」時才有作用;
# 留著是為了那種情況,以及既有的 COMPOSE_FILE 設定。
#
# 這個檔真正還在做事的是下面的 environment:CPU + 小模型,讓沒有 GPU 直通的
# 機器仍然可以真的把麥克風按下去。**這是權宜之計,不是內網 .15 的目標組態。**
#
# (歷史:原本硬性要求 GPU 是刻意的 —— 沒有 nvidia container runtime 的機器
#  `up` 會直接以 could not select device driver "nvidia" 失敗,而不是悄悄退回
#  CPU 跑 large-v3 得到 RTF>1 的「能用但難用到沒人想用」。
#
#  ⚠ 訂正:那個 fail-loud **不是「一字未改」,是換了地方也換了樣子**。疊了
#  asr-gpu.yml 才會回到「`up` 當場失敗、訊息就寫在螢幕上」;**兩個覆蓋檔都
#  沒疊**時 ASR_DEVICE 仍預設 cuda,於是 asr-decoder 起得來、載模型時才死,
#  進入重啟迴圈,而 asr-gateway 卡在 `depends_on: service_healthy` 最多
#  20 × 30s ≈ 10 分鐘才放棄 —— 一樣會壞,但慢十分鐘、訊息還藏在 decoder 的
#  日誌裡。本檔把 ASR_DEVICE 明確設成 cpu,正是為了不落進那個狀態。)
#
# 用法(注意 -f 的順序,後者覆蓋前者):
#   docker compose -p anila-restart \
#     -f compose.yaml -f infra/compose/asr-cpu.yml \
#     --profile asr up -d --no-recreate asr-decoder asr-gateway
#
# 要讓它變成常駐設定(這樣裸跑 `docker compose up -d` 也會帶上),在 .env 加:
#   COMPOSE_FILE=compose.yaml:infra/compose/asr-cpu.yml
# ⚠ 加了之後**所有人**在這個 repo 跑 docker compose 都會吃到這個覆蓋檔。
#   多人/多 agent 同時在同一棵樹上工作時,先講一聲再加。
#
# 本開發機 2026-07-31 實測(24 核,ffmpeg flite 合成的 4.69s 英文語句):
#   模型      partial(beam=1)      final(beam=5)        判定
#   small     1.22s / RTF 0.26     1.81s / RTF 0.39     可用
#   medium    3.26s / RTF 0.69     4.03s / RTF 0.86     勉強,尖峰會塞
#   large-v3  5.35s / RTF 1.14     6.81s / RTF 1.45     不可用(比說話還慢)
# 所以 CPU 預設落在 small。⚠ 代價:small 的繁中正確率明顯不如 large-v3,
# 專有名詞與數字最容易錯。內網 .15 上線前務必把 GPU 直通弄好、回到 large-v3。

services:
  asr-decoder:
    # !reset 整個 deploy —— 這裡面唯一的內容就是 GPU reservation。
    # (需要 Compose v2.24+;本機實測 v2.36.2 可用。)
    deploy: !reset null
    environment:
      ASR_DEVICE: cpu
      # CPU 上 int8 是唯一划算的選擇:float16 在 CPU 沒有硬體支援,
      # CTranslate2 會退回 float32,慢一大截。
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-small}
      # 0 = 交給 CTranslate2 自己決定。要跟平台其他服務搶 CPU 時才調小。
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-0}
