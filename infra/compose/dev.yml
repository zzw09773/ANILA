# ANILA Platform — DEV stack for the feature/no-sso branch.
#
# 跟 platform.yml 完全隔離（不同 project / network / 容器名 / port / volume），
# 因為 production stack `anila` 還在外網被同事用，啟動 dev 不能撞它。
#
# 用法（repo 根,經 root shim,root .env 才會被載入）：
#   docker compose -f compose.dev.yaml up -d --build
#
# 對比 live stack：
#   ─────────────────────────────────────────────────────────
#   Live (anila)                      Dev (anila-platform-dev)
#   ─────────────────────────────────────────────────────────
#   nginx :80 / :443 / :4443          nginx :8080 / :8443 / :9443
#   csp-db 5433 (loopback)            csp-db 5533 (loopback)
#   csp-pgdata (volume)               csp-pgdata-dev
#   redis-data (volume)               redis-data-dev
#   ./share/uploads/                  ./share-dev/uploads/
#   network anila-net                 network anila-dev-net
#   container anila-nginx             container anila-nginx-dev
#   ─────────────────────────────────────────────────────────
#
# 模型在遠端，由治理中心登記。這份 compose 不加入模型網路。

# 刻意沿用舊名：改名會讓 dev 接上一組新的空 volume，舊 dev 資料留在原處。
name: anila-platform-dev

# ── 容器日誌上限（P3.5）────────────────────────────────────────────────
# 單一宣告點：各 service 用 logging: *anila-logging，不要在個別服務改數字。
# 50m × 7 檔 = 每服務 ≤350MB；約 14 服務全棧天花板 ≈4.9GB。
# 給一人維運留約一週診斷窗；json-file 讓 docker logs 事故後仍可撈。
# 既有容器要 recreate 後才生效（docker compose up -d）；單純 restart 不夠。
x-logging: &anila-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "7"

services:

  # ── PostgreSQL (dev volume, dev port) ───────────────────────────────────
  csp-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: csp
      POSTGRES_PASSWORD: csp
      POSTGRES_DB: csp
    ports:
      - "127.0.0.1:5533:5432"
    volumes:
      - csp-pgdata-dev:/var/lib/postgresql/data
      - ../../infra/docker/postgres-memconf.sh:/usr/local/bin/postgres-memconf.sh:ro
    # 與 platform.yml 同一支啟動腳本、同一個 shm。
    shm_size: 8gb
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-memconf.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csp -d csp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *anila-logging

  pgbouncer:
    build:
      context: ../..
      dockerfile: infra/docker/pgbouncer.Dockerfile
    environment:
      PGBOUNCER_USER: csp_app
      PGBOUNCER_PASSWORD: csp
      PGBOUNCER_DB: csp
      PGBOUNCER_HOST: csp-db
    expose:
      - "5432"
    depends_on:
      csp-db:
        condition: service_healthy
        # csp-db 被 compose 重啟或重建時跟著重啟，否則池裡的舊連線第一次用會斷，
        # CSP 啟動檢查就會失敗一次。需要 Compose 2.17 以上。
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *anila-logging

  csp-credential-dirs:
    build:
      context: ../..
      dockerfile: infra/docker/csp.Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/csp-credential-dirs.sh"]
    volumes:
      - anila-service-credentials-dev:/run/anila/service-clients
    restart: "no"
    labels:
      anila.oneshot: "true"

  # ── CSP (Control + Data Plane :8000) ────────────────────────────────────
  csp:
    build:
      context: ../..
      dockerfile: infra/docker/csp.Dockerfile
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://csp_app:csp@pgbouncer:5432/csp
      MIGRATION_DATABASE_URL: postgresql://csp:csp@csp-db:5432/csp
      REDIS_URL: redis://redis:6379/0
      # Keep the CSP and worker path in one compose-controlled source.
      UPLOAD_DIR: "${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
      # Dev 寫死 "1"，不經 ${} 展開——避免被 .env 裡的 ANILA_ALLOW_DEV_SECRET=0
      # 鎖死。startup_security 在 dev 模式下只 log warning 不擋。
      ANILA_ALLOW_DEV_SECRET: "1"
      # 啟動時拒絕自動 alembic upgrade。預設 0＝仍遷移。沒有這一行,.env 寫了到不了容器。
      ANILA_SKIP_STARTUP_MIGRATIONS: "${ANILA_SKIP_STARTUP_MIGRATIONS:-0}"
      # 憑證到期偵測的 SNI。與本檔 nginx 同一行。
      ANILA_HOST: ${ANILA_HOST:-localhost}
      # Dev-only relax (S-117 URL guard): dev runs every model/agent on
      # docker-internal http endpoints (e.g. http://gemma4:8000), so
      # register + health-check would otherwise fail "scheme must be https".
      # Hardcoded "1" overrides .env (which keeps 0); prod compose still reads
      # .env=0 → stays strict (https + no private).
      ANILA_ALLOW_HTTP_ENDPOINT: "1"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "1"
      # 同理:dev 的 Triton embedder 走 cleartext grpc://（內網 9001 沒有 TLS），
      # 不放行就連本機都註冊不了 protocol=triton_grpc 的模型。
      ANILA_ALLOW_GRPC_ENDPOINT: "1"
      # 單標籤 docker 服務名要列在這裡才過得了 URL guard。
      ANILA_TRUSTED_HOSTS: "docling,router,loadtest-model"
      # 本機開發的跨來源。正式檔的預設是空清單（同源）。
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3001,http://localhost:80,http://localhost,https://localhost,https://localhost:4443"
      ANILA_AUTH_MODE: "${ANILA_AUTH_MODE:-password}"
      # 內部服務憑證。與 platform.yml 同一路徑；volume 名稱分開，避免跟 live stack 混用。
      # 10002 是共用目錄（router）。studio 10003、worker 10004 寫在內建名單。
      ANILA_SERVICE_CLIENT_DIR: /run/anila/service-clients
      ANILA_SERVICE_CLIENT_FILE_GID: "10002"
      # 模型與 agent 只在治理中心登錄。
      # Dev 用獨立 seed key，跟 prod sk-test-user-api-key 區隔開。
      AUTO_SEED_API_KEYS: >-
        [{"username":"smoke-user","email":"smoke-user@example.com","role":"user","key":"${SMOKE_USER_API_KEY_DEV:-sk-test-dev-user-api-key}","key_name":"smoke-user-dev-key","models":[],"agents":[]}]
      DOCLING_OCR_LANGS: "${DOCLING_OCR_LANGS:-ch_tra,en}"
      DOCLING_TIMEOUT_SECONDS: "${DOCLING_TIMEOUT_SECONDS:-120}"
      DOCLING_CONNECT_TIMEOUT_SECONDS: "${DOCLING_CONNECT_TIMEOUT_SECONDS:-5}"
      # 與 platform.yml 相同：掛目錄，不把缺席的 profile.json 做成目錄。
      # dev 用 share-dev，不撞 live stack 的 share/quickstart。
      ANILA_QUICKSTART_PROFILE: /app/anila-quickstart-profile/profile.json
    volumes:
      - ../../packages/anila-agent:/app/anila-template:ro
      - ../../packages/anila-agent-quickstart:/app/anila-quickstart:ro
      - "${ANILA_QUICKSTART_PROFILE_DIR:-../../share-dev/quickstart}:/app/anila-quickstart-profile:ro"
      # ⚠️ dev 用獨立 share 目錄，不撞 live stack 的 ./share/
      #
      # ⚠️ csp 自 2026-08-06 起以 uid 10001 跑（FAKE-CONTROLS #50）。這兩個目錄
      # 不在樹上，**第一次 `up` 由 Docker 建成 root:root** → 上傳會回 500 而容器
      # 照樣 healthy。prod 那條路徑由 infra/deployment/scripts/fix-runtime-ownership.sh
      # 處理，dev 刻意不接腳本（dev 沒有部署腳本可掛）。第一次起 dev stack 前手動跑一次：
      #   docker run --rm -u 0 -v "$PWD/share-dev:/s" alpine chown -R 10001:10001 /s
      # 冪等，重跑無害。（ingestion-worker 掛同一個 uploads 目錄，一起修好。）
      #
      # ⚠️ 同日起 csp 映像不再內含 JWT keypair——以前 dev 能簽 token 是因為
      # build context 把 services/csp/secrets/ 的測試鑰污染進映像（.dockerignore
      # 只擋根層），2026-08-06 已整類關掉。dev 的 csp 現在會在啟動時大聲失敗
      # （JwtKeyLoadError），這是正確行為。自救：自備 dev 專用 keypair 目錄再掛
      # `<dir>:/app/secrets:ro`。**不要**直接掛 live 的 ../../secrets——兩個 stack
      # 共用簽章鑰＝dev 簽的 token 在 live 也有效。
      - "../../share-dev/uploads/ingestion:${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      - ../../share-dev/attachments:/app/data/attachments
      - anila-service-credentials-dev:/run/anila/service-clients
      # 外部服務憑證的金鑰只在 CSP。dev 用另一個 volume，不跟 live stack 共用。
      - anila-csp-local-secrets-dev:/var/anila/csp-local-secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      csp-credential-dirs:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    logging: *anila-logging

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb"]
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *anila-logging

  # ── ingestion-worker ────────────────────────────────────────────────────
  ingestion-worker:
    build:
      context: ../..
      dockerfile: services/ingestion-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://csp_app:csp@pgbouncer:5432/csp
      REDIS_URL: redis://redis:6379
      EMBEDDING_BASE_URL: http://csp:8000/v1
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/ingestion-worker/token
      CSP_BASE_URL: http://csp:8000
      EMBEDDING_DIM: "4000"
      UPLOAD_DIR: "${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      # Keep certificate verification enabled; this is only the optional CA
      # bundle path for internal HTTPS VLM/OCR endpoints.
      SSL_CERT_FILE: ${ANILA_MODEL_CA_FILE-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
      ANILA_ALLOW_DEV_SECRET: "1"
      # Dev-only relax (S-117 URL guard): dev runs every model/agent on
      # docker-internal http endpoints (e.g. http://gemma4:8000), so
      # register + health-check would otherwise fail "scheme must be https".
      # Hardcoded "1" overrides .env (which keeps 0); prod compose still reads
      # .env=0 → stays strict (https + no private).
      ANILA_ALLOW_HTTP_ENDPOINT: "1"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "1"
      ENABLE_IMAGE_CAPTIONS: "${ENABLE_IMAGE_CAPTIONS:-true}"
      VISION_URL: "${VISION_URL:-http://csp:8000/v1}"
      VISION_CONCURRENCY: "${VISION_CONCURRENCY:-4}"
      VISION_TIMEOUT_SECONDS: "${VISION_TIMEOUT_SECONDS:-60}"
      # LLM relation extraction (document-relations Phase 2 / B). Goes through
      # the CSP /v1 proxy → Router → gemma4, metered via the worker system key.
      ENABLE_RELATION_LLM: "${ENABLE_RELATION_LLM:-true}"
      RELATION_LLM_URL: "${RELATION_LLM_URL:-http://csp:8000/v1}"
      RELATION_LLM_VERIFY_SSL: "${RELATION_LLM_VERIFY_SSL:-true}"
      RELATION_LLM_TIMEOUT_SECONDS: "${RELATION_LLM_TIMEOUT_SECONDS:-120}"
      DOCLING_OCR_LANGS: "${DOCLING_OCR_LANGS:-ch_tra,en}"
      DOCLING_TIMEOUT_SECONDS: "${DOCLING_TIMEOUT_SECONDS:-120}"
      DOCLING_CONNECT_TIMEOUT_SECONDS: "${DOCLING_CONNECT_TIMEOUT_SECONDS:-5}"
      ANILA_TRUSTED_HOSTS: "docling"
      # Embedding topic-similarity edges (document-relations / C). Uses the
      # existing document_chunks vectors — no extra model call.
      ENABLE_SIMILARITY_EDGES: "${ENABLE_SIMILARITY_EDGES:-true}"
      SIMILARITY_TOP_K: "${SIMILARITY_TOP_K:-3}"
      SIMILARITY_MIN: "${SIMILARITY_MIN:-0.75}"
      PYTHONUNBUFFERED: "1"
    volumes:
      # ⚠️ 跟 csp 同一顆 inode，也同樣以 uid 10001 跑。第一次 `up` 之前的
      # 一次性 chown 見上面 csp 服務那段註解（同一條命令一起修好兩邊）。
      - "../../share-dev/uploads/ingestion:${UPLOAD_DIR:-/var/anila/ingestion-uploads}"
      - ../../share-dev/pki:/etc/anila/pki:ro
      - anila-service-credentials-dev:/run/anila/service-clients:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      csp:
        condition: service_healthy
    restart: unless-stopped
    logging: *anila-logging

  # ── Router ──────────────────────────────────────────────────────────────
  router:
    build:
      context: ../..
      dockerfile: services/anila-core-router/Dockerfile
    expose:
      - "9000"
    environment:
      CSP_BASE_URL: http://csp:8000
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/router-primary/token
      ANILA_SESSION_DB_PATH: /app/.anila/sessions.db
      # 主路由模型由治理中心的 router_primary 決定，不在這裡寫模型名。
    volumes:
      - anila-service-credentials-dev:/run/anila/service-clients:ro
      - router-sessions-dev:/app/.anila
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    logging: *anila-logging

  # ── pptx-renderer ───────────────────────────────────────────────────────
  pptx-renderer:
    build:
      context: ../../services/pptx-renderer
      dockerfile: Dockerfile
    expose:
      - "7100"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging

  # ── anila-studio (Studio extraction Phase 2 skeleton) ───────────────────
  # The deck generation service (RAG + PPTX) extracted out of
  # csp. Reads JWKS + token revocation events from csp via HTTP/Redis so
  # cross-service auth works without sharing private keys.
  anila-studio:
    build:
      context: ../../services/anila-studio
      dockerfile: Dockerfile
    expose:
      - "8100"
    environment:
      CSP_BASE_URL: http://csp:8000
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/anila-studio/token
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      # 簡報配圖走治理中心的生圖角色，經 CSP 代理。
      # report / mindmap / infographic / datatable 4 種 artifact 的持久化目錄。
      # 每個 job 落地 {job_id}.{html,pdf,docx,svg,csv,xlsx}, 24h 後 prune。
      ARTIFACTS_DIR: /var/anila/anila-studio-artifacts
      RENDERER_BASE_URL: http://pptx-renderer:7100
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
      redis:
        condition: service_healthy
      pptx-renderer:
        condition: service_healthy
    volumes:
      - anila-studio-artifacts-dev:/var/anila/anila-studio-artifacts
      - anila-service-credentials-dev:/run/anila/service-clients:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging

  # ── ASR gateway (串流語音輸入;dev / 帳密測試環境)──────────────────────
  # 對應 platform.yml 的 asr-gateway,但走 dev 慣例:直接 build、dev 預設 env、
  # ANILA_AUTH_MODE=password(帳密登入,不用卡)。
  asr-gateway:
    build:
      # context = repo 根目錄:Dockerfile 要複製 packages/anila-core 的 SSRF
      # guard 進來(同 platform.yml)。
      context: ../..
      dockerfile: services/asr-gateway/Dockerfile
    expose:
      - "8200"
    environment:
      ANILA_SERVICE_TOKEN_FILE: /run/anila/service-clients/asr-gateway/token
      ANILA_ALLOW_HTTP_ENDPOINT: "1"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "1"
      ANILA_TRUSTED_HOSTS: ""
      ASR_PROBE_TIMEOUT_SECONDS: ${ASR_PROBE_TIMEOUT_SECONDS:-8}
      ASR_PROBE_CONNECT_TIMEOUT_SECONDS: ${ASR_PROBE_CONNECT_TIMEOUT_SECONDS:-3}
      ASR_INITIAL_PROMPT: ${ASR_INITIAL_PROMPT:-以下是繁體中文。}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-5}
      ASR_PARTIALS_ENABLED: ${ASR_PARTIALS_ENABLED:-1}
      ASR_OPENCC_MODE: ${ASR_OPENCC_MODE:-off}
      ASR_MAX_SESSION_SECONDS: ${ASR_MAX_SESSION_SECONDS:-300}
      CSP_BASE_URL: http://csp:8000
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      JWT_LEEWAY_SECONDS: "60"
      REVOCATION_RECONCILE_INTERVAL_SECONDS: "5"
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - anila-service-credentials-dev:/run/anila/service-clients:ro
    healthcheck:
      # 有回應就算活著,撤銷清單沒就緒除外;同 platform.yml。
      test: ["CMD-SHELL", "b=$$(curl -s -m 10 http://localhost:8200/asr/health) && [ -n \"$$b\" ] && ! printf '%s' \"$$b\" | grep -q revocation_not_ready"]
      interval: 15s
      timeout: 12s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *anila-logging

  # ── ANILA LM (no-SSO 版本，從 feature/no-sso branch build) ───────────────
  anilalm:
    build:
      context: ../../apps/anilalm
      args:
        BASE_PATH: ${ANILALM_BASE_PATH:-/anilalm/}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *anila-logging

  # ── ANILA UI (admin SPA) ────────────────────────────────────────────────
  anila-ui:
    build:
      context: ../../apps/anila-shell
      args:
        VITE_CSP_BASE_URL: ${ANILA_PUBLIC_CSP_BASE_URL-}
        VITE_ROUTER_BASE_URL: ${ANILA_PUBLIC_ROUTER_BASE_URL:-/router}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *anila-logging

  # ── nginx (dev 入口，獨立 port + 獨立 container_name) ───────────────────
  nginx:
    # 與 platform 同一份 Dockerfile（libuuid 修補），不是官方 stock image。
    build:
      context: ../..
      dockerfile: infra/docker/nginx.Dockerfile
    # ⚠️ 必須顯式不同名——compose 對 container_name 不會自動加 project prefix。
    container_name: anila-nginx-dev
    ports:
      - "${NGINX_HTTP_PORT_DEV:-8080}:80"
      - "${NGINX_HTTPS_PORT_DEV:-8443}:443"
      - "${ANILA_UI_HTTPS_PORT_DEV:-9443}:4443"
    environment:
      ANILA_HOST: ${ANILA_HOST:-localhost}
      # 對外 HTTPS 是宿主的 NGINX_HTTPS_PORT_DEV（預設 8443），不是容器內的 443。
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT_DEV:-8443}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/anila.conf:/etc/nginx/templates/default.conf.template:ro
      - ../../infra/nginx/certs:/etc/nginx/certs:ro
      - ../../share-dev/static:/usr/share/nginx/share-files/static:ro
      - ../../share-dev/uploads:/usr/share/nginx/share-files/uploads:rw
    depends_on:
      csp:
        condition: service_healthy
        restart: true
      anilalm:
        condition: service_healthy
        restart: true
      router:
        condition: service_healthy
        restart: true
      anila-ui:
        condition: service_healthy
        restart: true
    # Same posture as platform.yml: probe CSP via loopback :8080 /health
    # (anila.conf), not `nginx -t` syntax-only.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *anila-logging

networks:
  # ⚠️ 不同名才不會跟 live stack 的 anila-net 衝突。
  default:
    name: anila-dev-net

volumes:
  anila-service-credentials-dev:
  anila-csp-local-secrets-dev:
  csp-pgdata-dev:
  redis-data-dev:
  router-sessions-dev:
  anila-studio-artifacts-dev:
