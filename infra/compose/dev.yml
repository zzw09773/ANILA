# ANILA Platform — DEV stack for the feature/no-sso branch.
#
# 跟 platform.yml 完全隔離（不同 project / network / 容器名 / port / volume），
# 因為 production stack `anila-platform` 還在外網被同事用，啟動 dev 不能撞它。
#
# 用法（repo 根,經 root shim,root .env 才會被載入）：
#   docker compose -f compose.dev.yaml up -d --build
#
# 對比 live stack：
#   ─────────────────────────────────────────────────────────
#   Live (anila-platform)             Dev (anila-platform-dev)
#   ─────────────────────────────────────────────────────────
#   nginx :80 / :443 / :4443          nginx :8080 / :8443 / :9443
#   csp-db 5433 (loopback)            csp-db 5533 (loopback)
#   csp-pgdata (volume)               csp-pgdata-dev
#   redis-data (volume)               redis-data-dev
#   ./share/uploads/                  ./share-dev/uploads/
#   network anila-net                 network anila-dev-net
#   container anila-nginx             container anila-nginx-dev
#   ─────────────────────────────────────────────────────────
#
# 共用：anila-models-net (external) — 兩 stack 都要打 gemma4 / gpt-oss-20b /
# nv-embed-proxy，這條 external network 同時 attach 不會破壞 live。

name: anila-platform-dev

services:

  # ── PostgreSQL (dev volume, dev port) ───────────────────────────────────
  csp-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: csp
      POSTGRES_PASSWORD: csp
      POSTGRES_DB: csp
    ports:
      - "127.0.0.1:5533:5432"
    volumes:
      - csp-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csp -d csp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── CSP (Control + Data Plane :8000) ────────────────────────────────────
  csp:
    build:
      context: ../..
      dockerfile: infra/docker/csp.Dockerfile
      # 2026-07-24 freeze: event loop stuck with process still alive; bake
      # py-spy into the dev image so the next freeze can dump stacks immediately.
      # Prod builds leave INSTALL_DEBUG_TOOLS at default 0 (no debug tools).
      args:
        INSTALL_DEBUG_TOOLS: "1"
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://csp_app:csp@csp-db:5432/csp
      MIGRATION_DATABASE_URL: postgresql://csp:csp@csp-db:5432/csp
      EMBEDDING_MODEL_FINGERPRINT: ${EMBEDDING_MODEL_FINGERPRINT_DEV:?EMBEDDING_MODEL_FINGERPRINT_DEV must be sha256:<64 lowercase hex> for deployed dev embedding weights}
      # 部署的 embedding 模型原生輸出維度。未設 = 嚴格模式,只接受 4000 或
      # NV-Embed 原生的 4096。跑較小維度的模型(例如 nemotron-3-embed-1b 的
      # 2048)必須顯式設定,其向量才會被補零到 halfvec(4000)。
      #
      # 為什麼不是無條件接受任何短向量:端點若悄悄換成別的模型(例如 1536 維),
      # 無條件補零會讓語意無意義的向量進索引且無聲摧毀檢索品質,而 collection
      # 的 embedding_fingerprint 守的是**宣告**的模型身分,抓不到端點漂移。
      ANILA_EMBED_SOURCE_DIM: ${ANILA_EMBED_SOURCE_DIM_DEV:-}
      SECRET_KEY: ${CSP_SECRET_KEY:-dev-secret-key-change-in-prod}
      # Dev 寫死 "1"，不經 ${} 展開——避免被 .env 裡的 ANILA_ALLOW_DEV_SECRET=0
      # 鎖死。startup_security 在 dev 模式下只 log warning 不擋。
      ANILA_ALLOW_DEV_SECRET: "1"
      # Dev auto-keygen writes only to a dedicated named volume. Never bake or
      # generate reusable signing material under services/csp/secrets.
      ALLOW_AUTO_KEYGEN: "true"
      # 讓 .env 的 ADMIN_PASSWORD 進得了 csp;沒設就沿用 config.py 預設 changeme。
      # ⚠ 密碼是 admin-sticky:只在第一次 seed(全新 DB)生效,既有 admin 不會被改。
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      # This stack is still served through nginx HTTPS (default :8443/:9443;
      # LAN overrides may use :443/:4443), so it exercises the same __Host-
      # cookie contract as production.
      COOKIE_SECURE: "true"
      # Dev keeps Swagger /docs + /openapi.json on (prod default off, S-117).
      ENABLE_API_DOCS: "true"
      # Explicit development opt-ins; the formal profile defaults both off.
      ENABLE_PUBLIC_SHARE: "${ENABLE_PUBLIC_SHARE:-true}"
      ENABLE_MEMORY: "${ENABLE_MEMORY:-true}"
      # LAN/dev defaults to password login. Card routes are opt-in only.
      ENABLE_CARD_LOGIN: "${ENABLE_CARD_LOGIN:-false}"
      REQUIRE_CARD_LOGIN_ONLY: "${REQUIRE_CARD_LOGIN_ONLY:-false}"
      CARD_CRL_REQUIRED: "false"
      CARD_CRL_SOURCE: "development-disabled"
      JWT_ISSUER: "https://anila.internal/csp"
      JWT_AUDIENCE: "anila-platform"
      JWT_LEEWAY_SECONDS: "60"
      PUBLIC_SHARE_MAX_TTL_HOURS: "${PUBLIC_SHARE_MAX_TTL_HOURS:-168}"
      SITE_URL: "${SITE_URL:-https://localhost:8443}"
      # Dev-only relax (S-117 URL guard): dev runs every model/agent on
      # docker-internal http endpoints (e.g. http://flux2-dev-agent:8000), so
      # register + health-check would otherwise fail "scheme must be https".
      # Hardcoded "1" overrides .env (which keeps 0); prod compose still reads
      # .env=0 → stays strict (https + no private).
      ANILA_ALLOW_HTTP_ENDPOINT: "1"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "1"
      # flux2-dev-agent added: the image-generator agent + image model use this
      # docker service name (single-label), which the URL guard blocks unless
      # trusted (ALLOW_PRIVATE does NOT bypass the single-label check).
      ANILA_TRUSTED_HOSTS: "${ANILA_TRUSTED_HOSTS:-gpt-oss-20b,gemma4,nv-embed-proxy,flux2-dev-agent,anila-agent,gate5-e2e-model,router,host.docker.internal}"
      # Router sentinel chat model (auto-seeded, non-secret) — single-label
      # docker service name, so it must also be trusted above.
      ANILA_ROUTER_SENTINEL_URL: "${ANILA_ROUTER_SENTINEL_URL:-http://router:9000}"
      # 稽核 IP 溯源:信任 dev nginx 的 X-Forwarded-For(填 nginx 容器 IP/32,
      # 容器重建後 IP 可能漂,漂了要更新;空值=記 proxy IP)。
      ANILA_TRUSTED_PROXY_CIDRS: "${ANILA_TRUSTED_PROXY_CIDRS:-}"
      ANILA_AUDIT_STRICT: "${ANILA_AUDIT_STRICT:-0}"
      # 外部 gateway 個別模型收到 stream_options 會掛死(如 NVIDIA 的
      # z-ai/glm-5.2);dev 測外部 API 時可設 0 關閉 usage 注入。
      ANILA_STREAM_INCLUDE_USAGE: "${ANILA_STREAM_INCLUDE_USAGE:-1}"
      ANILA_DEPLOYMENT_PROFILE: "${ANILA_DEPLOYMENT_PROFILE_DEV:-development}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-30}"
      # Dev-only: short multi-tab refresh race cushion. Formal/platform compose
      # defaults to 0; do not copy this non-zero value into production profiles.
      ANILA_REFRESH_REUSE_GRACE_SECONDS: "${ANILA_REFRESH_REUSE_GRACE_SECONDS:-10}"
      # LLM proxy upstream timeout — Studio deck 生成的 prompt 可達 10K+
      # tokens,gemma4 處理 wall-clock 達 240s 級。default 120 太緊 → csp
      # 自己 mid-stream timeout 把連線關掉 → anila-studio 觀察到 ReadTimeout。
      LLM_TIMEOUT: "${LLM_TIMEOUT:-300}"
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:-dev-service-token}
      STUDIO_ARTIFACT_SERVICE_TOKEN: ${STUDIO_ARTIFACT_SERVICE_TOKEN:-csk-dev-studio-artifact}
      STUDIO_RUNTIME_SERVICE_TOKEN: ${STUDIO_RUNTIME_SERVICE_TOKEN:-csk-dev-studio-runtime}
      STUDIO_JOB_ENVELOPE_HMAC_KEY: ${STUDIO_JOB_ENVELOPE_HMAC_KEY:-dev-studio-job-envelope-hmac-key-change-me}
      INGESTION_QUEUE_HMAC_KEY: ${INGESTION_QUEUE_HMAC_KEY:-dev-ingestion-queue-hmac-key-change-me}
      STUDIO_DURABLE_SUPERVISOR: "true"
      STUDIO_ARTIFACT_REPORTING: "true"
      AUTO_REGISTER_MODELS: >-
        [{"name":"${LOCAL_LLM_MODEL:-gpt-oss-20b}","display_name":"${LOCAL_LLM_MODEL:-gpt-oss-20b}","model_type":"llm","endpoint_url":"${LOCAL_LLM_BASE_URL:-http://gpt-oss-20b:8000}","api_version":"v1","description":"On-prem local LLM (anila-models-net)"},{"name":"gemma4","display_name":"gemma4","model_type":"llm","endpoint_url":"http://gemma4:8000","api_version":"v1","description":"On-prem gemma4 vLLM (anila-models-net) — Router primary"},{"name":"${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}","display_name":"${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}","model_type":"embedding","endpoint_url":"${LOCAL_EMBEDDING_BASE_URL:-http://nv-embed-proxy:8000}","api_version":"v1","description":"On-prem NV-embed-V2 via FastAPI shim (anila-models-net)"},{"name":"image-generator","display_name":"圖像繪製","model_type":"agent","endpoint_url":"http://flux2-dev-agent:8000","api_version":"v1","description":"FLUX.2-dev image generation agent","description_for_router":"當使用者要求繪製、產生、設計、畫一張、給我一張圖、視覺化、想看看 XX 的樣子、想要看一張圖等等的時候使用。輸入是使用者的中文自然語言描述,不需要先翻譯,agent 內部會處理。"}]
      # Phase G：agents 表的 declarative 來源(不同於 model_registry,後者是 catalog;
      # agents 表才是 Router /v1/agents 與 DISPATCH 路徑會 join 的權限源)。
      AUTO_REGISTER_AGENTS: >-
        [{"name":"image-generator","endpoint_url":"http://flux2-dev-agent:8000","api_version":"v1","description_for_router":"當使用者要求繪製、產生、設計、畫一張、給我一張圖、視覺化、想看看 XX 的樣子、想要看一張圖等等的時候使用。輸入是使用者的中文自然語言描述,不需要先翻譯,agent 內部會處理。","health_status":"healthy","approval_status":"approved"}]
      # Dev 用獨立 seed key，跟 prod sk-test-user-api-key 區隔開——避免你拿 dev key
      # 不小心打到 prod CSP，或反過來。
      AUTO_SEED_API_KEYS: >-
        [{"username":"smoke-user","email":"smoke-user@example.com","role":"user","key":"${SMOKE_USER_API_KEY_DEV:-sk-test-dev-user-api-key}","key_name":"smoke-user-dev-key","models":["${LOCAL_LLM_MODEL:-gpt-oss-20b}","gemma4"],"agents":["image-generator"]},
         {"username":"ingestion-worker","email":"ingestion-worker@anila.local","role":"system","key":"${INTERNAL_PLATFORM_API_KEY_DEV:-sk-internal-worker-dev-changeme}","key_name":"ingestion-worker-system-key","models":["${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}"]}]
      AUTO_REGISTER_LINKS: >-
        [
          {"name":"ANILA LM","url":"/anilalm","icon":"book-open","description":"AI 學習內容生成","sort_order":1,"is_public":false,"required_roles":[]},
          {"name":"Code Server (按需)","env_seed_key":"Code Server","url":"https://${CODESERVER_HOST:-code.ai.ncsist.org.tw}/","icon":"code","description":"獨立來源的隔離開發 sandbox；使用原生密碼登入","sort_order":2,"is_public":false,"required_roles":["admin"]},
          {"name":"n8n 工作流程","url":"https://${N8N_HOST:-n8n.ai.ncsist.org.tw}/","icon":"workflow","description":"獨立來源的 n8n 開發環境；使用原生帳號登入","sort_order":3,"is_public":true,"required_roles":["developer"]},
          {"name":"GitLab","url":"https://${GITLAB_HOST:-gitlab.ai.ncsist.org.tw}/","icon":"git-branch","description":"獨立來源的 GitLab 開發環境；使用原生認證","sort_order":4,"is_public":true,"required_roles":["developer"]}
        ]
      ANILA_TEMPLATE_DIR: /app/anila-template
      INGESTION_UPLOAD_DIR: /var/anila/ingestion-uploads
      INGESTION_OUTBOX_STALE_SECONDS: "${INGESTION_OUTBOX_STALE_SECONDS_DEV:-120}"
      ATTACHMENT_STORAGE_PATH: /var/anila/attachments
      SOURCE_SNAPSHOT_STORAGE_PATH: /var/lib/anila/source-snapshots
      ARTIFACT_BLOB_STORAGE_PATH: /var/lib/anila/artifact-blobs
      RETENTION_ENABLED: "true"
      RETENTION_ARTIFACT_ACTIVE_DAYS: "${RETENTION_ARTIFACT_ACTIVE_DAYS_DEV:-30}"
      RETENTION_ARTIFACT_ARCHIVE_DAYS: "${RETENTION_ARTIFACT_ARCHIVE_DAYS_DEV:-365}"
      RETENTION_INGESTION_ACTIVE_DAYS: "${RETENTION_INGESTION_ACTIVE_DAYS_DEV:-365}"
      RETENTION_INGESTION_ARCHIVE_DAYS: "${RETENTION_INGESTION_ARCHIVE_DAYS_DEV:-365}"
      RETENTION_REAPER_INTERVAL_SECONDS: "${RETENTION_REAPER_INTERVAL_SECONDS_DEV:-300}"
      RETENTION_REAPER_LEASE_SECONDS: "${RETENTION_REAPER_LEASE_SECONDS_DEV:-900}"
      RETENTION_REAPER_BATCH_SIZE: "${RETENTION_REAPER_BATCH_SIZE_DEV:-50}"
      RETENTION_ALLOW_ARCHIVED_DOWNLOADS: "false"
      # FLUX image-gen for ANILALM studio pptx pipeline — wires
      # studio.image_provider.FluxImageProvider; empty BACKEND_URL
      # would make get_flux_provider() return None (toggle OFF).
      FLUX_BACKEND_URL: ${FLUX_BACKEND_URL:-http://flux2-dev:8000}
      FLUX_MAX_CONCURRENT: "${FLUX_MAX_CONCURRENT:-4}"
      FLUX_TIMEOUT_SECONDS: "${FLUX_TIMEOUT_SECONDS:-180}"
      # FLUX_CACHE_DIR defaults to $INGESTION_UPLOAD_DIR/flux-cache
    volumes:
      - ../../packages/anila-agent:/app/anila-template:ro
      # Named volume inherits UID 10001 from the CSP image and is shared with
      # the worker running under the same numeric identity.  A fresh Linux
      # checkout therefore does not get a root-owned bind directory.
      - ingestion-uploads-dev:/var/anila/ingestion-uploads
      - csp-attachments-dev:/var/anila/attachments
      - csp-source-snapshots-dev:/var/lib/anila/source-snapshots
      - csp-artifact-blobs-dev:/var/lib/anila/artifact-blobs
      - csp-secrets-dev:/app/secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - anila-models-net
    depends_on:
      csp-db:
        condition: service_healthy
    # 2026-07-24 freeze: urlopen timeout=2s was too sensitive — a briefly busy
    # event loop accumulated FailingStreak false positives. Bump probe timeout
    # 2s→5s (urlopen synced) and retries 6→8: fewer busy-loop false alarms,
    # at the cost of ~20s extra delay before a true freeze is marked unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-use-rdb-preamble
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli ping | grep -qx PONG &&
          redis-cli INFO persistence | tr -d '\r' | grep -q '^aof_enabled:1$' &&
          redis-cli INFO persistence | tr -d '\r' | grep -q '^aof_last_write_status:ok$'
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── ingestion-worker ────────────────────────────────────────────────────
  ingestion-worker:
    build:
      context: ../..
      dockerfile: services/ingestion-worker/Dockerfile
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:-development}
      # Development keeps direct model services/network access explicitly
      # testable.  This marker is never accepted by the formal checker.
      ANILA_DEV_DIRECT_MODEL_EGRESS: "1"
      GATE5_MODEL_GOVERNANCE_ENABLED: "false"
      GATE5_MODEL_GOVERNANCE_STARTUP_REQUIRED: "false"
      GATE5_MODEL_GATEWAY_ENDPOINT: http://csp:8000/v1
      GATE5_FLUX_LEGAL_APPROVED: "false"
      DATABASE_URL: postgresql://csp_app:csp@csp-db:5432/csp
      REDIS_URL: redis://redis:6379
      INGESTION_QUEUE_HMAC_KEY: ${INGESTION_QUEUE_HMAC_KEY:-dev-ingestion-queue-hmac-key-change-me}
      EMBEDDING_BASE_URL: http://csp:8000/v1
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nvidia/NV-embed-V2}
      EMBEDDING_MODEL_FINGERPRINT: ${EMBEDDING_MODEL_FINGERPRINT_DEV:?EMBEDDING_MODEL_FINGERPRINT_DEV must be sha256:<64 lowercase hex> for deployed dev embedding weights}
      EMBEDDING_API_KEY: ${INTERNAL_PLATFORM_API_KEY_DEV:-sk-internal-worker-dev-changeme}
      EMBEDDING_DIM: "4000"
      # 與 csp 的 ANILA_EMBED_SOURCE_DIM 同義(worker 側的名字)。未設 = 嚴格。
      # 注意 EMBEDDING_DIM 是**儲存契約寬度**(必須是 4000),
      # EMBEDDING_SOURCE_DIM 是**模型原生輸出維度**,兩者不同。
      EMBEDDING_SOURCE_DIM: ${ANILA_EMBED_SOURCE_DIM_DEV:-}
      PARSE_TIMEOUT_SECONDS: "${INGESTION_PARSE_TIMEOUT_SECONDS_DEV:-120}"
      INDEX_TIMEOUT_SECONDS: "${INGESTION_INDEX_TIMEOUT_SECONDS_DEV:-120}"
      JOB_TIMEOUT_SECONDS: "${INGESTION_JOB_TIMEOUT_SECONDS_DEV:-900}"
      JOB_LEASE_SECONDS: "${INGESTION_JOB_LEASE_SECONDS_DEV:-90}"
      JOB_HEARTBEAT_SECONDS: "${INGESTION_JOB_HEARTBEAT_SECONDS_DEV:-20}"
      JOB_LEASE_GRACE_SECONDS: "${INGESTION_JOB_LEASE_GRACE_SECONDS_DEV:-15}"
      UPLOAD_DIR: /var/anila/ingestion-uploads
      SECRET_KEY: ${CSP_SECRET_KEY:-dev-secret-key-change-in-prod}
      ANILA_ALLOW_DEV_SECRET: "1"
      # Dev-only relax (S-117 URL guard): dev runs every model/agent on
      # docker-internal http endpoints (e.g. http://flux2-dev-agent:8000), so
      # register + health-check would otherwise fail "scheme must be https".
      # Hardcoded "1" overrides .env (which keeps 0); prod compose still reads
      # .env=0 → stays strict (https + no private).
      ANILA_ALLOW_HTTP_ENDPOINT: "1"
      ANILA_ALLOW_PRIVATE_ENDPOINT: "1"
      ENABLE_IMAGE_CAPTIONS: "${ENABLE_IMAGE_CAPTIONS:-true}"
      VISION_URL: "${VISION_URL:-http://csp:8000/v1}"
      VISION_MODEL: "${VISION_MODEL:-gemma4}"
      VISION_API_KEY: ${INTERNAL_PLATFORM_API_KEY_DEV:-sk-internal-worker-dev-changeme}
      VISION_VERIFY_SSL: "${VISION_VERIFY_SSL:-false}"
      VISION_CONCURRENCY: "${VISION_CONCURRENCY:-4}"
      VISION_TIMEOUT_SECONDS: "${VISION_TIMEOUT_SECONDS:-60}"
      # LLM relation extraction (document-relations Phase 2 / B). Goes through
      # the CSP /v1 proxy → Router → gemma4, metered via the worker system key.
      ENABLE_RELATION_LLM: "${ENABLE_RELATION_LLM:-true}"
      RELATION_LLM_URL: "${RELATION_LLM_URL:-http://csp:8000/v1}"
      RELATION_LLM_MODEL: "${RELATION_LLM_MODEL:-gemma4}"
      RELATION_LLM_API_KEY: ${INTERNAL_PLATFORM_API_KEY_DEV:-sk-internal-worker-dev-changeme}
      RELATION_LLM_VERIFY_SSL: "${RELATION_LLM_VERIFY_SSL:-false}"
      RELATION_LLM_TIMEOUT_SECONDS: "${RELATION_LLM_TIMEOUT_SECONDS:-120}"
      # Embedding topic-similarity edges (document-relations / C). Uses the
      # existing document_chunks vectors — no extra model call.
      ENABLE_SIMILARITY_EDGES: "${ENABLE_SIMILARITY_EDGES:-true}"
      SIMILARITY_TOP_K: "${SIMILARITY_TOP_K:-3}"
      SIMILARITY_MIN: "${SIMILARITY_MIN:-0.75}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ingestion-uploads-dev:/var/anila/ingestion-uploads
    expose:
      - "8081"
    depends_on:
      csp-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      csp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Router ──────────────────────────────────────────────────────────────
  router:
    build:
      context: ../..
      dockerfile: services/anila-core-router/Dockerfile
    expose:
      - "9000"
    environment:
      CSP_BASE_URL: http://csp:8000
      CSP_JWKS_URL: http://csp:8000/.well-known/jwks.json
      ROUTER_CONTEXT_ISSUER: "https://anila.internal/csp"
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:-dev-service-token}
      ANILA_CSP_REGISTRY_SERVICE_TOKEN: "${ANILA_CSP_REGISTRY_SERVICE_TOKEN:-}"
      ANILA_CSP_AGENT_SERVICE_TOKEN: "${ANILA_CSP_AGENT_SERVICE_TOKEN:-}"
      ANILA_CSP_INFERENCE_SERVICE_TOKEN: "${ANILA_CSP_INFERENCE_SERVICE_TOKEN:-}"
      ANILA_ROUTER_STATE_DIR: /var/lib/anila-router
      MODEL: ${LLM_MODEL:-gemma4}
      COOKIE_SECURE: "true"
    volumes:
      - router-state-dev:/var/lib/anila-router
    depends_on:
      csp:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ── Official anila-agent Silver runtime (Gate 5 R5) ────────────────────
  # Explicit profile keeps the normal dev stack lightweight; the disposable
  # Gate 5 harness enables this profile and provisions a fresh csk-/registry
  # row before sending any dispatch traffic.
  anila-agent:
    profiles: ["gate5-silver"]
    build:
      context: ../..
      dockerfile: packages/anila-agent/Dockerfile
      target: silver-runtime
    image: "${ANILA_IMAGE_ANILA_AGENT_DEV:-anila-agent:silver-dev}"
    expose:
      - "8200"
    environment:
      ANILA_BASE_URL: http://csp:8000/v1
      CSP_BASE_URL: http://csp:8000
      ANILA_DEPLOYMENT_PROFILE: "${ANILA_DEPLOYMENT_PROFILE_DEV:-development}"
      # Keep ordinary dev Compose interpolation compatible when the optional
      # profile is not selected; service startup remains fail-closed because
      # ANILA_ALLOW_NO_SERVICE_TOKEN is hardcoded to 0 below.
      CSP_SERVICE_TOKEN: "${ANILA_AGENT_SERVICE_TOKEN_DEV:-}"
      CSP_SEARCH_TOKEN: "${ANILA_AGENT_SERVICE_TOKEN_DEV:-}"
      ANILA_AGENT_ID: "${ANILA_AGENT_ID_DEV:-anila-agent-silver}"
      ANILA_AGENT_NAME: "${ANILA_AGENT_NAME_DEV:-anila-agent-silver}"
      ANILA_AGENT_MODEL_ID: "${ANILA_AGENT_MODEL_ID_DEV:-1}"
      ANILA_MODEL: "${ANILA_AGENT_MODEL_ID_DEV:-1}"
      ANILA_HOME: /var/lib/anila-agent
      ANILA_TRACE_ENDPOINT: http://csp:8000
      ANILA_TRACE_ENABLED: "true"
      ANILA_CLASSIFICATION_DEFAULT: "無機密"
      ANILA_CLASSIFICATION_CEILING: "無機密"
      ANILA_ALLOW_NO_SERVICE_TOKEN: "0"
      # Test-only native SDK approval edge; default is disabled even in dev.
      ANILA_E2E_REQUIRE_TOOL_APPROVAL: "${ANILA_E2E_REQUIRE_TOOL_APPROVAL:-0}"
      ANILA_E2E_HARNESS: "${ANILA_E2E_HARNESS:-}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - anila-agent-state-dev:/var/lib/anila-agent
    networks:
      - default
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Deterministic model shim used only by gate5-silver E2E.  The Agent still
  # reaches it through CSP_BASE_URL; no Agent container is attached to the
  # external model network and no raw model URL is admitted by startup.
  gate5-e2e-model:
    profiles: ["gate5-silver"]
    image: python:3.12-slim
    command: ["python", "/opt/gate5/gate5-e2e-model.py"]
    environment:
      GATE5_E2E_MODEL_PORT: "8105"
    volumes:
      - ../../infra/deployment/scripts/gate5-e2e-model.py:/opt/gate5/gate5-e2e-model.py:ro
    expose:
      - "8105"
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8105/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  # ── pptx-renderer ───────────────────────────────────────────────────────
  pptx-renderer:
    build:
      context: ../../services/pptx-renderer
      dockerfile: Dockerfile
    expose:
      - "7100"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── anila-studio (Studio extraction Phase 2 skeleton) ───────────────────
  # The deck generation service (FLUX images + RAG + PPTX) extracted out of
  # csp. Reads JWKS + token revocation events from csp via HTTP/Redis so
  # cross-service auth works without sharing private keys.
  anila-studio:
    build:
      context: ../../services/anila-studio
      dockerfile: Dockerfile
    expose:
      - "8100"
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:-development}
      ANILA_DEV_DIRECT_MODEL_EGRESS: "1"
      GATE5_MODEL_GOVERNANCE_ENABLED: "false"
      GATE5_MODEL_GOVERNANCE_STARTUP_REQUIRED: "false"
      GATE5_MODEL_GATEWAY_ENDPOINT: http://csp:8000/v1
      CSP_BASE_URL: http://csp:8000
      # 跟 csp 共用同一把 service-to-service token,讓 cold-start sync
      # /api/auth/revocations 能透過 X-CSP-Service-Token header 通過
      # csp 的 verify_service_token。對齊 router / ingestion-worker 的 pattern。
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:-dev-service-token}
      STUDIO_ARTIFACT_SERVICE_TOKEN: ${STUDIO_ARTIFACT_SERVICE_TOKEN:-csk-dev-studio-artifact}
      STUDIO_RUNTIME_SERVICE_TOKEN: ${STUDIO_RUNTIME_SERVICE_TOKEN:-csk-dev-studio-runtime}
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      # 2026-07 起走 OpenAI 相容 Images API(POST {base}/v1/images/generations);
      # base URL 指伺服器根或含 /v1 皆可(client 自動補版本段)。
      FLUX_BACKEND_URL: http://flux2-dev:8000
      FLUX_MODEL: ${FLUX_MODEL:-flux.2-dev}
      # 有值才帶 Authorization: Bearer;留空 = 不帶(本機 flux2-dev 免驗)。
      FLUX_API_KEY: ${FLUX_API_KEY-}
      # 對齊 volume mount 路徑。studio.py 內讀 os.environ["FLUX_CACHE_DIR"],
      # 預設 fallback 是 csp 的 /var/anila/ingestion-uploads/flux-cache,在
      # anila-studio container 內不存在/沒權限,所以這條 env 必須顯式設。
      FLUX_CACHE_DIR: /var/anila/anila-studio-flux-cache
      # report / mindmap / infographic / datatable 4 種 artifact 的持久化目錄。
      # 每個 job 落地 {job_id}.{html,pdf,docx,svg,csv,xlsx}, 24h 後 prune。
      ARTIFACTS_DIR: /var/anila/anila-studio-artifacts
      RENDERER_BASE_URL: http://pptx-renderer:7100
      JWT_KID: anila-v1
      JWT_ISSUER: "https://anila.internal/csp"
      JWT_AUDIENCE: "anila-platform"
      JWT_LEEWAY_SECONDS: "60"
      REVOCATION_RECONCILE_INTERVAL_SECONDS: "5"
      REQUIRE_CARD_LOGIN_ONLY: "false"
      COOKIE_SECURE: "true"
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
      pptx-renderer:
        condition: service_healthy
    volumes:
      - anila-studio-flux-cache-dev:/var/anila/anila-studio-flux-cache
      - anila-studio-artifacts-dev:/var/anila/anila-studio-artifacts
    networks:
      - default
      - anila-models-net  # flux2-dev sits here
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── ASR gateway (串流語音輸入;dev / 帳密測試環境)──────────────────────
  # 對應 platform.yml 的 asr-gateway,但走 dev 慣例:直接 build、dev 預設 env、
  # REQUIRE_CARD_LOGIN_ONLY=false(帳密登入,不用卡)。
  # decoder 在 anila-models-net 上(infra/models/docker-compose.yml 的 asr-decoder,
  # 用 `model-serve.sh up asr-decoder` 起);gateway 掛 anila-models-net 才連得到。
  # nginx(dev)用的是同一份 anila.conf,/asr/ 路由與麥克風放行已在其中。
  asr-gateway:
    build:
      context: ../../services/asr-gateway
      dockerfile: Dockerfile
    expose:
      - "8200"
    environment:
      ANILA_DEPLOYMENT_PROFILE: ${ANILA_DEPLOYMENT_PROFILE:-development}
      # decoder(dev 走內部 network,http 服務名免旗標)
      ASR_DECODE_URL: ${ASR_DECODE_URL:-http://asr-decoder:9000}
      # ⚠ 必須與 asr-decoder 同值。decoder(models compose)是 fail-loud、沒有預設,
      # 所以務必在 .env 設 ASR_DECODER_TOKEN,兩邊才對得上。
      ASR_DECODER_TOKEN: ${ASR_DECODER_TOKEN:-dev-asr-token}
      ASR_ALLOW_HTTP_DECODER: ${ASR_ALLOW_HTTP_DECODER:-0}
      ASR_INITIAL_PROMPT: ${ASR_INITIAL_PROMPT:-以下是繁體中文。}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-5}
      ASR_PARTIALS_ENABLED: ${ASR_PARTIALS_ENABLED:-1}
      ASR_OPENCC_MODE: ${ASR_OPENCC_MODE:-off}
      ASR_MAX_SESSION_SECONDS: ${ASR_MAX_SESSION_SECONDS:-300}
      CSP_BASE_URL: http://csp:8000
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:-dev-service-token}
      REDIS_URL: redis://redis:6379/0
      REDIS_REVOCATION_CHANNEL: anila:auth:token-revoke
      JWT_KID: anila-v1
      JWT_ISSUER: "https://anila.internal/csp"
      JWT_AUDIENCE: "anila-platform"
      JWT_LEEWAY_SECONDS: "60"
      REVOCATION_RECONCILE_INTERVAL_SECONDS: "5"
      # dev/帳密登入:關掉卡登限定,gateway 才接受 amr=["pwd"] 的 session。
      REQUIRE_CARD_LOGIN_ONLY: "false"
      # 跟 dev csp 一致(__Host- cookie);不一致就是全 4401。
      COOKIE_SECURE: "true"
      LOG_LEVEL: INFO
    depends_on:
      csp:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    networks:
      - default
      - anila-models-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/asr/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── ANILA LM (no-SSO 版本，從 feature/no-sso branch build) ───────────────
  anilalm:
    build:
      context: ../../apps/anilalm
      args:
        BASE_PATH: ${ANILALM_BASE_PATH:-/anilalm/}
        VITE_DEFAULT_CHAT_MODEL: ${ANILALM_DEFAULT_CHAT_MODEL:-gemma4}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # ── ANILA UI (admin SPA) ────────────────────────────────────────────────
  anila-ui:
    build:
      # repo-root context：同 platform.yml，涵蓋共用設計系統 packages/ui。
      context: ../..
      dockerfile: apps/anila-shell/Dockerfile
      args:
        # anila-ui 由 nginx 服務在 /anila/(容器內 nginx 也 alias 到 /anila/),
        # SPA 必須 build 成 base=/anila/,否則 asset 路徑對不上 → 空白頁。
        # dev.yml 早先漏設,預設 base=/ → /anila/ 打開是白畫面。
        BASE_PATH: ${ANILA_UI_BASE_PATH:-/anila/}
        VITE_CSP_BASE_URL: ${ANILA_PUBLIC_CSP_BASE_URL-}
        VITE_ROUTER_BASE_URL: ${ANILA_PUBLIC_ROUTER_BASE_URL:-/router}
    expose:
      - "80"
    depends_on:
      csp:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # ── nginx (dev 入口，獨立 port + 獨立 container_name) ───────────────────
  nginx:
    image: nginx:alpine
    # ⚠️ 必須顯式不同名——compose 對 container_name 不會自動加 project prefix。
    container_name: anila-nginx-dev
    ports:
      - "${ANILA_DEV_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT_DEV:-8080}:80"
      - "${ANILA_DEV_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT_DEV:-8443}:443"
      - "${ANILA_DEV_BIND_ADDRESS:-127.0.0.1}:${ANILA_UI_HTTPS_PORT_DEV:-9443}:4443"
    volumes:
      - ../../infra/nginx/anila.conf:/etc/nginx/conf.d/default.conf:ro
      # anila.conf 的 /router/ location include 這個 snippet(router-posture.conf)。
      # platform.yml 有掛,dev.yml 早先漏了 → nginx [emerg] open() failed 而 crash-loop。
      # dev 有 router 服務,用 enabled 版(與 platform.yml 一致)。
      - ../../infra/nginx/snippets/router-enabled.conf:/etc/nginx/snippets/router-posture.conf:ro
      - ../../infra/nginx/snippets/extra-anila-hosts.dev.conf:/etc/nginx/snippets/extra-anila-hosts.conf:ro
      - "${ANILA_DEV_TLS_CERTS_DIR:?ANILA_DEV_TLS_CERTS_DIR must be outside the repo}:/etc/nginx/certs:ro"
      - ../../share-dev/static:/usr/share/nginx/share-files/static:ro
      - ../../share-dev/uploads:/usr/share/nginx/share-files/uploads:rw
    depends_on:
      csp:
        condition: service_healthy
        restart: true
      anilalm:
        condition: service_healthy
        restart: true
      router:
        condition: service_healthy
        restart: true
      anila-ui:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  # ⚠️ 不同名才不會跟 live stack 的 anila-net 衝突。
  default:
    name: anila-dev-net
  # 跟 models stack + live stack 共用的 external network。
  # 第一次 up 時若不存在，先跑 shared helper:
  #   bash infra/deployment/scripts/ensure-models-network.sh ensure
  anila-models-net:
    external: true
    name: anila-models-net

volumes:
  csp-pgdata-dev:
  redis-data-dev:
  ingestion-uploads-dev:
  csp-attachments-dev:
  csp-source-snapshots-dev:
  csp-artifact-blobs-dev:
  csp-secrets-dev:
  anila-agent-state-dev:
  router-state-dev:
  anila-studio-flux-cache-dev:
  anila-studio-artifacts-dev:
