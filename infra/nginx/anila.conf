# ============================================================
# CSP Platform - Nginx 反向代理（生產級配置）
# ============================================================

# ── DNS resolver — Docker's embedded DNS at 127.0.0.11 ──
# Without this, `proxy_pass http://<service>:<port>` resolves DNS once at
# config-load time and pins to that IP. When a service is recreated
# (e.g. `docker compose up -d codeserver`) it gets a new IP on anila-net
# and nginx keeps proxying to the dead old IP → 502 until nginx restart.
# valid=30s — Docker's DNS TTL is short anyway; longer cache hides outages
# without a meaningful performance win.
#
# TWO consumers of this resolver, both re-resolving without a nginx reload:
#   1. `server <name>:<port> resolve` inside an `upstream` block (needs a
#      `zone`). Preferred — keeps upstream keepalive and leaves proxy_pass
#      URI semantics untouched. See the upstream blocks below.
#   2. VARIABLE proxy_pass (set $addr "svc:port"; proxy_pass http://$addr).
#      Used by the subpath services further down. ⚠ A variable proxy_pass
#      CANNOT strip a location prefix: nginx passes any URI written in the
#      directive verbatim, so those locations need an explicit
#      `rewrite ... break;` instead of a trailing slash on proxy_pass.
resolver 127.0.0.11 valid=30s ipv6=off;

# ── Rate Limiting Zones ──
# api_limit is per client IP. Sustained 100r/s is a DoS ceiling, not a
# capacity claim: loadtest (2026-07-31) showed CSP+pool still healthy at
# VU=48 while this zone alone produced the VU≥64 "5xx flood" (nginx
# `limiting requests` counts matched k6 http_5xx exactly). Keep the
# sustained rate; locations below use a larger burst *without* nodelay so
# short concurrency spikes queue as latency instead of instant 503 while
# /health and docker healthchecks stay green.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_status 503;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
# card_verify_limit:PKCS#7 解析是 CPU-重操作 (cryptography + DER parse + cert
# 抽 claim),用窄頻寬擋 DoS。真實使用情境一人刷卡頻率 < 1r/min,2r/s + burst 3
# 對使用者沒摩擦,只擋自動化攻擊。
limit_req_zone $binary_remote_addr zone=card_verify_limit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Upstreams ──
# max_fails=0: each of these upstreams has a single server. Passive
# max_fails=3 fail_timeout=30s marked the only peer down after three
# connect blips (CSP recreate, brief refuse) → nginx returned 502 for
# up to 30s while the container's own /health and docker healthcheck
# stayed green. With one peer, passive fail counting cannot fail over;
# it only hides the backend behind a false outage. KEEP IT AT 0 — the
# VU64 loadtest that produced 3039 5xx dropped to 0 with this change.
# `resolve` does not make max_fails moot: a name still normally resolves
# to exactly one address here, so the ejection failure mode is unchanged
# and max_fails=0 is still what prevents it.
#
# `zone` + `resolve`: re-resolve the service name in the background on the
# resolver's `valid` timer instead of pinning the IP at config-load time.
# This is the fix for "recreate a backend → whole site 502s while every
# container reports healthy", which happened at least three times and was
# being mitigated only by remembering to run deploy-prod.sh (which reloads
# nginx). It now self-heals within `valid` (30s) with nobody watching.
# `resolve` requires a `resolver` (declared above) and a `zone`; it became
# available in open-source nginx in 1.27.3 and this image is 1.29.5.
# ⚠ It is deliberately NOT the variable-proxy_pass form used further down:
#    a variable proxy_pass bypasses the upstream block, losing `keepalive`
#    (every request would pay a fresh TCP handshake — these carry SSE chat
#    streams) and losing prefix stripping for /router/.
upstream csp_backend {
    zone csp_backend 64k;
    server csp:8000 resolve max_fails=0;
    keepalive 32;
}

upstream router_backend {
    zone router_backend 64k;
    server router:9000 resolve max_fails=0;
    keepalive 16;
}

upstream anila_ui_static {
    zone anila_ui_static 64k;
    server anila-ui:80 resolve max_fails=0;
    keepalive 16;
}

# anila-studio (Studio extraction Phase 2-3) — /api/studio/* routes here
# instead of csp_backend after csp Phase 7 deletion.
upstream anila_studio_backend {
    zone anila_studio_backend 64k;
    server anila-studio:8100 resolve max_fails=0;
    keepalive 16;
}

# ── WebSocket upgrade map ──
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Host header allowlist ──
# 拒絕未知 Host header,防止內網有人帶任意 Host 探測或欺騙 backend 的
# Host-based 邏輯。dev (localhost/127.0.0.1) 與 prod 主機 IP 都涵蓋;
# FQDN 用 *.ncsist.org.tw wildcard — IT 之後若給 FQDN 不必再改 nginx.conf。
# `return 444` 直接關連線(無 error page,不洩漏服務 existence)。
# 換新 prod IP 時:把這條 map 內的 IP 改掉,重啟 nginx。
map $host $is_anila_host {
    default 0;
    "localhost" 1;
    "127.0.0.1" 1;
    "10.53.100.12" 1;     # 內網模型主機 (早期規劃曾為部署目標,保留)
    "10.53.100.15" 1;     # 內網部署主機 — 平台實際落地 IP
    "172.16.120.35" 1;    # 試用機 (中科院 LAN)
    "172.16.120.153" 1;   # 開發基台 — 2026-09-02 擁有者裁定給外網（帳密登入）試用；.env ALLOWED_HOSTS 同步加
    ~^.+\.ncsist\.org\.tw$ 1;
}

# ── HTTP Server（port 80）→ 強制跳轉 HTTPS ──
server {
    listen 80 default_server;
    server_name _;

    # Host allowlist — 與 443/4443 同一套 $is_anila_host。
    # 未套用時 `return 301 https://$host...` 會把攻擊者控制的 Host
    # 原樣寫進 Location（open redirect）。未知 Host → 444；
    # 允許的 Host/IP（含內網 FQDN 與平台 IP）才 301，不縮小 443 既有放行範圍。
    if ($is_anila_host = 0) { return 444; }

    return 301 https://$host$request_uri;
}

# ── Loopback readiness (compose healthcheck only) ──
# Port 80 always 301s to HTTPS; alpine wget TLS is awkward. This listener
# is bound to 127.0.0.1 only and proxies /health through the same
# csp_backend upstream the public entry uses — so `docker ps` goes red
# when nginx cannot reach CSP, instead of staying green on `nginx -t`.
server {
    listen 127.0.0.1:8080;
    server_name _;
    location /health {
        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }
    location / {
        return 404;
    }
}

# ── HTTPS Server（port 443）──
server {
    listen 443 ssl default_server;
    server_name _;

    # Host header allowlist (見檔頂 map $is_anila_host)。未知 Host → 444。
    # `if` 在 server-block (非 location 內) 接 `return` 是官方建議用法,
    # 「if is evil」warning 不適用於這個 pattern。
    if ($is_anila_host = 0) { return 444; }

    # ── SSL 憑證 ──
    # 自簽憑證（開發用）；有正式 domain 後替換這兩行即可：
    #   ssl_certificate     /etc/nginx/certs/server.crt;
    #   ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 預設啟用（max-age=180 天）。自簽憑證的本機環境若想關閉，
    # 啟動時設 NGINX_HSTS_ENABLED=0；正式環境保留 always 即可。瀏覽器
    # 一旦記住 HSTS 就會強制使用 HTTPS，務必在簽到正式憑證後再讓使用者
    # 大量造訪，否則自簽憑證鎖死後無法降回 http://。
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    client_max_body_size 100M;

    # ── 安全標頭 ──
    server_tokens off;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Baseline CSP — 只允許 same-origin 資源；SPA build 不依賴外部 CDN。
    # 正式環境若需嵌入 n8n iframe 可再加 frame-src 白名單。
    # CSP 已收掉 'unsafe-eval' (Vue/React prod build 模板都 pre-compile,不需要動態
    # 程式碼執行)。'unsafe-inline' 暫保留以避免破壞 Vite legacy script bootstrap;
    # 改 nonce-based CSP 留下個 sprint 處理。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # Permissions-Policy — 平台需要 microphone(串流語音輸入)。
    # ⚠⚠ microphone=(self) 不可改回 () ——(self) 是語音輸入能運作的必要條件。
    #    改回去的話 getUserMedia 一律拋 NotAllowedError,而症狀跟「使用者按了
    #    拒絕」完全一樣。工具站與 /uploads/ 維持 microphone=()。
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;

    # ── Gzip 壓縮 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ─────────────────────────────────────────────
    # Health Check（不限速、不記 log）
    # ─────────────────────────────────────────────
    location /health {
        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ─────────────────────────────────────────────
    # 卡片簽章驗證 — 用窄 rate limit 擋 PKCS#7 parse DoS。
    # exact-match location 會先於下方 /api/auth/ 匹配,即使 URI 在 prefix 範圍。
    # ─────────────────────────────────────────────
    location = /api/auth/card/verify {
        # 登入／refresh／卡片驗證的回應帶多個 Set-Cookie：access JWT 依 P2.6
        # 設在 6 個 Path（middleware/cookies.py ACCESS_COOKIE_PATHS），加上 refresh
        # 與 csrf，約 5.5KB，超過預設 4k header buffer → "upstream sent too big
        # header" → 502，前端顯示「登入失敗」（2026-09-24 活體實測）。
        proxy_buffer_size       16k;
        proxy_buffers         8 16k;
        proxy_busy_buffers_size 32k;

        limit_req zone=card_verify_limit burst=3 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────────
    # 認證端點（較嚴格的 rate limit）
    # ─────────────────────────────────────────────
    location /api/auth/ {
        # 登入／refresh／卡片驗證的回應帶多個 Set-Cookie：access JWT 依 P2.6
        # 設在 6 個 Path（middleware/cookies.py ACCESS_COOKIE_PATHS），加上 refresh
        # 與 csrf，約 5.5KB，超過預設 4k header buffer → "upstream sent too big
        # header" → 502，前端顯示「登入失敗」（2026-09-24 活體實測）。
        proxy_buffer_size       16k;
        proxy_buffers         8 16k;
        proxy_busy_buffers_size 32k;

        limit_req zone=auth_limit burst=20 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────────
    # OpenAI 相容代理端點（streaming 支援）
    # /v1/chat/completions, /v1/embeddings, /v2/embeddings
    # ─────────────────────────────────────────────
    location ~ ^/v[12]/ {
        # burst without nodelay: excess waits to match 100r/s instead of
        # immediate 503. See api_limit comment at file top.
        limit_req zone=api_limit burst=100;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming: 關閉 buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # LLM 長文生成需要較長 timeout
        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;

        # 大型 audio/embedding 請求
        client_body_buffer_size 10M;
    }

    # ─────────────────────────────────────────────
    # Studio pipeline — slides/report 端點需要 60-180s（檢索 → LLM →
    # 渲染 → 視覺 QA，遇 critical 缺陷會多一輪 fix-and-rerender）。
    # 必須比 /api/ 通則更寬鬆。回應是 .pptx binary，關閉 buffering
    # 直接串流給前端。nginx prefix location 是「最長 match wins」，
    # 寫在 /api/ 之前只是為了直覺，與 /api/ 的相對順序不影響行為。
    # ─────────────────────────────────────────────
    # anila-studio 服務 5 種 artifact 共用同一 backend:
    # slides(studio)/ reports / mindmaps / infographics / datatables。
    # nginx prefix location 評估順序是「最長 prefix 先選,regex 命中
    # 才 override」── 這條 regex 對所有 5 個 prefix 都 match,不影響
    # 不在 list 內的 /api/* 路由(e.g. /api/auth → csp_backend 走 prefix)。
    location ~ ^/api/(studio|reports|mindmaps|infographics|datatables)/ {
        limit_req zone=api_limit burst=40;
        limit_conn conn_limit 50;

        # Phase 7+ all studio-family artifacts route to anila-studio service.
        proxy_pass http://anila_studio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Body streaming: .pptx is binary, no buffering / caching desired.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # Response header buffer must be large enough for the Studio extras —
        # X-Slides-Title (CJK percent-encoded) + X-Slides-QA-Defects
        # (percent-encoded JSON for up to 30 slides × per-slide summaries,
        # 3× expansion from CJK escaping). Default 4k/8k overflows when
        # vision QA finds multiple defects → "upstream sent too big header"
        # → 502. 32k gives plenty of headroom for Phase 3 metadata too.
        # Note: proxy_busy_buffers_size MUST be < total of proxy_buffers
        # (count × size). 8 × 32k = 256k, busy ≤ 64k satisfies the constraint
        # AND the rule that busy_buffers cannot equal the total.
        proxy_buffer_size       32k;
        proxy_buffers         8 32k;
        proxy_busy_buffers_size 64k;

        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
    }

    # ─────────────────────────────────────────────
    # API 端點（一般限速）
    # /api/keys, /api/models, /api/usage, /api/users, ...
    # ─────────────────────────────────────────────
    location /api/ {
        # burst without nodelay: excess waits to match 100r/s instead of
        # immediate 503. See api_limit comment at file top.
        limit_req zone=api_limit burst=100;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────────
    # ─────────────────────────────────────────────
    # code-server subpath — adopted verbatim from My-OpenAI-Frontend prod
    # nginx.prod.conf where the same setup ran in production. Differences
    # from our earlier (broken) attempt:
    #   - upstream codercom/code-server image (not lscr.io/linuxserver fork)
    #   - location WITHOUT trailing slash + explicit `rewrite ... break;`
    #     (rather than proxy_pass trailing slash for prefix strip)
    #   - minimal headers — only Host, Upgrade, Connection. No X-Forwarded-*
    #     hints; code-server upstream infers what it needs from Host alone.
    #   - Connection 'Upgrade' as a literal string, not the $connection_upgrade
    #     map. code-server tolerates Upgrade on non-WS requests.
    # The redirect on `= /codeserver` keeps trailing-slash discipline so
    # relative asset URLs in code-server's HTML resolve correctly.
    # ─────────────────────────────────────────────
    location = /codeserver {
        # 尾斜線補在 $uri（路徑）後,再用 $is_args$args 接回 query。
        # 不可寫 $request_uri/ —— $request_uri 含 query,斜線會落到
        # ?launch_token=x/ 造成無限 301（服務啟動 flow 必帶 launch_token）。
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    location /codeserver {
        # Thawed 2026-06-11: dev tool,開發人員從 dashboard 卡片點擊跳轉用。
        # 不帶 SSO — codeserver 自有密碼(CODESERVER_PASSWORD)。要重新冷凍把
        # 下一行還原成 `return 404;` 即可。⚠ CODESERVER_WORKSPACE 必須指非機密
        # 目錄(compose 已 enforce),密碼進場前用 §1.3 強密碼。
        # `set` MUST come before `rewrite ... break` — both directives are
        # in the ngx_http_rewrite_module and `break` halts the module's
        # processing, so any `set` after it never runs and the variable
        # stays uninitialized → "invalid URL prefix" 500. Variable
        # proxy_pass forces nginx to re-resolve via the resolver directive
        # on every request, picking up new container IPs after a
        # `docker compose up -d codeserver` without an nginx restart.
        set $codeserver_addr "codeserver:8080";
        rewrite ^/codeserver/(.*)$ /$1 break;
        proxy_pass http://$codeserver_addr;
        proxy_redirect off;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'Upgrade';

        client_max_body_size 200M;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────
    # n8n — subpath /n8n (N8N_PATH=/n8n/ on the container side handles the
    # rewrite UI-side; we still strip the prefix in nginx so the upstream
    # request path matches what n8n expects internally).
    # Trust-the-headers set borrowed from My-OpenAI-Frontend prod.
    # ─────────────────────────────────────────────
    location = /n8n {
        # 見 /codeserver exact-match：斜線補路徑、query 用 $is_args$args。
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    location /n8n {
        # Thawed 2026-06-11: own auth, no CSP SSO. Default ship does not
        # start n8n (compose profiles: ops). Location 502s unless COMPOSE_PROFILES=ops.
        # 重新冷凍 = 還原 `return 404;`。
        # ── 原 config ──
        # set BEFORE rewrite — see /codeserver block for why.
        set $n8n_addr "n8n:5678";
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass http://$n8n_addr;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host                $http_host;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Server  $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Url-Scheme        $scheme;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────
    # ANILA LM SPA — subpath /anilalm
    #
    # ANILA_LM_NGINX_GATE = open   （2026-09-26 擁有者決定重開）
    # 關閉手順：docs/runbooks/anilalm-release-gate.md
    # 變數位址：nginx 啟動時若 anilalm 還沒起來，寫死的 upstream 會失敗。
    # 改完必須 force-recreate nginx（bind-mount 綁 inode，reload 不夠）。
    # ─────────────────────────────────────────────
    location = /anilalm {
        # 見 /codeserver exact-match：斜線補路徑、query 用 $is_args$args。
        return 301 $scheme://$http_host$uri/$is_args$args;
    }
    location /anilalm {
        set $anilalm_addr "anilalm:80";
        proxy_pass http://$anilalm_addr;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────────────
    # ANILA UI(runtime chat client)— 同源 subpath /anila(2026-06-11 B 案)。
    # Vite base='/anila/',容器內 nginx alias-map,don't strip prefix。
    # 用帶尾斜線的 `location /anila/`(非寬前綴 `/anila`),免得連 /anilaXXX
    # 之類路徑也被吃進來;裸 /anila 由下方 exact-match 301 補到 /anila/。
    # 同源 = CSP 登入 cookie 自然共用,SSO 零設定。
    # ─────────────────────────────────────────────
    location = /anila {
        # 見 /codeserver exact-match：斜線補路徑、query 用 $is_args$args。
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    # 產物預覽殼：同源頁、sandbox 去掉 allow-same-origin。
    # location 一旦寫 add_header，server 區塊的安全標頭整組不繼承，必須重寫。
    # script-src 含 'self'（同源 vendor／Three.js）；https: 僅作其他函式庫後援。
    # 只罩這一檔，不要擴散到 /anila/。
    location = /anila/artifact-frame.html {
        proxy_pass http://anila_ui_static;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https: http: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: blob: data:; style-src 'unsafe-inline' https: http: data:; img-src * data: blob:; font-src * data: blob:; connect-src * ws: wss:; worker-src blob: 'self'; media-src *; frame-src * data: blob:; frame-ancestors 'self'; base-uri 'self' https: http:; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    }

    location /anila/ {
        proxy_pass http://anila_ui_static;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Router(agent dispatch)— ANILA UI 的 chat 必經;4443 區塊本來就有,
    # ANILA UI 搬到 443 後這裡也要(2026-06-11)。設定同 4443 區塊。

    # ── 串流語音輸入 (asr-gateway) ────────────────────────────────────────
    # 瀏覽器麥克風 → WSS /asr/stream。
    # ⚠⚠ 必須用變數式 proxy_pass:asr-gateway 是 profile-gated(COMPOSE_PROFILES=asr),
    #    寫死 hostname 會在容器不存在時讓 nginx 拒絕啟動。
    # ⚠ 前綴不 strip:gateway 路由自帶 /asr。
    location /asr/ {
        limit_conn conn_limit 20;
        set $asr_gateway_addr "asr-gateway:8200";
        proxy_pass http://$asr_gateway_addr;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /router/ {
        # burst without nodelay: excess waits to match 100r/s instead of
        # immediate 503. See api_limit comment at file top.
        limit_req zone=api_limit burst=100;
        limit_conn conn_limit 100;

        proxy_pass http://router_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ─────────────────────────────────────────────
    # /static + /uploads — shared workflow assets (see share/README.md).
    # /static is read-only (templates, icons referenced by n8n workflows).
    # /uploads is allowlisted: only /uploads/flux/ is served; everything else
    # under /uploads/ returns 404 (ingestion blobs stay private).
    # try_files $uri =404 — don't fall back to the SPA when an asset is missing.
    # ─────────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/share-files/static/;
        try_files $uri =404;
        expires 1y;
        # ⚠ nginx 繼承規則：location 一旦出現任何 add_header，上層
        # server 的 add_header 全部不繼承。這裡為了 Cache-Control 必須
        # 把 server 區塊的安全標頭整組重寫一遍；之後若只加 Cache-Control
        # 同類指令、忘記重寫，安全標頭會再次整組消失。
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
        access_log off;
    }

    # /uploads/ is unauthenticated static. Allowlist only what must be public:
    # flux2-dev-agent writes share/uploads/flux/<uuid>.{png,jpg,webp,gif}
    # (PUBLIC_URL_PREFIX=/uploads/flux). Everything else 404 — do not reopen
    # by adding directories under share/uploads/ without updating this block.
    # Do NOT use ^~ on /uploads/flux/ — that would skip the dotfile deny
    # (location ~ /\.) and serve share/uploads/flux/.env to the intranet.
    location ^~ /uploads/ingestion/ {
        return 404;
    }

    location /uploads/flux/ {
        alias /usr/share/nginx/share-files/uploads/flux/;
        try_files $uri =404;
        # Uploads change; don't cache aggressively.
        expires 1h;
    }

    location /uploads/ {
        return 404;
    }

    # 前端 SPA + 其他路由（fallback to CSP backend）
    # ─────────────────────────────────────────────
    location / {
        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────────────
    # /.well-known/jwks.json — csp 唯一掛在此前綴的公開路由。
    # exact-match (`=`) 優先於下方 `location ~ /\.`；其他 /.well-known/*
    # 仍落進 dotfile deny（403），避免 SPA catch-all 回 200 text/html。
    # ─────────────────────────────────────────────
    location = /.well-known/jwks.json {
        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────────
    # 隱藏檔案拒絕存取
    # ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ── HTTPS Server（port 4443）─ ANILA UI 入口 ──────────────────────
# Same-origin proxy for ANILA UI (React): serves static files and
# proxies /api/, /v1/, /v2/ to csp_backend and /router/ to router_backend
# (prefix stripped). ANILA UI is built with empty VITE_CSP_BASE_URL and
# VITE_ROUTER_BASE_URL=/router so every call becomes same-origin.
server {
    listen 4443 ssl;
    http2 on;
    server_name _;

    # Host header allowlist (同 port 443)。
    if ($is_anila_host = 0) { return 444; }

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache   shared:SSL_ANILA:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100M;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # CSP 已收掉 'unsafe-eval' (Vue/React prod build 模板都 pre-compile,不需要動態
    # 程式碼執行)。'unsafe-inline' 暫保留以避免破壞 Vite legacy script bootstrap;
    # 改 nonce-based CSP 留下個 sprint 處理。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Card PKCS#7 verify — narrow rate limit to guard CPU-heavy crypto parse.
    # Exact-match location wins over /api/auth/ prefix for this specific URI.
    location = /api/auth/card/verify {
        # 登入／refresh／卡片驗證的回應帶多個 Set-Cookie：access JWT 依 P2.6
        # 設在 6 個 Path（middleware/cookies.py ACCESS_COOKIE_PATHS），加上 refresh
        # 與 csrf，約 5.5KB，超過預設 4k header buffer → "upstream sent too big
        # header" → 502，前端顯示「登入失敗」（2026-09-24 活體實測）。
        proxy_buffer_size       16k;
        proxy_buffers         8 16k;
        proxy_busy_buffers_size 32k;

        limit_req zone=card_verify_limit burst=3 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Auth endpoints (stricter rate limit)
    location /api/auth/ {
        # 登入／refresh／卡片驗證的回應帶多個 Set-Cookie：access JWT 依 P2.6
        # 設在 6 個 Path（middleware/cookies.py ACCESS_COOKIE_PATHS），加上 refresh
        # 與 csrf，約 5.5KB，超過預設 4k header buffer → "upstream sent too big
        # header" → 502，前端顯示「登入失敗」（2026-09-24 活體實測）。
        proxy_buffer_size       16k;
        proxy_buffers         8 16k;
        proxy_busy_buffers_size 32k;

        limit_req zone=auth_limit burst=20 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Studio pipeline — see commentary in port 443 block. 60-180s, binary stream.
    # anila-studio 服務 5 種 artifact 共用同一 backend:
    # slides(studio)/ reports / mindmaps / infographics / datatables。
    # nginx prefix location 評估順序是「最長 prefix 先選,regex 命中
    # 才 override」── 這條 regex 對所有 5 個 prefix 都 match,不影響
    # 不在 list 內的 /api/* 路由(e.g. /api/auth → csp_backend 走 prefix)。
    location ~ ^/api/(studio|reports|mindmaps|infographics|datatables)/ {
        limit_req zone=api_limit burst=40;
        limit_conn conn_limit 50;

        # Phase 7+ all studio-family artifacts route to anila-studio service.
        proxy_pass http://anila_studio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Body streaming: .pptx is binary, no buffering / caching desired.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # Response header buffer must be large enough for the Studio extras —
        # X-Slides-Title (CJK percent-encoded) + X-Slides-QA-Defects
        # (percent-encoded JSON for up to 30 slides × per-slide summaries,
        # 3× expansion from CJK escaping). Default 4k/8k overflows when
        # vision QA finds multiple defects → "upstream sent too big header"
        # → 502. 32k gives plenty of headroom for Phase 3 metadata too.
        # Note: proxy_busy_buffers_size MUST be < total of proxy_buffers
        # (count × size). 8 × 32k = 256k, busy ≤ 64k satisfies the constraint
        # AND the rule that busy_buffers cannot equal the total.
        proxy_buffer_size       32k;
        proxy_buffers         8 32k;
        proxy_busy_buffers_size 64k;

        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
    }

    # General CSP API
    location /api/ {
        # burst without nodelay: excess waits to match 100r/s instead of
        # immediate 503. See api_limit comment at file top.
        limit_req zone=api_limit burst=100;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # CSP OpenAI-compat data plane (/v1/chat/completions, /v1/embeddings, /v2/embeddings)
    location ~ ^/v[12]/ {
        # burst without nodelay: excess waits to match 100r/s instead of
        # immediate 503. See api_limit comment at file top.
        limit_req zone=api_limit burst=100;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_body_buffer_size 10M;
    }

    # ANILA Router (/router/* → router:9000/*)  — prefix stripped by trailing slash

    # ── 串流語音輸入 (asr-gateway) ────────────────────────────────────────
    # 瀏覽器麥克風 → WSS /asr/stream。
    # ⚠⚠ 必須用變數式 proxy_pass:asr-gateway 是 profile-gated(COMPOSE_PROFILES=asr),
    #    寫死 hostname 會在容器不存在時讓 nginx 拒絕啟動。
    # ⚠ 前綴不 strip:gateway 路由自帶 /asr。
    location /asr/ {
        limit_conn conn_limit 20;
        set $asr_gateway_addr "asr-gateway:8200";
        proxy_pass http://$asr_gateway_addr;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /router/ {
        # burst without nodelay: excess waits to match 100r/s instead of
        # immediate 503. See api_limit comment at file top.
        limit_req zone=api_limit burst=100;
        limit_conn conn_limit 100;

        proxy_pass http://router_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ─────────────────────────────────────────────
    # ─────────────────────────────────────────────
    # code-server subpath — see commentary in the port 443 block for the
    # rewrite-vs-trailing-slash decision and the My-OpenAI-Frontend lineage.
    # ─────────────────────────────────────────────
    location = /codeserver {
        # 見 port 443 /codeserver exact-match：斜線補路徑、query 用 $is_args$args。
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    location /codeserver {
        # Thawed 2026-06-11: dev tool,開發人員從 dashboard 卡片點擊跳轉用。
        # 不帶 SSO — codeserver 自有密碼(CODESERVER_PASSWORD)。
        # 重新冷凍 = 還原 `return 404;`。

        # ── 解凍時還原以下原 config ──
        # `set` MUST come before `rewrite ... break` — both directives are
        # in the ngx_http_rewrite_module and `break` halts the module's
        # processing, so any `set` after it never runs and the variable
        # stays uninitialized → "invalid URL prefix" 500. Variable
        # proxy_pass forces nginx to re-resolve via the resolver directive
        # on every request, picking up new container IPs after a
        # `docker compose up -d codeserver` without an nginx restart.
        set $codeserver_addr "codeserver:8080";
        rewrite ^/codeserver/(.*)$ /$1 break;
        proxy_pass http://$codeserver_addr;
        proxy_redirect off;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'Upgrade';

        client_max_body_size 200M;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────
    # n8n — subpath /n8n (N8N_PATH=/n8n/ on the container side handles the
    # rewrite UI-side; we still strip the prefix in nginx so the upstream
    # request path matches what n8n expects internally).
    # Trust-the-headers set borrowed from My-OpenAI-Frontend prod.
    # ─────────────────────────────────────────────
    location = /n8n {
        # 見 port 443 /codeserver exact-match：斜線補路徑、query 用 $is_args$args。
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    location /n8n {
        # Thawed 2026-06-11: own auth, no CSP SSO. Default ship does not
        # start n8n (compose profiles: ops). Location 502s unless COMPOSE_PROFILES=ops.
        # 重新冷凍 = 還原 `return 404;`。

        # ── 解凍時還原以下原 config ──
        # set BEFORE rewrite — see /codeserver block for why.
        set $n8n_addr "n8n:5678";
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass http://$n8n_addr;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host                $http_host;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Server  $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Url-Scheme        $scheme;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────
    # ANILA LM — 與 443 同一道閘，2026-09-26 起開放。
    # ANILA_LM_NGINX_GATE = open  （見 docs/runbooks/anilalm-release-gate.md）
    # ─────────────────────────────────────────────
    location = /anilalm {
        # 見 port 443：斜線補路徑、query 用 $is_args$args。
        return 301 $scheme://$http_host$uri/$is_args$args;
    }
    location /anilalm {
        set $anilalm_addr "anilalm:80";
        proxy_pass http://$anilalm_addr;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────────────
    # /static + /uploads — shared workflow assets (see share/README.md).
    # /static is read-only (templates, icons referenced by n8n workflows).
    # /uploads is allowlisted: only /uploads/flux/ is served; everything else
    # under /uploads/ returns 404 (ingestion blobs stay private).
    # try_files $uri =404 — don't fall back to the SPA when an asset is missing.
    # ─────────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/share-files/static/;
        try_files $uri =404;
        expires 1y;
        # ⚠ nginx 繼承規則：location 一旦出現任何 add_header，上層
        # server 的 add_header 全部不繼承。這裡為了 Cache-Control 必須
        # 把 server 區塊的安全標頭整組重寫一遍；之後若只加 Cache-Control
        # 同類指令、忘記重寫，安全標頭會再次整組消失。
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
        access_log off;
    }

    # /uploads/ allowlist — see matching block on the other TLS listener.
    # Do NOT use ^~ on /uploads/flux/ — must still hit location ~ /\. for dotfiles.
    location ^~ /uploads/ingestion/ {
        return 404;
    }

    location /uploads/flux/ {
        alias /usr/share/nginx/share-files/uploads/flux/;
        try_files $uri =404;
        # Uploads change; don't cache aggressively.
        expires 1h;
    }

    location /uploads/ {
        return 404;
    }

    # branch SSO: 4443 port 是 anila-ui dedicated entry，但 /login 必須在
    # myCSPPlatform Vue SPA (在 443 port 由 csp_backend serve)。直接 proxy
    # 到 csp_backend 會引發 /assets/ 衝突 (Vue 跟 anila-ui 都用 /assets/，
    # nginx 無法依 hash 區分)，所以改用 302 跨 port redirect 到 443。
    # LoginView 的 ?next=... 會帶 absolute URL with 4443 port，登入完跳回。
    location = /login {
        return 302 https://$host/login$is_args$args;
    }

    # ANILA UI 已搬到 443 同源 /anila(2026-06-11 B 案,SSO cookie 共用)。
    # 4443 保留 listener 給舊書籤/深連結,一律 302 到新家;$request_uri 保路徑
    # (4443/app → /anila/app)。API 路由(上方各 location)維持原樣不受影響。
    location /anila {
        # 已帶 prefix 的連結直接轉到 443,不再疊一層 /anila。
        return 302 $scheme://$host$request_uri;
    }
    location / {
        return 302 $scheme://$host/anila$request_uri;
    }

    # JWKS carve-out is deliberately 443-only — 4443 is not a discovery origin
    # (its location / is a 302 redirect shell that would break /.well-known anyway).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# NOTE: codeserver dedicated port :8443 server block was removed. We're
# now back on /codeserver subpath using the upstream codercom/code-server
# image and the proven rewrite-based proxy_pass pattern from
# My-OpenAI-Frontend prod (see /codeserver location in the 4443 block).
