# GENERATED PILOT POSTURE: synchronized from anila.conf by policy checks.
# Studio/artifact proxying is intentionally absent; do not use outside Gate 2 pilot.
# ============================================================
# CSP Platform - Nginx 反向代理（生產級配置）
# ============================================================

# ── DNS resolver — Docker's embedded DNS at 127.0.0.11 ──
# Without this, `proxy_pass http://<service>:<port>` resolves DNS once at
# config-load time and pins to that IP. When a service is recreated
# (e.g. `docker compose up -d codeserver`) it gets a new IP on anila-net
# and nginx keeps proxying to the dead old IP → 502 until nginx restart.
# Combined with VARIABLE proxy_pass below (set $upstream … then proxy_pass
# http://$upstream), this makes nginx re-resolve at every request.
# valid=30s — Docker's DNS TTL is short anyway; longer cache hides outages
# without a meaningful performance win.
resolver 127.0.0.11 valid=30s ipv6=off;

# ── Rate Limiting Zones ──
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
# card_verify_limit:PKCS#7 解析是 CPU-重操作 (cryptography + DER parse + cert
# 抽 claim),用窄頻寬擋 DoS。真實使用情境一人刷卡頻率 < 1r/min,2r/s + burst 3
# 對使用者沒摩擦,只擋自動化攻擊。
limit_req_zone $binary_remote_addr zone=card_verify_limit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Upstreams ──
upstream csp_backend {
    server csp:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream router_backend {
    server router:9000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream anila_ui_static {
    server anila-ui:80 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Gate 2 pilot: Studio upstream intentionally absent.

# ── WebSocket upgrade map ──
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Host header allowlist ──
# 拒絕未知 Host header,防止內網有人帶任意 Host 探測或欺騙 backend 的
# Host-based 邏輯。dev (localhost/127.0.0.1) 與 prod 主機 IP 都涵蓋;
# 正式 FQDN 明確列舉；工具 origin 由各自 server block 接手，未知的內網
# hostname 不得意外落到 CSP/ANILA UI default server。
# `return 444` 直接關連線(無 error page,不洩漏服務 existence)。
# 換新 prod IP 時:把這條 map 內的 IP 改掉,重啟 nginx。
map $host $is_anila_host {
    default 0;
    "localhost" 1;
    "127.0.0.1" 1;
    "10.53.100.12" 1;     # 內網模型主機 (早期規劃曾為部署目標,保留)
    "10.53.100.15" 1;     # 內網部署主機 — 平台實際落地 IP
    "172.16.120.35" 1;    # 試用機 (中科院 LAN)
    "anila.ai.ncsist.org.tw" 1;
}

# Port 4443 serves CSP/ANILA UI and must never answer on a tool hostname.
# Browser cookies are scoped by host, not port; accepting n8n/gitlab/code here
# would let CSP mint an ambient cookie for that tool's 443 origin.
map $host $is_anila_ui_host {
    default 0;
    "localhost" 1;
    "127.0.0.1" 1;
    "10.53.100.15" 1;
    "172.16.120.35" 1;
    "anila.ai.ncsist.org.tw" 1;
}

# ── HTTP Server（port 80）→ 強制跳轉 HTTPS ──
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS Server（port 443）──
server {
    listen 443 ssl default_server;
    server_name _;

    # Host header allowlist (見檔頂 map $is_anila_host)。未知 Host → 444。
    # `if` 在 server-block (非 location 內) 接 `return` 是官方建議用法,
    # 「if is evil」warning 不適用於這個 pattern。
    if ($is_anila_host = 0) { return 444; }

    # ── SSL 憑證 ──
    # 自簽憑證（開發用）；有正式 domain 後替換這兩行即可：
    #   ssl_certificate     /etc/nginx/certs/server.crt;
    #   ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 預設啟用（max-age=180 天）。自簽憑證的本機環境若想關閉，
    # 啟動時設 NGINX_HSTS_ENABLED=0；正式環境保留 always 即可。瀏覽器
    # 一旦記住 HSTS 就會強制使用 HTTPS，務必在簽到正式憑證後再讓使用者
    # 大量造訪，否則自簽憑證鎖死後無法降回 http://。
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    client_max_body_size 100M;

    # ── 安全標頭 ──
    server_tokens off;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Baseline CSP — 只允許 same-origin 資源；SPA build 不依賴外部 CDN。
    # 正式環境若需嵌入 GitLab / n8n iframe 可再加 frame-src 白名單。
    # CSP 已收掉 'unsafe-eval' (Vue/React prod build 模板都 pre-compile,不需要動態
    # 程式碼執行)。'unsafe-inline' 暫保留以避免破壞 Vite legacy script bootstrap;
    # 改 nonce-based CSP 留下個 sprint 處理。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # 嚴格 Permissions-Policy — 平台不需要這些 sensor / 媒體 API。
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # ── Gzip 壓縮 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ─────────────────────────────────────────────
    # Health Check（不限速、不記 log）
    # ─────────────────────────────────────────────
    location /health {
        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ─────────────────────────────────────────────
    # 卡片簽章驗證 — 用窄 rate limit 擋 PKCS#7 parse DoS。
    # exact-match location 會先於下方 /api/auth/ 匹配,即使 URI 在 prefix 範圍。
    # ─────────────────────────────────────────────
    location = /api/auth/card/verify {
        limit_req zone=card_verify_limit burst=3 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────────
    # 認證端點（較嚴格的 rate limit）
    # ─────────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────────
    # Reverse-proxy authorization probes.
    #
    # Only nginx may call these locations.  The CSP access cookie is the
    # sole credential forwarded to the probe: the original Authorization
    # header belongs to GitLab / n8n (PAT, API token, ...), and forwarding it
    # would make CSP treat that downstream token as its own JWT.
    # ─────────────────────────────────────────────
    location = /_anila_auth/card-session {
        internal;
        proxy_pass http://csp_backend/api/auth/proxy-access/card-session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     "";
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /_anila_auth/card-developer {
        internal;
        proxy_pass http://csp_backend/api/auth/proxy-access/card-developer;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     "";
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /_anila_auth/card-admin {
        internal;
        proxy_pass http://csp_backend/api/auth/proxy-access/card-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     "";
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ─────────────────────────────────────────────
    # OpenAI 相容代理端點（streaming 支援）
    # /v1/chat/completions, /v1/embeddings, /v2/embeddings
    # ─────────────────────────────────────────────
    location ~ ^/v[12]/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming: 關閉 buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # LLM 長文生成需要較長 timeout
        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;

        # 大型 audio/embedding 請求
        client_body_buffer_size 10M;
    }

    # Gate 2 pilot: excluded Studio/artifact API families fail closed.
    location ~ ^/api/(studio|reports|mindmaps|infographics|datatables)/ {
        return 403;
    }

    # ─────────────────────────────────────────────
    # API 端點（一般限速）
    # /api/keys, /api/models, /api/usage, /api/users, ...
    # ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────────
    # Developer tools are deliberately absent from the CSP origin. Their
    # active-content pages must never share ambient authority with the
    # host-only anila_access_token cookie. Dedicated tool hostnames are
    # defined after the platform servers below.
    location ~ ^/(?:codeserver|n8n|gitlab)(?:/|$) {
        return 404;
    }

    # ─────────────────────────────────────────────
    # ANILA LM SPA — subpath /anilalm
    # Vite was built with base='/anilalm/' so the request URI INCLUDES
    # the prefix when it lands on the anilalm container; the in-container
    # nginx then `alias`-maps /anilalm/* onto its html dir. Don't strip
    # the prefix here.
    # The bare /anilalm (no slash) redirects to keep relative refs
    # working — same trick as /codeserver / /n8n / /gitlab.
    # ─────────────────────────────────────────────
    location = /anilalm {
        return 301 $scheme://$http_host$request_uri/;
    }

    location /anilalm {
        set $anilalm_addr "anilalm:80";
        proxy_pass http://$anilalm_addr;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────────────
    # ANILA UI(runtime chat client)— 同源 subpath /anila(2026-06-11 B 案)。
    # Vite base='/anila/',容器內 nginx alias-map,don't strip prefix。
    # 用帶尾斜線的 `location /anila/`(非寬前綴 `/anila`),免得連 /anilaXXX
    # 之類路徑也被吃進來;裸 /anila 由下方 exact-match 301 補到 /anila/。
    # 同源 = CSP 登入 cookie 自然共用,SSO 零設定。
    # ─────────────────────────────────────────────
    location = /anila {
        return 301 $scheme://$http_host$request_uri/;
    }

    location /anila/ {
        proxy_pass http://anila_ui_static;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Router(agent dispatch)— ANILA UI 的 chat 必經;4443 區塊本來就有,
    # ANILA UI 搬到 443 後這裡也要(2026-06-11)。設定同 4443 區塊。
    location /router/ {
        include /etc/nginx/snippets/router-posture.conf;
    }

    # ─────────────────────────────────────────────
    # /static + /uploads — shared workflow assets (see share/README.md).
    # /static is read-only (templates, icons referenced by n8n workflows),
    # /uploads is read-write (user uploads, embedding sources).
    # try_files $uri =404 — don't fall back to the SPA when an asset is missing.
    # ─────────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/share-files/static/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /uploads/ingestion/ {
        return 404;
    }

    location ^~ /uploads/flux/ {
        auth_request /_anila_auth/card-session;
        alias /usr/share/nginx/share-files/uploads/flux/;
        try_files $uri =404;
        expires off;

        # A location-level add_header stops inheriting the server-level set,
        # so repeat the security headers that matter for private uploads.
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    location /uploads/ {
        auth_request /_anila_auth/card-session;
        alias /usr/share/nginx/share-files/uploads/;
        try_files $uri =404;
        expires off;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    # 前端 SPA + 其他路由（fallback to CSP backend）
    # ─────────────────────────────────────────────
    location / {
        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────────────
    # 隱藏檔案拒絕存取
    # ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ── HTTPS Server（port 4443）─ ANILA UI 入口 ──────────────────────
# Same-origin proxy for ANILA UI (React): serves static files and
# proxies /api/, /v1/, /v2/ to csp_backend and /router/ to router_backend
# (prefix stripped). ANILA UI is built with empty VITE_CSP_BASE_URL and
# VITE_ROUTER_BASE_URL=/router so every call becomes same-origin.
server {
    listen 4443 ssl;
    http2 on;
    server_name _;

    # Tool hostnames are deliberately rejected on every CSP-bearing port.
    if ($is_anila_ui_host = 0) { return 444; }

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache   shared:SSL_ANILA:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100M;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # CSP 已收掉 'unsafe-eval' (Vue/React prod build 模板都 pre-compile,不需要動態
    # 程式碼執行)。'unsafe-inline' 暫保留以避免破壞 Vite legacy script bootstrap;
    # 改 nonce-based CSP 留下個 sprint 處理。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Card PKCS#7 verify — narrow rate limit to guard CPU-heavy crypto parse.
    # Exact-match location wins over /api/auth/ prefix for this specific URI.
    location = /api/auth/card/verify {
        limit_req zone=card_verify_limit burst=3 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Auth endpoints (stricter rate limit)
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Same card-session authorization probes as the port-443 ingress.
    # Keep these duplicated: nginx locations are scoped to one server block.
    location = /_anila_auth/card-session {
        internal;
        proxy_pass http://csp_backend/api/auth/proxy-access/card-session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     "";
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /_anila_auth/card-developer {
        internal;
        proxy_pass http://csp_backend/api/auth/proxy-access/card-developer;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     "";
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /_anila_auth/card-admin {
        internal;
        proxy_pass http://csp_backend/api/auth/proxy-access/card-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     "";
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Gate 2 pilot: excluded Studio/artifact API families fail closed.
    location ~ ^/api/(studio|reports|mindmaps|infographics|datatables)/ {
        return 403;
    }

    # General CSP API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # CSP OpenAI-compat data plane (/v1/chat/completions, /v1/embeddings, /v2/embeddings)
    location ~ ^/v[12]/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://csp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_body_buffer_size 10M;
    }

    # ANILA Router (/router/* → router:9000/*)  — prefix stripped by trailing slash
    location /router/ {
        include /etc/nginx/snippets/router-posture.conf;
    }

    # No active developer-tool content may execute on the CSP/ANILA origin.
    location ~ ^/(?:codeserver|n8n|gitlab)(?:/|$) {
        return 404;
    }

    # ─────────────────────────────────────────────
    # ANILA LM — same configuration as the port-443 block.
    # ─────────────────────────────────────────────
    location = /anilalm {
        return 301 $scheme://$http_host$request_uri/;
    }

    location /anilalm {
        set $anilalm_addr "anilalm:80";
        proxy_pass http://$anilalm_addr;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────────────
    # /static + /uploads — shared workflow assets (see share/README.md).
    # /static is read-only (templates, icons referenced by n8n workflows),
    # /uploads is read-write (user uploads, embedding sources).
    # try_files $uri =404 — don't fall back to the SPA when an asset is missing.
    # ─────────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/share-files/static/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /uploads/ingestion/ {
        return 404;
    }

    location ^~ /uploads/flux/ {
        auth_request /_anila_auth/card-session;
        alias /usr/share/nginx/share-files/uploads/flux/;
        try_files $uri =404;
        expires off;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    location /uploads/ {
        auth_request /_anila_auth/card-session;
        alias /usr/share/nginx/share-files/uploads/;
        try_files $uri =404;
        expires off;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    # branch SSO: 4443 port 是 anila-ui dedicated entry，但 /login 必須在
    # myCSPPlatform Vue SPA (在 443 port 由 csp_backend serve)。直接 proxy
    # 到 csp_backend 會引發 /assets/ 衝突 (Vue 跟 anila-ui 都用 /assets/，
    # nginx 無法依 hash 區分)，所以改用 302 跨 port redirect 到 443。
    # LoginView 的 ?next=... 會帶 absolute URL with 4443 port，登入完跳回。
    location = /login {
        return 302 https://$host/login$is_args$args;
    }

    # ANILA UI 已搬到 443 同源 /anila(2026-06-11 B 案,SSO cookie 共用)。
    # 4443 保留 listener 給舊書籤/深連結,一律 302 到新家;$request_uri 保路徑
    # (4443/app → /anila/app)。API 路由(上方各 location)維持原樣不受影響。
    location /anila {
        # 已帶 prefix 的連結直接轉到 443,不再疊一層 /anila。
        return 302 $scheme://$host$request_uri;
    }
    location / {
        return 302 $scheme://$host/anila$request_uri;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Developer tools are served only by the isolated hostname blocks below.

# ── n8n isolated origin ───────────────────────────────────────────────────
# Native n8n authentication protects the UI.  Inbound workflow webhooks stay
# disabled until a separately reviewed machine-ingress policy exists.
server {
    listen 443 ssl;
    server_name n8n.ai.ncsist.org.tw;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Block both exact roots and nested unauthenticated workflow inputs.
    # Forms are included because n8n security advisories explicitly identify
    # form-based workflows as an unauthenticated file-access surface.
    # The editor/API remains behind n8n's env-managed native owner login.
    location ~* ^/(?:webhook|webhook-test|webhook-waiting|form|form-test|form-waiting|mcp|mcp-test|mcp-server)(?:/|$) {
        return 404;
    }
    # n8n 2.x MCP OAuth discovery/registration/token endpoints are machine
    # ingress too. Keep them closed until a separately authenticated gateway
    # is reviewed; credential callbacks live under /rest and are unaffected.
    location ~* ^/(?:mcp-oauth|oauth)(?:/|$) {
        return 404;
    }
    location ~* ^/\.well-known/(?:oauth-authorization-server|oauth-protected-resource)(?:/|$) {
        return 404;
    }
    location ~ ^/n8n(?:/|$) { return 404; }

    location / {
        set $n8n_addr "n8n:5678";
        proxy_pass http://$n8n_addr;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host                $http_host;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Server  $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Url-Scheme        $scheme;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ── GitLab isolated origin ────────────────────────────────────────────────
# GitLab's own users/PATs/runner tokens are now on a different origin from
# CSP.  Git CLI may use this native HTTPS endpoint or the dedicated SSH port.
server {
    listen 443 ssl;
    server_name gitlab.ai.ncsist.org.tw;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location ~ ^/gitlab(?:/|$) { return 404; }
    location / {
        set $gitlab_addr "gitlab:8181";
        proxy_pass http://$gitlab_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl   on;
        client_max_body_size 5G;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# ── code-server isolated origin (service is profile-gated) ────────────────
# Its native strong password protects the isolated sandbox.  The CSP origin
# never serves code-server active content, even while this profile is enabled.
server {
    listen 443 ssl;
    server_name code.ai.ncsist.org.tw;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location ~ ^/codeserver(?:/|$) { return 404; }
    location / {
        set $codeserver_addr "codeserver:8080";
        proxy_pass http://$codeserver_addr;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        client_max_body_size 200M;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
