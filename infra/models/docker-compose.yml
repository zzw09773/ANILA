# Independent compose project for ANILA inference workloads.
#
# Goals:
#   * Lifecycle decoupled from the platform stack (repo 根 `docker compose
#     restart csp` 經 root shim compose.yaml,does NOT touch these containers)
#   * No host port exposure — every service uses `expose:` (internal-only)
#     so the host's external NICs cannot reach them; CSP talks via the
#     shared external `anila-models-net` docker network DNS
#   * Mirror the GPU layout previously deployed by
#     /home/aia/c1147259/project/My-OpenAI-Frontend/docker-compose.migration.yml
#     so the cutover is a stop-and-swap, not a redesign
#
# Bootstrap (one-time, on the host):
#     docker network create anila-models-net
#     docker compose restart csp   # CSP joins the net (repo 根,經 root shim)
#
# 目錄佈局 (2026-07 §17.1 重組):
#     models/model/      權重 (ANILA_HF_DIR 預設指這;dev 機放 symlink 也通,不搬)
#     infra/models/      本檔 + src/ (trtllm/triton/proxy 設定)
#
# Day-to-day (建議用 infra/deployment/intranet/model-serve.sh,它會自動 source .env):
#     bash infra/deployment/intranet/model-serve.sh up            # 起預設組
#     bash infra/deployment/intranet/model-serve.sh up gemma4     # 起單一服務
#     bash infra/deployment/intranet/model-serve.sh status|logs gemma4|down
# 等價的裸 compose 指令:
#     docker compose -f infra/models/docker-compose.yml up -d ...
#
# Profiles:
#     (無 profile)        試用機現役組:gpt-oss-20b / gemma4 / nv-embed / flux
#     --profile intranet  內網 H100 新增組:gemma-4-26b-a4b / gemma-4-12b /
#                         gpt-oss-120b asr-decoder (generic vLLM image,權重走 ANILA_HF_DIR)
#
# Endpoint URLs registered in CSP model_registry (走 docker DNS,
# host port 完全沒開):
#     http://gpt-oss-20b:8000/v1
#     http://gemma4:8000/v1
#     http://nv-embed-proxy:8000/v1
#
# Project name "anila-models" 跟平台 "anila-platform" 不同,
# `docker compose down` (在 repo 根目錄) 不會誤殺這邊。

name: anila-models

services:
  # ── LLM 1: gpt-oss-20b on GPU 2 ────────────────────────────────────────────
  # TensorRT-LLM OpenAI-compat server (port 8000 internal). Image / runtime
  # config mirrors My-OpenAI-Frontend/docker-compose.migration.yml as of
  # 2026-05-11 — change carefully and document in the runbook.
  gpt-oss-20b:
    image: tensorrt-llm-hf:1.3.0rc10
    container_name: anila-model-gpt-oss-20b
    environment:
      TZ: Asia/Taipei
      TIKTOKEN_ENCODINGS_BASE: /etc/encodings
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    volumes:
      # 權重 / 設定檔目錄可用 env 覆寫 (路徑不同時設 ANILA_HF_DIR /
      # ANILA_MODELSRC_DIR);預設 = repo 內慣例位置 models/model 與
      # infra/models/src (相對本 compose 檔解析)。
      - ${ANILA_HF_DIR:-../../models/model}/gpt-oss-20b:/workspace/model/gpt-oss-20b
      - ${ANILA_MODELSRC_DIR:-./src}/tensorrtllm-1.2.0rc5-openai-gpt-oss-20b/encodings:/etc/encodings/:ro
      - ${ANILA_MODELSRC_DIR:-./src}/tensorrtllm-1.2.0rc5-openai-gpt-oss-20b:/workspace/src
    working_dir: /workspace
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      trtllm-serve /workspace/model/gpt-oss-20b
        --extra_llm_api_options /workspace/src/gpt-oss-20b-throughput.yaml
        --kv_cache_free_gpu_memory_fraction 0.5
        --host 0.0.0.0
        --port 8000
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s

  # ── LLM 2: gemma-4-31B-it + MTP drafter on GPU 3 ───────────────────────────
  # vLLM OpenAI-compat server; ``served-model-name=gemma4`` so the CSP
  # model_registry can register the row as ``gemma4`` and have the agent /
  # router fan-out keep the same id everywhere.
  #
  # MTP (Multi-Token Prediction) speculative decoding — 2026-05-05 release:
  #   * Google 發佈了 ``gemma-4-31B-it-assistant`` 小頭模型,跟 target 共用
  #     KV cache,實測 1.7–2.2× 加速 (conversational > code)。
  #   * 需要 vLLM ≥ 0.18 含 PR #41745 (Gemma4 MTP spec-decode 支援)。
  #     若 ``vllm-gemma4:latest`` 是舊版,啟動會報 ``unknown speculative
  #     method 'mtp'`` 直接退出 — rebuild image 升 vLLM 即可。
  #   * Offline 模式 (HF_HUB_OFFLINE=1) 不能讓 vLLM 自己去 HF 抓 assistant,
  #     一次性下載到本機 (放 ANILA_HF_DIR,預設 models/model/):
  #         hf download google/gemma-4-31B-it-assistant \
  #             --local-dir models/model/gemma-4-31B-it-assistant
  #   * num_speculative_tokens=4 是 31B 的甜蜜點 (官方 recipe);拉太大
  #     reject rate 會升高,反而變慢。
  gemma4:
    image: vllm-gemma4:latest
    container_name: anila-model-gemma4
    environment:
      TZ: Asia/Taipei
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      # vLLM ≥0.21 預設啟用 CUDA graph memory profiler,會額外保留 ~0.92 GiB
      # 並從 KV cache budget 扣掉。我們需要保留 131072 context, 改為關掉 profiler
      # 把這 0.92 GiB 還給 KV cache (代價: 大 batch 動態擴 CUDA graph 時可能 OOM)。
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    volumes:
      # assistant = MTP 投機解碼的 draft model (--speculative-config 指向它),
      # 跟主模型一樣是必帶的權重,缺了 vLLM 用這份設定起不來。
      - ${ANILA_HF_DIR:-../../models/model}/gemma-4-31B-it:/workspace/model/gemma-4-31B-it
      - ${ANILA_HF_DIR:-../../models/model}/gemma-4-31B-it-assistant:/workspace/model/gemma-4-31B-it-assistant
    working_dir: /workspace
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    shm_size: 64g
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      --model /workspace/model/gemma-4-31B-it
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --dtype bfloat16
      --max-model-len 131072
      --gpu-memory-utilization 0.97
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --served-model-name gemma4
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --reasoning-parser gemma4
      --speculative-config '{"method":"mtp","model":"/workspace/model/gemma-4-31B-it-assistant","num_speculative_tokens":2}'
      --default-chat-template-kwargs '{"enable_thinking": true}'
      --override-generation-config '{"skip_special_tokens": false}'
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ── Embedding backend: Triton on GPU 0 (no expose, fully internal) ─────────
  # CSP doesn't speak Triton protocol — only the `nv-embed-proxy` sibling
  # below talks to it via internal DNS. Triton therefore has neither
  # `expose:` nor `ports:`; it's reachable only by container-to-container
  # traffic inside the `anila-models-net` network.
  nv-embed-triton:
    image: tritonserver:25.04-nv-embed-v2
    container_name: anila-model-nv-embed-triton
    environment:
      TZ: Asia/Taipei
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${ANILA_HF_DIR:-../../models/model}/NV-Embed-v2:/workspace/model/NV-Embed-v2
      - ${ANILA_MODELSRC_DIR:-./src}/tritonserver-25.04-nv-embed-v2/repository:/workspace/repository
      - ${ANILA_MODELSRC_DIR:-./src}/tritonserver-25.04-nv-embed-v2:/workspace/src
    working_dir: /workspace
    # 沒 expose 也沒 ports — 完全 cluster-internal,讓 attack surface 更小
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command: >
      tritonserver --model-repository=/workspace/repository
                   --model-control-mode=poll
                   --repository-poll-secs=1
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v2/health/ready > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ── Embedding FastAPI shim (OpenAI /v1/embeddings front for Triton) ────────
  # This is what CSP actually registers. Bridges OpenAI v1 embeddings shape
  # to Triton's protocol via the internal `nv-embed-triton` hostname.
  nv-embed-proxy:
    image: embedding-proxy:migration
    container_name: anila-model-nv-embed-proxy
    build:
      # 已 vendor 進 repo (原始出處 My-OpenAI-Frontend/embedding_proxy),
      # 內網無外部依賴即可 rebuild。
      context: ./src/embedding_proxy
    environment:
      TZ: Asia/Taipei
      TRITON_URL: http://nv-embed-triton:8000
      MODEL_NAME: nv-embed-v2
      REQUEST_TIMEOUT: "60"
    expose:
      - "8000"
    depends_on:
      nv-embed-triton:
        condition: service_healthy
    restart: unless-stopped
    networks: [models]
    healthcheck:
      # embedding-proxy image 沒有 curl — 之前用 curl 導致 exit 127,
      # 「unhealthy 四週」其實是誤報(R2 演練 2026-06-11 查明,服務一直正常)。
      # 照 flux2-dev-agent 的 python urllib 寫法。
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Image generation: FLUX.2-dev on GPU 1 + GPU 2 ─────────────────────────
  # bf16 dual-H100 via diffusers Flux2Pipeline (device_map="balanced").
  # No host port — agent shim is the only client. Soldier-facing UX
  # never sees this service directly; chat 走 router → DISPATCH:image-generator
  # → CSP proxy → flux2-dev-agent → flux2-dev.
  #
  # License caveat: black-forest-labs/FLUX.2-dev is BFL Non-Commercial.
  # Confirm authorization before enabling in production.
  flux2-dev:
    image: flux2-dev:bf16
    container_name: anila-model-flux2-dev
    build:
      context: ../../services/flux2-dev
    environment:
      TZ: Asia/Taipei
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      FLUX_MODEL_PATH: /workspace/model/FLUX.2-dev
      FLUX_DEVICE_MAP: balanced
      FLUX_NUM_STEPS: "28"
      FLUX_GUIDANCE_SCALE: "3.5"
    volumes:
      - ${ANILA_HF_DIR:-../../models/model}/FLUX.2-dev:/workspace/model/FLUX.2-dev:ro
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1", "2"]
              capabilities: [gpu]
    shm_size: 32g
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # ── Image generation agent shim (OpenAI compat front for flux2-dev) ───────
  # CSP registers THIS as the agent endpoint (model_type=agent). When
  # gemma4 emits DISPATCH:image-generator:..., CSP forwards the request
  # here. Shim handles prompt translation (zh→en via gemma4 callback)
  # and image persistence; binds /share/flux from share/uploads/flux.
  flux2-dev-agent:
    image: anila-flux-agent:latest
    container_name: anila-model-flux2-dev-agent
    build:
      context: ../../services/flux2-dev-agent
    environment:
      TZ: Asia/Taipei
      FLUX_BACKEND_URL: http://flux2-dev:8000
      CSP_BASE_URL: http://csp:8000
      # Prod: 同 csp service,缺值 fail-loud(不要走 dev fallback)。
      CSP_API_KEY: ${INTERNAL_PLATFORM_API_KEY:?INTERNAL_PLATFORM_API_KEY must be set}
      # image-primary 熱抓取用的 s2s token。不用 :? —— compose 解析階段就會
      # 插值,models stack 與平台 stack 常分開起;硬性要求會讓「只起模型、
      # 不起平台」的人整份 compose 掛掉(同 2026-07-30 ASR :? 踩雷)。
      # 空預設 → agent 仍可啟動,但 GET /api/models/image-primary 會 401,
      # fetcher fallback 到 env FLUX_BACKEND_URL(見 image_primary_fetcher)。
      CSP_SERVICE_TOKEN: ${CSP_SERVICE_TOKEN:-}
      GEMMA_MODEL: gemma4
      ENABLE_PROMPT_TRANSLATION: "1"
      SHARE_DIR: /share/flux
      PUBLIC_URL_PREFIX: /uploads/flux
      DEFAULT_ASPECT_RATIO: "16:9"
      FLUX_TIMEOUT_SECONDS: "240"
    volumes:
      # 相對路徑以本 compose 檔所在目錄 (infra/models/) 解析 →
      # repo 一起搬就通,不用再釘 host 絕對路徑。
      - ../../share/uploads/flux:/share/flux
    expose:
      - "8000"
    depends_on:
      flux2-dev:
        condition: service_healthy
    restart: unless-stopped
    networks: [models]
    healthcheck:
      # Agent image is python:3.11-slim and has no curl in PATH. Use urllib.
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ════════════════════════════════════════════════════════════════════════
  # 內網 H100 新增組 (profile: intranet) — 2026-06 模型清單
  # 統一用 generic vLLM image (toolkit 帶進去的 v0.22.1-cu129),權重從
  # ANILA_HF_DIR 掛。GPU 編號用 env 覆寫對應內網主機的實際配置。
  # 起法: bash infra/deployment/intranet/model-serve.sh up intranet
  # ════════════════════════════════════════════════════════════════════════

  # ── gemma-4-26B-A4B (MoE, ~48G bf16, 單卡) ────────────────────────────────
  gemma-4-26b-a4b:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.22.1-cu129-ubuntu2404}
    container_name: anila-model-gemma-4-26b-a4b
    profiles: ["intranet"]
    environment:
      TZ: Asia/Taipei
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    volumes:
      - ${ANILA_HF_DIR:-../../models/model}/gemma-4-26B-A4B:/workspace/model/gemma-4-26B-A4B:ro
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GEMMA_A4B_GPU:-1}"]
              capabilities: [gpu]
    shm_size: 32g
    ipc: host
    command: >
      --model /workspace/model/gemma-4-26B-A4B
      --host 0.0.0.0 --port 8000
      --served-model-name gemma-4-26B-A4B
      --kv-cache-dtype fp8
      --enable-prefix-caching
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ── gemma-4-12B (~22G bf16, 單卡) ─────────────────────────────────────────
  gemma-4-12b:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.22.1-cu129-ubuntu2404}
    container_name: anila-model-gemma-4-12b
    profiles: ["intranet"]
    environment:
      TZ: Asia/Taipei
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    volumes:
      - ${ANILA_HF_DIR:-../../models/model}/gemma-4-12B:/workspace/model/gemma-4-12B:ro
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GEMMA_12B_GPU:-2}"]
              capabilities: [gpu]
    shm_size: 16g
    ipc: host
    command: >
      --model /workspace/model/gemma-4-12B
      --host 0.0.0.0 --port 8000
      --served-model-name gemma-4-12B
      --kv-cache-dtype fp8
      --enable-prefix-caching
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── gpt-oss-120b (原生 MXFP4 ~63G, 單卡;vLLM 在 Hopper 有 MXFP4 kernel) ──
  gpt-oss-120b:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.22.1-cu129-ubuntu2404}
    container_name: anila-model-gpt-oss-120b
    profiles: ["intranet"]
    environment:
      TZ: Asia/Taipei
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    volumes:
      - ${ANILA_HF_DIR:-../../models/model}/gpt-oss-120b:/workspace/model/gpt-oss-120b:ro
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPT_OSS_120B_GPU:-3}"]
              capabilities: [gpu]
    shm_size: 32g
    ipc: host
    command: >
      --model /workspace/model/gpt-oss-120b
      --host 0.0.0.0 --port 8000
      --served-model-name gpt-oss-120b
      --enable-prefix-caching
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ── 語音辨識解碼器 (faster-whisper) ───────────────────────────────────────
  # 平台的 asr-gateway 走 anila-models-net 打這裡。decoder 無狀態 —— 切句/認證/WS
  # 全在 gateway。音訊只在記憶體流轉,不寫檔。
  #
  # ⚠ ASR_GPU 請指向一張沒有 LLM 在跑的卡。
  # ⚠ H100 / V100 都用 float16(Volta 無 int8 tensor core,int8 反而更慢)。
  asr-decoder:
    image: asr-decoder:0.1.0
    container_name: anila-model-asr-decoder
    build:
      context: ../../services/asr-decoder
    profiles: ["intranet"]
    environment:
      TZ: Asia/Taipei
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      ASR_LOCAL_FILES_ONLY: "1"
      ASR_MODEL_DIR: /workspace/model/faster-whisper-large-v3
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-large-v3}
      ASR_DEVICE: cuda
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-float16}
      ASR_DECODER_TOKEN: ${ASR_DECODER_TOKEN:?ASR_DECODER_TOKEN must be set (openssl rand -hex 32)}
    volumes:
      - ${ANILA_HF_DIR:-../../models/model}/faster-whisper-large-v3:/workspace/model/faster-whisper-large-v3:ro
    expose:
      - "9000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU:-0}"]
              capabilities: [gpu]
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  models:
    external: true
    name: anila-models-net
