name: Gate 1 required CI

on:
  pull_request:
    branches:
      - main
      - prod-intranet-card
  push:
    branches:
      - main
      - prod-intranet-card
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  governance:
    name: Test and capability governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governance test dependencies
        run: |
          python -m pip install pytest cryptography pyyaml
          python -m pip install -e ./packages/anila-contracts \
            -e ./packages/anila-security \
            -e './packages/anila-core[dev]'

      - name: Validate F1/F3 suite and quarantine registry
        run: |
          python infra/ci/check_gate1_test_governance.py
          python -m unittest discover -s infra/ci/tests -v
          python -m pytest infra/ci/test_lint_zh_tw.py -q

      - name: Test capability-freeze policy
        run: python -m unittest infra.policy.tests.test_gate1_capability_freeze -v

      - name: Prove Gate 2 signed-pilot policy and disabled template
        run: |
          python infra/policy/gate2/check_pilot_inference_profile.py \
            --inventory infra/policy/gate2/inference-callsites.v1.json \
            --profile infra/policy/gate2/pilot-profile.disabled-template.json \
            --allow-disabled-template
          python -m pytest infra/policy/tests/test_gate2_pilot_inference_profile.py -q

      - name: Enforce capability freeze against trusted PR base
        if: github.event_name == 'pull_request'
        run: >-
          python infra/policy/gate1/check_capability_freeze.py
          --base-ref "origin/${{ github.base_ref }}"
          --bootstrap-if-missing

      - name: Enforce capability freeze
        if: github.event_name != 'pull_request'
        run: python infra/policy/gate1/check_capability_freeze.py

  deployment-posture:
    name: Deployment / image-lock posture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment-contract dependencies
        run: python -m pip install cryptography pyyaml

      - name: Validate deployment shell syntax
        run: |
          set -euo pipefail
          for script in infra/deployment/scripts/*.sh infra/deployment/intranet/*.sh infra/ci/*.sh; do
            bash -n "$script"
          done

      - name: Verify formal Compose image-lock wiring
        run: python infra/deployment/scripts/verify-compose-image-lock.py check-wiring

      - name: Run complete deployment contracts
        run: python -m unittest discover -s infra/deployment/tests -v

  contract-smoke:
    name: Contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: gate1-ci-only-secret-key-0123456789abcdef
      PYTHONPATH: services/csp:packages/anila-core/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local contract, security, core, and CSP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/anila-contracts[dev]"
          python -m pip install -e "./packages/anila-security[dev]"
          python -m pip install -e "./packages/anila-core[dev]"
          python -m pip install -r services/csp/requirements-dev.txt

      - name: Run standalone package contracts
        run: |
          python -m pytest packages/anila-contracts/tests packages/anila-security/tests -q
          python -m ruff check packages/anila-contracts/src packages/anila-contracts/tests
          python -m ruff check packages/anila-security

      - name: Require G1 writer source contract and consumer compatibility
        run: |
          python -m pytest packages/anila-core/tests/test_contracts_facade.py packages/anila-core/tests/test_url_guard_kind_split.py -q
          python -m unittest infra.policy.tests.test_gate2_classification_reconciliation -v
          python -m unittest infra.policy.tests.test_gate2_retrieval_governance -v
          cd services/csp
          python -m pytest tests/test_anila_contracts_package.py tests/test_url_guard_opt_in.py tests/test_url_guard_providers.py -q

  backend-core:
    name: Backend / anila-core unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/anila-contracts"
          python -m pip install -e "./packages/anila-security"
          python -m pip install -e "./packages/anila-core[dev,rag]"

      - name: Run unit suite
        working-directory: packages/anila-core
        run: python -m pytest --ignore=tests/integration tests -q

  backend-agent:
    name: Backend / anila-agent unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/anila-contracts" -e "./packages/anila-agent[dev,serving,pgvector,csp]"

      - name: Run deterministic unit suite
        working-directory: packages/anila-agent
        run: python -m pytest -m "not live" -q

      - name: Run strict type check
        working-directory: packages/anila-agent
        run: python -m mypy anila_agent

  backend-ingestion:
    name: Backend / ingestion-worker unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/anila-contracts"
          python -m pip install -e "./packages/anila-security"
          python -m pip install -e "./packages/anila-core[rag]"
          python -m pip install -e "./services/ingestion-worker[dev]"

      - name: Run worker suite
        working-directory: services/ingestion-worker
        run: python -m pytest tests -q

  backend-csp:
    name: Backend / CSP full suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: gate1-ci-only-secret-key-0123456789abcdef
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local packages and CSP test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e "./packages/anila-contracts" \
            -e "./packages/anila-security" \
            -e "./packages/anila-core[rag]" \
            -e "./packages/anila-agent"
          python -m pip install -r services/csp/requirements-dev.txt

      - name: Run complete CSP suite
        working-directory: services/csp
        run: python -m pytest -q

      # W2-12:API 契約產出物必須與程式碼同步,且 response_model 覆蓋率只准升。
      # CSP 的 /openapi.json 被 require_admin 鎖住(這是對的),副作用是 review
      # 時看不到 API 形狀改了什麼 —— 這支把 schema diff 變成 PR 內可見的東西。
      # 不同步、或缺 response_model 的 endpoint 數上升,都 exit 1。
      - name: Check OpenAPI artifact and response_model ratchet
        run: python scripts/export-openapi.py --check

  postgres-rls:
    name: Backend / PostgreSQL RLS
    needs: [contract-smoke, backend-core, backend-ingestion, backend-csp]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: gate1-ci-only-secret-key-0123456789abcdef
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: csp
          POSTGRES_USER: csp
          POSTGRES_PASSWORD: gate1-admin-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csp -d csp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install migration and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/anila-contracts"
          python -m pip install -e "./packages/anila-security"
          python -m pip install -e "./packages/anila-core[dev]"
          python -m pip install -e "./services/ingestion-worker[dev]"
          python -m pip install -r services/csp/requirements-dev.txt

      - name: Require a single Alembic head
        working-directory: services/csp
        run: |
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads(); assert len(heads) == 1, f'expected one Alembic head, got {heads}'"
          python -m alembic heads

      - name: Migrate fresh PostgreSQL to Alembic head
        working-directory: services/csp
        env:
          MIGRATION_DATABASE_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          DATABASE_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          CSP_APP_DB_PASSWORD: gate1-app-db
          PYTHONPATH: .
        run: python -m alembic upgrade head

      # W0-1:這一步刻意緊接在 `alembic upgrade head` 之後 —— 這裡的 PG 是
      # **乾淨庫 + 只跑過 migration chain**,所以此處的 drift 結果就是
      # 「migration chain 到底產不產得出可用 schema」的權威答案。
      #
      # 為什麼需要:`startup_migrations.py` 是 alembic 之外的第二套 schema 機制
      # (覆蓋 8 張表),於是 alembic 單獨跑不出正確 schema —— DR 還原路徑因此
      # 是壞的。而測試用 SQLite + create_all,驗證迴路結構上看不見這件事。
      # 對本機 dev 庫實測抓到 15 項,其中 4 項是人工稽核沒發現的
      # (document_relations / ingestion_documents / ingestion_document_generations
      # 的 FK 短缺、registered_services.slug 與 tasks.trace_id 缺 UNIQUE)。
      - name: ORM ↔ PostgreSQL schema drift (migration chain 自足性)
        env:
          PYTHONPATH: services/csp
        run: |
          # ⚠ 不可寫成 `python … || echo "::warning::"`。第一版就是那樣,結果腳本以
          # `ModuleNotFoundError: No module named 'psycopg'` crash(DSN 誤用了
          # psycopg3 driver,而本 job 裝的是 psycopg2),而那個 `||` 把 traceback
          # 一起吞掉 —— job 顯示通過、看起來像「有 drift 但已知」,實際上**檢查
          # 從來沒跑成**。這正是「吞掉錯誤讓紅燈變綠燈」。
          #
          # 所以:腳本用 exit 3 表示「有發現」、exit 1 表示「檢查本身壞了」,
          # 這裡只把 3 降級成 warning,其餘一律 fail。
          set +e
          python infra/ci/check_orm_pg_drift.py --mode drift \
            --dsn "postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp"
          rc=$?
          set -e
          case "$rc" in
            0) echo "ORM↔PG schema 無漂移" ;;
            3) echo "::warning::ORM↔PG drift 存在(見上方清單);W2-6 把 startup DDL 折回 alembic 後此步應轉為硬性 fail" ;;
            *) echo "::error::drift 檢查本身失敗(exit $rc)—— 這不是「有 drift」,是這支檢查不可信"; exit "$rc" ;;
          esac

      - name: naive DateTime 政策斷言(ratchet)
        run: |
          set +e
          python infra/ci/check_orm_pg_drift.py --mode policy
          rc=$?
          set -e
          case "$rc" in
            0) echo "naive DateTime 未新增" ;;
            3) echo "::error::新增了 naive DateTime 欄(見上方清單)"; exit 1 ;;
            *) echo "::error::政策斷言本身失敗(exit $rc)"; exit "$rc" ;;
          esac

      - name: Prove RLS and mutation sensitivity with app and admin roles
        working-directory: packages/anila-core
        env:
          ANILA_REQUIRE_RLS_TESTS: "1"
          INTEGRATION_DB_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          INTEGRATION_ADMIN_DB_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
        run: python -m pytest tests/integration -q

      - name: Prove Gate 2 classification reconciliation and mutation sensitivity
        env:
          MIGRATION_DATABASE_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          ANILA_GATE2_TEST_PG_ADMIN_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/postgres
          PYTHONPATH: services/csp
        run: |
          python infra/policy/gate2/check_classification_reconciliation.py --sample-size 0
          python -m pytest infra/policy/tests/test_gate2_classification_reconciliation_pg.py -q

      - name: Prove Gate 2 runtime classification invariants on PostgreSQL
        env:
          ANILA_GATE2_TEST_PG_ADMIN_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/postgres
        run: python -m pytest infra/policy/tests/test_gate2_runtime_classification_invariants_pg.py -q

      - name: Prove Gate 2 SourceSnapshot and Citation sealing on PostgreSQL
        env:
          ANILA_GATE2_TEST_PG_ADMIN_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/postgres
          PYTHONPATH: services/csp
        run: python -m pytest services/csp/tests/test_gate2_source_snapshot_sealing_pg.py -q

      - name: Prove Gate 2 memory classification governance on PostgreSQL
        working-directory: services/csp
        env:
          GATE2_MEMORY_PG_DSN: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: python -m pytest tests/test_gate2_memory_governance_pg.py -q

      - name: Prove Gate 2 transaction-ledger atomicity on PostgreSQL
        working-directory: services/csp
        env:
          ANILA_GATE2_LEDGER_PG_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: >-
          python -m pytest
          tests/test_gate2_transaction_ledger_pg.py
          tests/test_gate2_classification_latch_pg.py
          tests/test_gate2_pg_atomicity.py
          -q

      - name: Prove Gate 2 classification latch races on PostgreSQL
        working-directory: services/csp
        env:
          ANILA_GATE2_CLASSIFICATION_PG_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: python -m pytest tests/test_gate2_classification_latch_pg.py -q

      - name: Prove Gate 3 retention and artifact upload races on PostgreSQL
        working-directory: services/csp
        env:
          ANILA_GATE3_RETENTION_PG_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: python -m pytest tests/test_gate3_retention_upload_pg.py -q

      - name: Prove Gate 3 ingestion generation migration and backfill
        env:
          ANILA_GATE3_TEST_PG_ADMIN_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/postgres
        run: python -m pytest services/csp/tests/test_ingestion_generations_pg.py -q

      - name: Prove Gate 3 worker lease, DLQ, and similarity concurrency
        env:
          ANILA_JOB_STATE_PG_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/gate3_worker_ci
          ANILA_JOB_STATE_PG_ADMIN_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/gate3_worker_ci
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://csp:gate1-admin-db@127.0.0.1:5432/postgres"
              )
              try:
                  await connection.execute(
                      "DROP DATABASE IF EXISTS gate3_worker_ci WITH (FORCE)"
                  )
                  await connection.execute("CREATE DATABASE gate3_worker_ci")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
          python -m pytest \
            services/ingestion-worker/tests/test_job_state_pg.py \
            -q --junitxml=/tmp/gate3-worker-lease.xml
          python - <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("/tmp/gate3-worker-lease.xml")
          try:
              root = ET.parse(report).getroot()
          except (OSError, ET.ParseError) as exc:
              print("Gate 3 PostgreSQL lease JUnit report is missing or invalid", file=sys.stderr)
              raise SystemExit(1) from exc
          cases = root.findall(".//testcase")
          expected_cases = {
              ("tests.test_job_state_pg", "test_claim_is_single_owner_and_stale_attempt_cannot_reopen_terminal"),
              ("tests.test_job_state_pg", "test_reaper_skips_valid_lease_and_recovers_expired_once"),
              ("tests.test_job_state_pg", "test_reaper_honours_grace_before_recovering_stale_owner"),
              ("tests.test_job_state_pg", "test_retryable_failure_schedules_durable_attempt_and_permanent_stops"),
              ("tests.test_job_state_pg", "test_retry_exhaustion_is_one_dead_letter_and_has_no_stuck_lease"),
              ("tests.test_job_state_pg", "test_fail_or_retry_terminal_status_cast_avoids_ambiguous_parameter"),
              ("tests.test_job_state_pg", "test_terminal_write_db_outage_is_fail_loud_then_reaper_recovers"),
          }
          case_ids = [(case.get("classname"), case.get("name")) for case in cases]
          skipped = [case for case in cases if case.find("skipped") is not None]
          failures = [case for case in cases if case.find("failure") is not None]
          errors = [case for case in cases if case.find("error") is not None]
          if len(cases) != 7:
              print("Gate 3 PostgreSQL lease suite expected exactly 7 tests", file=sys.stderr)
              raise SystemExit(1)
          if len(case_ids) != len(set(case_ids)):
              print("Gate 3 PostgreSQL lease suite contains duplicate testcase identities", file=sys.stderr)
              raise SystemExit(1)
          if set(case_ids) != expected_cases:
              print("Gate 3 PostgreSQL lease suite does not match exact testcase identities", file=sys.stderr)
              raise SystemExit(1)
          if skipped:
              print("Gate 3 PostgreSQL lease suite contains skipped tests", file=sys.stderr)
              raise SystemExit(1)
          if failures:
              print("Gate 3 PostgreSQL lease suite contains failed tests", file=sys.stderr)
              raise SystemExit(1)
          if errors:
              print("Gate 3 PostgreSQL lease suite contains errored tests", file=sys.stderr)
              raise SystemExit(1)
          PY
          python -m pytest \
            services/ingestion-worker/tests/test_similarity_relations_pg.py \
            -q --junitxml=/tmp/gate3-similarity-relations.xml
          python - <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("/tmp/gate3-similarity-relations.xml")
          try:
              root = ET.parse(report).getroot()
          except (OSError, ET.ParseError) as exc:
              print("Gate 3 similarity JUnit report is missing or invalid", file=sys.stderr)
              raise SystemExit(1) from exc
          cases = root.findall(".//testcase")
          expected_cases = {
              ("tests.test_similarity_relations_pg", "test_concurrent_requests_dedupe_to_one_monotonic_row"),
              ("tests.test_similarity_relations_pg", "test_concurrent_claim_has_one_owner_and_new_request_becomes_followup"),
              ("tests.test_similarity_relations_pg", "test_expired_lease_is_recovered_once"),
              ("tests.test_similarity_relations_pg", "test_expired_owner_is_fenced_before_relation_mutation"),
          }
          case_ids = [(case.get("classname"), case.get("name")) for case in cases]
          skipped = [case for case in cases if case.find("skipped") is not None]
          failures = [case for case in cases if case.find("failure") is not None]
          errors = [case for case in cases if case.find("error") is not None]
          if len(cases) != 4:
              print("Gate 3 similarity suite expected exactly 4 tests", file=sys.stderr)
              raise SystemExit(1)
          if len(case_ids) != len(set(case_ids)):
              print("Gate 3 similarity suite contains duplicate testcase identities", file=sys.stderr)
              raise SystemExit(1)
          if set(case_ids) != expected_cases:
              print("Gate 3 similarity suite does not match exact testcase identities", file=sys.stderr)
              raise SystemExit(1)
          if skipped:
              print("Gate 3 similarity suite contains skipped tests", file=sys.stderr)
              raise SystemExit(1)
          if failures:
              print("Gate 3 similarity suite contains failed tests", file=sys.stderr)
              raise SystemExit(1)
          if errors:
              print("Gate 3 similarity suite contains errored tests", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Prove Gate 2 durable usage and Full Trace closure on PostgreSQL
        working-directory: services/csp
        env:
          ANILA_GATE2_LEDGER_PG_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: python -m pytest tests/test_gate2_durable_usage_closure_pg.py -q

      - name: Run CSP ingestion-image RLS contract
        working-directory: services/csp
        env:
          ANILA_TEST_PG_DSN: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          DATABASE_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: python -m pytest tests/test_ingestion_images_rls_pg.py -q

      - name: Run Gate 2 auth concurrency and migration contracts
        working-directory: services/csp
        env:
          ANILA_TEST_PG_DSN: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: python -m pytest tests/test_gate2_auth_races_pg.py -q

      - name: Prove Gate 5 durable resume claim concurrency on PostgreSQL
        working-directory: services/csp
        env:
          TEST_POSTGRES_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          DATABASE_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: python -m pytest tests/test_gate5_r5_durable_resume_authority.py -q -m integration

      # W0-2:這兩支是 12 個 `_pg` 測試檔裡 CI 唯一沒點名的兩支。
      # 其餘 10 支既有 job 已逐檔涵蓋(所以「CI 沒有真 PG 路徑」的說法是錯的,
      # 真缺口只有這兩支 + drift 檢查沒接上)。
      #
      # ⚠ 環境變數名稱必須與測試實際讀的一致 —— 第一版設了
      # `MIGRATION_DATABASE_URL` 與 `ANILA_GATE2_TEST_PG_ADMIN_URL`,而這兩支讀的
      # 是 `ANILA_GATE2_LEDGER_PG_URL`(receipts,整檔 skipif)與
      # `TEST_DATABASE_URL`/`DATABASE_URL`(session event store,fixture 內
      # pytest.skip)。結果兩支全 skip,**而 pytest 全 skip 時仍回 exit 0** ——
      # 這個步驟因此宣稱跑了 Gate 5 race proofs 但實際一條都沒跑。
      # 由 PR #52 的 Codex review 抓到。
      #
      # 所以除了修變數名,還必須**讓「全部 skip」算失敗** —— 否則變數名哪天再
      # 漂掉,又會回到「沉默看起來像成功」。
      - name: Prove Gate 5 receipts and session event store on PostgreSQL
        working-directory: services/csp
        env:
          ANILA_GATE2_LEDGER_PG_URL: postgresql://csp_app:gate1-app-db@127.0.0.1:5432/csp
          TEST_DATABASE_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          MIGRATION_DATABASE_URL: postgresql://csp:gate1-admin-db@127.0.0.1:5432/csp
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m pytest tests/test_gate5_model_governance_receipts_pg.py \
                           tests/test_gate5_r4_session_event_store_pg.py \
                           -q --no-header -rs | tee /tmp/gate5-pg.log
          if ! grep -qE "[0-9]+ passed" /tmp/gate5-pg.log; then
            echo "::error::Gate 5 PG 測試沒有任何一支真的執行(全部 skipped)。"
            echo "::error::pytest 在全 skip 時回 exit 0,所以綠燈不代表跑過 ——"
            echo "::error::請檢查上方 skip 理由與本步驟的 DSN 環境變數名稱是否仍相符。"
            exit 1
          fi

  frontend-governance:
    name: Frontend / CSP governance UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/csp-governance-ui/package-lock.json
      - name: Install, lint, test, and build
        working-directory: apps/csp-governance-ui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  frontend-shell:
    name: Frontend / ANILA Shell (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # W0-6③:node matrix。原本只跑 node 20,而 Node ≥22 內建的實驗性
    # `localStorage` global 會蓋掉 jsdom 那份且方法全缺 —— 於是 8 個用
    # localStorage 的源碼檔在開發者本機(通常較新 node)的持久化路徑
    # 從來沒被真的執行過,而 CI 鎖 20 所以**結構上永遠看不到**。
    # 「開發者本機紅、CI 綠」是最消耗信任的狀態,加 22 這條腿把它關掉。
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/anila-shell/package-lock.json
      - name: Install, lint, test, and build
        working-directory: apps/anila-shell
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm run verify:bundle

  frontend-anilalm:
    name: Frontend / ANILALM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/anilalm/package-lock.json
      - name: Install, lint, typecheck, and test
        working-directory: apps/anilalm
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Build normal product posture
        working-directory: apps/anilalm
        env:
          VITE_ANILA_PILOT_MODE: "false"
        run: npm run build

      - name: Build signed-pilot posture
        working-directory: apps/anilalm
        env:
          VITE_ANILA_PILOT_MODE: "true"
        run: npm run build

      # ⚠ 這一步不能省。第一版加了 anilalm 的 `verify:bundle` script 與預算檔,
      # 卻只在 shell 的 job 裡呼叫 —— anilalm 的 bundle 即使超出預算,required CI
      # 仍會通過,ratchet 實際上沒有護欄效果(由 PR #52 的 Codex review 抓到)。
      # 放在 signed-pilot build 之後,量到的是最後一次 build 的產物。
      - name: Enforce bundle budget
        working-directory: apps/anilalm
        run: npm run verify:bundle

  backend-pptx-renderer:
    name: Backend / PPTX renderer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/pptx-renderer/package-lock.json
      - name: Install production dependencies and audit
        working-directory: services/pptx-renderer
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=moderate
      - name: Run renderer contracts against the live HTTP boundary
        working-directory: services/pptx-renderer
        run: |
          set -euo pipefail
          node server.js >renderer.log 2>&1 &
          renderer_pid=$!
          trap 'kill "$renderer_pid" 2>/dev/null || true; cat renderer.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7100/health >/dev/null; then
              break
            fi
            if ! kill -0 "$renderer_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:7100/health >/dev/null
          for test_file in tests/test_*.js; do
            node "$test_file"
          done

  backend-studio-security:
    name: Backend / Studio auth and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Studio test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./services/anila-studio[dev]"
      - name: Run Studio auth and durable revocation contracts
        working-directory: services/anila-studio
        run: >-
          python -m pytest
          tests/test_auth.py
          tests/test_revocation_cache.py
          tests/test_gate2_scoped_revocation_cache.py
          -q

  backend-studio-full:
    name: Backend / Studio full suite and Redis durability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANILA_STUDIO_REDIS_DOCKER_CONTAINER: anila-gate1-studio-redis-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install complete Studio test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./services/anila-studio[dev]"
      - name: Start isolated Redis durability target
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER" \
            --publish 127.0.0.1::6379 \
            redis:7-alpine \
            redis-server --appendonly yes --appendfsync everysec
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER" \
              redis-cli ping | grep --quiet '^PONG$'; then
              ready=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' \
              "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER")" != "true" ]; then
              docker logs "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER"
            exit 1
          fi
          published=$(docker port \
            "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER" 6379/tcp | head -n 1)
          port=${published##*:}
          case "$port" in
            ''|*[!0-9]*) echo "invalid Redis published port: $published" >&2; exit 1 ;;
          esac
          test "$(docker exec "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER" \
            redis-cli --raw CONFIG GET appendonly | tail -n 1)" = "yes"
          test "$(docker exec "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER" \
            redis-cli --raw CONFIG GET appendfsync | tail -n 1)" = "everysec"
          echo "ANILA_STUDIO_REDIS_TEST_URL=redis://127.0.0.1:${port}/0" \
            >> "$GITHUB_ENV"
      - name: Run complete Studio suite
        working-directory: services/anila-studio
        run: python -m pytest tests -q
      - name: Remove isolated Redis durability target
        if: ${{ always() }}
        run: docker rm -f "$ANILA_STUDIO_REDIS_DOCKER_CONTAINER" || true

  backend-flux-agent:
    name: Backend / FLUX agent governed-hop contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
