[project]
name = "asr-gateway"
version = "0.1.0"
description = "ANILA ASR gateway — WebSocket mic stream, VAD segmentation, JWT auth; delegates decode to asr-decoder."
requires-python = ">=3.11"
authors = [
  { name = "ANILA Platform" },
]

dependencies = [
  # Web framework (原生 WebSocket)
  "fastapi>=0.110,<1.0",
  # starlette 下限(不釘死 —— 本服務未直接 import starlette,只是不要讓氣隙
  # wheelhouse 凍進有洞的版本)。
  # ⚠ 2026-08-08 從 `>=1.0.1` 抬到 `>=1.3.1`,連同一段錯的註解一起改:1.0.1
  # 只是 CVE-2026-48710(0.49.3 以下 `request.url` 由呼叫端 `Host` 標頭串接
  # 而成,路徑邊界可被移動)的修補分界,擋不掉後面那些。OSV 逐版比對
  #(2026-08-08 查):1.0.1～1.3.0 每一版都還帶著 CVE-2026-54283(HIGH),
  # 1.3.1 才是第一個乾淨的版本(csp 釘死的也是 1.3.1)。
  # ⚠ 下限仍然不是「驗過的版本」:2026-08-06 實測(當時下限還是 1.0.1)解析到
  # **1.4.1**;0.49.3／1.3.1／1.4.1 三個版本都跑過本服務的測試套件與突變檢查,
  # 結論一致;要往上動之前請重跑,不要假設。
  "starlette>=1.3.1,<1.7",
  "uvicorn[standard]>=0.27,<0.53",
  # HTTP client → asr-decoder / csp(JWKS)
  "httpx>=0.27,<1.0",
  # JWT verify (asymmetric RS256, JWKS) — 對齊 anila-studio
  "python-jose[cryptography]>=3.3,<3.6",
  # Pydantic settings
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  # Redis pub/sub for cross-service token revocation — 對齊 anila-studio
  "redis>=5.0,<8.2",
  # TTL cache for revocation cache — 對齊 anila-studio
  "cachetools>=5.3,<7.2",
  # VAD 切句。純本地 C extension,不下載任何模型(silero 要抓 onnx,air-gap 會炸)。
  # ⚠ 用 -wheels fork 而非原版 `webrtcvad`:原版(2.0.10,已停止維護)在 import
  # 第一行就 `import pkg_resources`,而 setuptools 81+ 已移除 pkg_resources
  # → 在現代環境 import 直接 ModuleNotFoundError(實測 setuptools 83.0.0)。
  # -wheels fork 拿掉了該 import,並提供預編譯 wheel(air-gap 不用在內網編 C)。
  "webrtcvad-wheels>=2.0.14,<2.1",
  # PCM bytes ↔ float32 samples
  "numpy>=1.26,<2.6",
  # ⚠ 刻意不列 opencc:實測 whisper medium 在真實繁中語料的簡體率是 0%,而
  # OpenCC 對正確繁體的誤傷率 6~10%(s2twp 甚至把「類型」轉成「型別」)。
  # 見 docs/planning/asr-voice-input-plan.md §10。ASR_OPENCC_MODE 預設 off;
  # 真的要開再把 opencc-python-reimplemented 加回來。
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<0.25",
  "respx>=0.21,<0.23",          # httpx mock for decode_client tests
  "fakeredis>=2.20,<3.0",      # in-memory Redis for revocation tests
]

[build-system]
requires = ["setuptools>=68,<83", "wheel<0.48"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
