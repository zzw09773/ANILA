[project]
name = "docling-service"
version = "0.1.0"
description = "ANILA docling document parser — layout-aware GPU parse service, reached over HTTP like ASR."
requires-python = ">=3.11,<3.13"
authors = [
  { name = "ANILA Platform" },
]

dependencies = [
  # Web framework（對齊 asr-decoder 的 fastapi/uvicorn/pydantic 組合）
  "fastapi>=0.110,<1.0",
  # starlette 下限對齊 asr-decoder / csp（1.3.1 是第一個無 CVE-2026-54283 的版本）
  "starlette>=1.3.1,<1.7",
  "uvicorn[standard]>=0.27,<0.53",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  # multipart/form-data 的 /parse 需要它;pin 對齊 csp/flux2-dev-agent(0.0.30+ 修 form 問題)。
  "python-multipart==0.0.32",
  # ── docling（這張映像才帶 ipi 權重,平台映像不帶）────────────
  # docling[easyocr] 拉進 easyocr → torch。這台是 GPU 主機的服務,不是平台映像;
  # ⚠ torch 的 CUDA 版要由部署者按 GPU 世代替換 index-url 重裝(見 Dockerfile
  #   註解)。docling 官方在 GPU 主機上也是同樣的要求。
  # ⚠ 版本上限:docling data model 跨版 churn,這台服務吃它最穩定的表面
  #   (document.export_to_markdown / document.pictures)。升級前跑一次
  #   tests/test_parse.py 再動。
  "docling[easyocr]>=2.0,<3.0",
  # picture_description 的 Granite-Vision 是選配(預設 OFF)不進 base;部署者
  # 要開時自己加 [granite]。
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  # TestClient 需要;service 自己不打 HTTP,所以 httpx 不是 runtime 相依。
  "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=68,<83", "wheel<0.48"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
