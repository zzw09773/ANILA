[build-system]
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[project]
name = "ingestion-worker"
version = "0.1.0"
description = "ANILA ingestion-worker — Arq-based async pipeline for parse / chunk / embed / index"
requires-python = ">=3.11"
dependencies = [
    # Core SDK — chunkers + AgentScopedPgVectorStore + error taxonomy.
    # ``[rag]`` extra pulls in the parser stack (pymupdf4llm, python-docx,
    # odfpy, striprtf, Pillow) and is required because handlers.py /
    # evaluator.py call ``anila_core.ingestion.parsers.extract_text``
    # which delegates to ``anila_core.ingestion.parser_registry``.
    "anila-core[rag]>=0.14.0,<0.15",
    #
    # Async DB driver and pgvector codec — also pulled by anila-core, listed
    # explicitly so the worker's deps file documents them.
    "asyncpg>=0.29,<0.32",
    "pgvector>=0.3,<0.6",
    # Arq for the redis-backed job queue. 0.26 is the first version with
    # the Pydantic v2 compatible JobResult model.
    "arq>=0.26,<0.29",
    # HTTP client for the embedding endpoint (OpenAI-compatible).
    "httpx>=0.27,<0.29",
    # Settings via env vars — reuse the same lib anila-core uses so the
    # config style stays consistent across services.
    "pydantic-settings>=2.0,<2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "respx>=0.21,<0.23",
    "ruff>=0.4,<0.16",
    "mypy>=1.9,<1.21",
    # 同 anila-core：pgvector 在 TYPE_CHECKING 裡 import numpy。numpy 2.5
    # 起的 stub 用 Python 3.12 `type` 語句；本服務 mypy python_version 是
    # 3.11，解析那些 stub 會中止整次檢查。鎖在 2.4.x，不把 python_version
    # 抬到 3.12。
    "numpy>=1.26,<2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# anila-core 沒有 py.typed。裝進 site-packages 時 mypy 會把它當成沒有型別，
# 整包 import 都變成 import-untyped。指向 monorepo 原始碼，檢查才看得到
# 真正的註解（anila-core 自己的 mypy 已是 0 錯誤）。
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../packages/anila-core/src"
