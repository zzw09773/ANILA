[project]
name = "flux2-dev"
version = "0.1.0"
requires-python = ">=3.11"
# Note: torch/diffusers are NOT in test deps — tests inject a mocked pipeline
# so we never have to install the GPU stack on the dev box.
dependencies = [
    "fastapi==0.136.1",
    # 與 requirements.txt 同步；1.3.1 修掉 CVE-2026-48710（Host 標頭污染 request.url）。
    "starlette==1.3.1",
    "pydantic==2.9.2",
    "Pillow<13.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "httpx==0.27.2",  # for fastapi TestClient
]

[tool.pytest.ini_options]
pythonpath = ["."]
