[project]
name = "flux2-dev-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    # 與 requirements.txt 同步；1.3.1 修掉 CVE-2026-48710（Host 標頭污染 request.url）。
    "starlette==1.3.1",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "respx==0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
