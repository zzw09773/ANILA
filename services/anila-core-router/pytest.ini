[pytest]
# 這個服務以前沒有測試。加進來的原因:`_gate_on_primary` 是本檔唯一一處
# 從請求推導出來的判斷,2026-08-05 之前它讀 `request.url.path` —— 那是拿
# 呼叫端 `Host` 標頭串接出來的字串,`Host: x/v1` 就能讓比對失準、整個閘門
# 被跳過,而路由照樣把請求送到 chat completions。沒有測試就沒有東西會在
# 有人把它改回去的時候變紅。
#
# rootdir 釘在 services/anila-core-router,`pythonpath = .` 讓 `import main`
# 在兩種 cwd(repo 根 / 本目錄)下都成立。環境變數與 cwd 隔離在
# tests/conftest.py —— `anila_core.config.settings` 的 `.env` 是相對 cwd
# 解析的,從 repo 根跑會吃到機上 `.env` 然後 extra_forbidden 炸掉。
testpaths = tests
pythonpath = .
