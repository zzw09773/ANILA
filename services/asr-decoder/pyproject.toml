[project]
name = "asr-decoder"
version = "0.1.0"
description = "ANILA ASR decoder — stateless faster-whisper GPU decode service behind asr-gateway."
requires-python = ">=3.11"
authors = [
  { name = "ANILA Platform" },
]

dependencies = [
  # Web framework
  "fastapi>=0.110,<1.0",
  # starlette 下限(不釘死 —— 本服務未直接 import starlette,只是不要讓氣隙
  # wheelhouse 凍進有洞的版本)。
  # ⚠ 2026-08-08 從 `>=1.0.1` 抬到 `>=1.3.1`,連同一段錯的註解一起改:1.0.1
  # 只是 CVE-2026-48710(0.49.3 以下 `request.url` 由呼叫端 `Host` 標頭串接
  # 而成,路徑邊界可被移動)的修補分界,擋不掉後面那些。OSV 逐版比對
  #(2026-08-08 查):1.0.1～1.3.0 每一版都還帶著 CVE-2026-54283(HIGH),
  # 1.3.1 才是第一個乾淨的版本(csp 釘死的也是 1.3.1)。
  # ⚠ 下限仍然不是「驗過的版本」:2026-08-06 實測(當時下限還是 1.0.1)解析到
  # **1.4.1**;0.49.3／1.3.1／1.4.1 三個版本都跑過本服務的測試套件與突變檢查,
  # 結論一致;要往上動之前請重跑,不要假設。
  "starlette>=1.3.1,<1.7",
  "uvicorn[standard]>=0.27,<0.53",
  # Pydantic settings (對齊 anila-studio 的 config 形狀)
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  # faster-whisper (CTranslate2 backend)。CT2 4.x 需要 CUDA 12 + cuDNN 9,
  # base image 必須對齊(見 Dockerfile)。
  "faster-whisper>=1.0,<2.0",
  # PCM bytes → float32 samples
  "numpy>=1.26,<2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  # TestClient 需要;decoder 自己不打 HTTP,所以 httpx 不是 runtime 相依。
  "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=68,<83", "wheel<0.48"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
