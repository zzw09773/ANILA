[project]
name = "asr-decoder"
version = "0.1.0"
description = "ANILA ASR decoder — stateless faster-whisper GPU decode service behind asr-gateway."
requires-python = ">=3.11"
authors = [
  { name = "ANILA Platform" },
]

dependencies = [
  # Web framework
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  # Pydantic settings (對齊 anila-studio 的 config 形狀)
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  # faster-whisper (CTranslate2 backend)。CT2 4.x 需要 CUDA 12 + cuDNN 9,
  # base image 必須對齊(見 Dockerfile)。
  "faster-whisper>=1.0,<2.0",
  # PCM bytes → float32 samples
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # TestClient 需要;decoder 自己不打 HTTP,所以 httpx 不是 runtime 相依。
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
