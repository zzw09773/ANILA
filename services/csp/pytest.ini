[pytest]
# 這個檔案的存在本身就是修正。2026-07-31 以前,同一份程式碼從 repo 根目錄跑
# (`pytest services/csp/tests`) 是 27 failed,從 services/csp 跑 (`pytest`) 是
# 14 failed —— 差別全在 cwd 與 PYTHONPATH,不在程式碼。當「基準線」會隨著你
# 站在哪個目錄而改變,它就不是基準線。
#
# pytest 會從 args 往上找 ini 檔,所以上面兩種跑法都會找到本檔,rootdir 一律
# 落在 services/csp,下面的相對路徑因此也一律一致。
#
# pythonpath 讓 PYTHONPATH 環境變數變成非必要:
#   .                          → `app.*` 與 `tests.conftest`
#   ../../packages/anila-core/src → `anila_core.*`
# (SECRET_KEY 那一半在 tests/conftest.py 處理 —— ini 檔設不了環境變數,
#  本樹也沒裝 pytest-env。)
testpaths = tests
pythonpath = . ../../packages/anila-core/src

markers =
    unit: 純函式測試,不碰 DB / 網路
    integration: 走 TestClient + SQLite in-memory 的整合測試
