[project]
name = "anila-studio"
version = "0.1.0"
description = "ANILA Studio service — RAG-driven slide deck generation. Generated images use the governance-center image role via CSP."
requires-python = ">=3.11"
authors = [
  { name = "ANILA Platform" },
]

dependencies = [
  # Web framework
  "fastapi>=0.110,<1.0",
  # starlette 下限(不釘死 —— 本服務未直接 import starlette,只是不要讓氣隙
  # wheelhouse 凍進有洞的版本)。
  # ⚠ 2026-08-08 從 `>=1.0.1` 抬到 `>=1.3.1`,連同一段錯的註解一起改:1.0.1
  # 只是 CVE-2026-48710(0.49.3 以下 `request.url` 由呼叫端 `Host` 標頭串接
  # 而成,路徑邊界可被移動)的修補分界,擋不掉後面那些。OSV 逐版比對
  #(2026-08-08 查):1.0.1～1.3.0 每一版都還帶著 CVE-2026-54283(HIGH),
  # 1.3.1 才是第一個乾淨的版本(csp 釘死的也是 1.3.1)。
  # ⚠ 下限仍然不是「驗過的版本」:2026-08-06 實測(當時下限還是 1.0.1)解析到
  # **1.4.1**;0.49.3／1.3.1／1.4.1 三個版本都跑過本服務的測試套件與突變檢查,
  # 結論一致;要往上動之前請重跑,不要假設。
  "starlette>=1.3.1,<1.7",
  "uvicorn[standard]>=0.27,<0.53",
  # HTTP client → csp / pptx-renderer
  "httpx>=0.27,<1.0",
  # JWT verify (asymmetric RS256, JWKS)
  "python-jose[cryptography]>=3.3,<3.6",
  # Pydantic settings
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  # Redis pub/sub for cross-service token revocation
  "redis>=5.0,<8.2",
  # TTL cache for revocation_cache
  "cachetools>=5.3,<7.2",
  # 簡體 → 繁體轉換 (studio_text_normalizer)
  "opencc-python-reimplemented>=0.1.7,<0.1.8",
  # matplotlib 的數值依賴；釘下限避免氣隙 wheelhouse 凍進過舊版
  "numpy>=1.26,<2.6",
  # PPTX 生成路徑用,留給後續 phase 搬程式時即可 import
  # NOTE: python-pptx 不會用到 (PPTX 由 pptx-renderer Node service 渲染)
  # 但 diagram_renderer 用 Graphviz CLI subprocess,Docker 內裝 apt graphviz

  # ── Report / Mindmap / Infographic / Datatable artifacts(全新四種)──
  # Jinja2:報告 / 資訊圖表的 HTML 模板渲染
  "jinja2>=3.1,<3.2",
  # Playwright:HTML → PDF(headless Chromium · 對複雜 CSS 支援最完整)
  "playwright>=1.43,<1.63",
  # pandoc Python wrapper:HTML → DOCX(實際的 pandoc binary 由 apt 裝)
  "pypandoc>=1.13,<1.18",
  # matplotlib:資訊圖表 / 報告內的圖表(barchart / pie / line)
  # 用 Agg backend(無 X)輸出 PNG 嵌進 HTML
  "matplotlib>=3.8,<3.12",
  # openpyxl:資料表的 XLSX 輸出
  "openpyxl>=3.1,<3.2",
  # markdown-it-py:LLM 輸出 markdown 區塊轉乾淨 HTML 給模板嵌
  "markdown-it-py>=3.0,<4.3",
  # python-docx:讀 DOCX 輸出做最終 sanity check(不靠它 render)
  "python-docx>=1.1,<1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<0.25",
  "respx>=0.21,<0.23",          # httpx mock for csp_client tests
  "fakeredis>=2.20,<3.0",      # in-memory Redis for revocation_cache tests
  "freezegun>=1.4,<2.0",       # time travel for TTL tests
]

[build-system]
requires = ["setuptools>=68,<83", "wheel<0.48"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
