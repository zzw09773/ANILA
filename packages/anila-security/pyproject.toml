[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anila-security"
version = "0.1.0"
description = "ANILA shared security primitives: credential encryption and outbound URL validation"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anila_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
