# ANILA Agent Manifest
# Used by `anila-core register` to register this agent on the platform.

name: "{{AGENT_NAME}}"
description_for_router: "{{AGENT_DESCRIPTION}}"
endpoint_url: "{{ENDPOINT_URL}}"
api_version: "v1"

# 必填：這個 agent 底層使用的模型「名稱」（治理中心「模型」頁看得到的名稱）。
# 用量統計靠它把 token 歸到真實模型上，所以註冊時一定要有。
# 名稱撞名時才需要改用數字 id：base_model_id: 3
# 填錯不會靜默通過：CSP 會回「模型不存在」並列出目前可用的名稱。
base_model: "CHANGE-ME"

# 選填：預設分類等級（四級：無機密 / 營業秘密 / 密 / 機密；未填＝無機密）
# default_classification_level: "無機密"

# 選填：agent 版本字串
# version: "1.0.0"
