[build-system]
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[project]
name = "anila-core"
version = "0.14.0"
description = "ANILA Core — Python agent runtime foundation (chat / agent / memory / dispatch)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<2.14",
    # pydantic-settings was previously gated behind [rag] extras. Sprint 1
    # cleanup (CHANGELOG v0.5.0) makes it a core dep so router-mode env
    # loading works without extras.
    "pydantic-settings>=2.0,<2.16",
    "fastapi>=0.110,<0.142",
    # starlette 下限而非釘死:本套件是函式庫,釘死會和引用它的服務自己的
    # `starlette==` 打架(csp 就釘 1.3.1)。這個下限也是 anila-core-router
    # 與 ingestion-worker 唯一的 starlette 約束(兩者都只透過本套件間接取得)。
    # ⚠ 2026-08-08 把下限從 `>=1.0.1` 抬到 `>=1.3.1`,連同一段錯的註解一起改。
    # 1.0.1 是 CVE-2026-48710 的修補分界(0.49.3 以下 `request.url` 由呼叫端
    # `Host` 標頭串接而成,路徑邊界可被移動),舊註解據此宣稱「沒有它,氣隙
    # wheelhouse 仍可能凍進有洞的版本」——**那個下限做不到那句話**:OSV 逐版
    # 比對(2026-08-08 查)顯示 1.0.1～1.3.0 每一版都還帶著 CVE-2026-54283
    #(HIGH),1.3.1 才是第一個乾淨的版本。而離線解析(手上有哪些 wheel 就用
    # 哪個)正是這道下限唯一要發揮作用的時刻。
    # ⚠ 下限仍然不是「驗過的版本」:2026-08-06 實測(當時下限還是 1.0.1)解析
    # 到 **1.4.1**;0.49.3／1.3.1／1.4.1 都跑過本套件測試與突變檢查,結論一致;
    # 要往上動之前請重跑,不要假設。
    "starlette>=1.3.1,<1.7",
    "uvicorn[standard]>=0.29,<0.53",
    "httpx>=0.27,<0.29",
    "python-frontmatter>=1.1,<1.4",
    "pyyaml>=6.0,<6.1",
    "anyio>=4.0,<4.15",
    "sse-starlette>=2.0,<3.5",
    "aiofiles>=23.0,<25.2",
    # Phase 2 Sprint 1 (v0.6.0): the ingestion platform's central
    # AgentScopedPgVectorStore lives here, so asyncpg/pgvector are back
    # as core deps. v0.5.0 removed them when RAG-flavour code moved out;
    # the new ingestion platform makes pgvector an anila-core concern again.
    "asyncpg>=0.29,<0.32",
    "pgvector>=0.3,<0.6",
    # Sprint 5 (v0.7.0): centralised AES-GCM credential crypto for
    # user_llm_credentials lives in anila_core.security. Both CSP
    # (encrypt at create time) and ingestion-worker (decrypt at judge
    # time) consume it, so cryptography is a core dep — not optional.
    "cryptography>=42,<50.1",
    # Sprint 9 (Session abstraction): aiosqlite backs the default
    # anila_core.memory.sqlite_session adapter for single-process
    # deployments. Multi-process / HA setups can swap in a Postgres or
    # Redis Session implementing the same Protocol; aiosqlite stays a
    # base dep so the in-tree adapter ships out of the box.
    "aiosqlite>=0.20,<0.23",
    # zh-TW output normalizer (anila_core.text): pure-Python OpenCC
    # s2twp. Pin == CSP requirements.txt — normalization output is a
    # persistence data contract; dictionary drift across consumers is not ok.
    "opencc-python-reimplemented==0.1.7",
]

# v0.14.0 — `[rag]` extra restored. AgenticRAG/ on this branch is now
# a pure starter template (no production code depends on it). The
# heavy parser stack lives at ``anila_core.ingestion.parser_registry``
# and ``anila_core.providers.vision``; install with
# ``pip install anila-core[rag]`` to pull in pymupdf / python-docx / etc.
[project.optional-dependencies]
rag = [
    # Document parsing
    "pymupdf4llm>=0.0.10,<1.29",
    "pymupdf>=1.24,<1.29",          # embedded image extraction from PDFs
    "python-docx>=1.1,<1.3",
    "odfpy>=1.4,<1.5",
    "striprtf>=0.0.26,<0.0.33",       # RTF parser
    "Pillow>=10.0,<12.4",           # image loading for vision pipeline
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<0.23",
    "ruff>=0.4,<0.16",
    "mypy>=1.9,<1.21",
    "pyyaml>=6.0,<6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anila_core"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped fixtures (e.g. integration tests' shared PgPool) need
# a session-scoped event loop, otherwise asyncpg connections opened in
# fixture setup raise "attached to a different loop" when consumed by
# function-scoped tests. Default since pytest-asyncio 0.23 is "function"
# which broke our G1/G2 gates.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: tests that require a live pgvector + RLS database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
